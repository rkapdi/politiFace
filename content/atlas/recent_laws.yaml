  summary_truncated: false
- law_number: 119-126
  title: To require the Secretary of Agriculture to convey the Pleasant Valley Ranger District
    Administrative Site to Gila County, Arizona.
  bill: HR 837
  enacted_date: '2026-10-20'
  origin_chamber: House
  sponsor:
    bioguide: C001132
    name: Rep. Crane, Elijah [R-AZ-2]
  url: https://www.congress.gov/bill/119th-congress/house-bill/837
  summary: 'This bill directs the Forest Service to convey specified property to Gila County,
    Arizona, upon the county''s submission of a written request for such conveyance. The property,
    identified as the Gila County Area, consists of approximately 232.9 acres of National
    Forest System land located in the Tonto National Forest in Arizona.


    The county must use the land for the purposes of serving and supporting veterans. If any
    land conveyed under this bill ceases to be used for such purpose, all right, title, and
    interest in and to the land shall revert to the United States, at the discretion of the
    Forest Service.


    The conveyance must be made with a quitclaim deed and without consideration (value, such
    as payment, provided in exchange for the property).


    The Forest Service must not be required to provide any covenant or warranty for the land
    and improvements conveyed to the county under such conveyance.


    As a condition of the conveyance, the county must pay all the costs associated with the
    conveyance, including any (1) surveys, (2) environmental analysis or resource survey required
    under federal law, and (3) analysis required to comply with certain provisions of the
    National Historic Preservation Act.'
