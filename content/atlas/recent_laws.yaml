- law_number: 119-133
  title: Chiricahua National Park Act
  bill: HR 6380
  enacted_date: '2026-10-20'
  origin_chamber: House
  sponsor:
    bioguide: C001133
    name: Rep. Ciscomani, Juan [R-AZ-6]
  url: https://www.congress.gov/bill/119th-congress/house-bill/6380
  summary: 'Chiricahua National Park Act


    This bill redesignates the Chiricahua National Monument in Arizona as the Chiricahua National
    Park.


    The bill directs the National Park Service (NPS) to (1) ensure the protection of traditional
    cultural and religious sites in the park, and (2) provide access to those sites by members
    of Indian tribes for traditional cultural and customary uses.


    Upon the request of an Indian tribe, the NPS may temporarily close to general public use
    one or more specific areas of the park to protect traditional cultural and customary uses
    in the area by members of the tribe. The closure must be limited to the smallest practicable
    area for the minimum period necessary for the traditional cultural and religious activities.'
  summary_version: Introduced in House
  summary_date: '2025-12-03'
  summary_truncated: false
- law_number: 119-132
  title: Vicksburg National Military Park Boundary Modification Act
  bill: HR 4467
  enacted_date: '2026-10-20'
  origin_chamber: House
  sponsor:
    bioguide: T000193
    name: Rep. Thompson, Bennie G. [D-MS-2]
  url: https://www.congress.gov/bill/119th-congress/house-bill/4467
  summary: 'Vicksburg National Military Park Boundary Modification Act


    This bill directs the Department of the Interior to convey approximately 7 acres of specified
    land (in two parcels) within the Vicksburg National Military Park to Mississippi for an
    interpretive center.


    The conveyed land must facilitate public access to the park, may not be used in a manner
    that adversely impacts the park''s resources or visitor experience, and remains subject
    to any use restriction that Interior determines is appropriate.


    Interior must convey the land by quitclaim deed and without consideration, such as payment.
    Upon the conveyance of the land, Interior must modify the park''s boundary to exclude
    the land.'
  summary_version: Reported to House
