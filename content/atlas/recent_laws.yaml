- law_number: 119-131
  title: Enhancing Detection of Human Trafficking Act
  bill: HR 4307
  enacted_date: '2026-10-20'
  origin_chamber: House
  sponsor:
    bioguide: W000798
    name: Rep. Walberg, Tim [R-MI-5]
  url: https://www.congress.gov/bill/119th-congress/house-bill/4307
  summary: 'Enhancing Detection of Human Trafficking Act


    This act requires the Department of Labor to provide training and education to its employees
    on how to effectively assist law enforcement in detecting human trafficking.


    The act directs Labor to determine which employees should receive the training and education
    based on their official duties. Further, it requires the training and education to include
    information that is appropriate for the employees'' location or environment; that reflects
    current trends and best practices for the location or environment; and that is relevant
    to detecting human trafficking, identifying suspected victims, and referring potential
    cases to the Department of Justice and other appropriate authorities.'
  summary_version: Public Law
  summary_date: '2026-10-20'
  summary_truncated: false
- law_number: 119-130
  title: Southcentral Foundation Land Transfer Act of 2025
  bill: HR 3620
  enacted_date: '2026-10-20'
  origin_chamber: House
  sponsor:
    bioguide: B001323
    name: Rep. Begich, Nicholas J. [R-AK-At Large]
  url: https://www.congress.gov/bill/119th-congress/house-bill/3620
  summary: 'Southcentral Foundation Land Transfer Act of 2025


    This bill directs the Department of Health and Human Services (HHS) to convey approximately
    3.4 acres in Anchorage, Alaska, to the Southcentral Foundation (SCF) for use in connection
    with health and social services programs.


    The conveyance must be made by warranty deed. The conveyance may not (1) require any consideration
    (such as payment) from the SCF for the property; (2) impose any obligation, term, or condition
    on the SCF relating to that property; or (3) allow for any U.S. reversionary interest
    in the property.


    HHS must be accorded any easement or access to the property as may be reasonably necessary
    to satisfy any retained obligation or liability of HHS.


    The bill prohibits the SCF from being liable for certain environmental contamination that
    occurred on or before the date on which the property is conveyed to the SCF. In turn,
    HHS may not be liable for any contamination that occurred after the date that the SCF
    controlled, occupied, and used the property.'
  summary_version: Reported to House
  summary_date: '2025-12-09'
  summary_truncated: false
- law_number: 119-129
  title: Romance Scam Prevention Act
  bill: HR 2481
  enacted_date: '2026-10-20'
  origin_chamber: House
  sponsor:
    bioguide: V000129
    name: Rep. Valadao, David G. [R-CA-22]
  url: https://www.congress.gov/bill/119th-congress/house-bill/2481
  summary: 'Romance Scam Prevention Act


    This act requires online dating service providers (i.e., mobile applications or websites)
    to provide users with a fraud ban notification if the user has established an account
    with the service and received a message through the service from a banned user of the
    service.


    The fraud ban notification must include (1) the username or other profile identifier of
    the banned user and the most recent time when the user who is receiving the notification
    sent or received a message through the service to or from the banned user, (2) a statement
    that the banned user may have been using a false identity or attempting to defraud other
    users, (3) a statement that the user should not send cash (or another form of currency)
    or personal financial information to another user, (4) information about avoiding online
    fraud (e.g., a link to another website or a disclosure), and (5) contact information for
    the provider''s customer service department.


    The act provides for enforcement of these requirements by the Federal Trade Commission
    and state attorneys general.'
  summary_version: Public Law
  summary_date: '2026-10-20'
  summary_truncated: false
