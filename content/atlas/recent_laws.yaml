    name: Rep. Kennedy, Mike [R-UT-3]
  url: https://www.congress.gov/bill/119th-congress/house-bill/7831
  summary: 'License to Drill Act


    This act extends through FY2037 the Bureau of Land Management’s (BLM’s) authority to collect
    oil and gas permit processing fees. For each new permit application, BLM collects a fee
    that is transferred to the BLM Permit Processing Improvement Fund. (Under current law,
    the fees are authorized through FY2026.)'
