- law_number: 119-127
  title: Critical Infrastructure Manufacturing Feasibility Act
  bill: HR 1721
  enacted_date: '2026-10-20'
  origin_chamber: House
  sponsor:
    bioguide: M001215
    name: Rep. Miller-Meeks, Mariannette [R-IA-1]
  url: https://www.congress.gov/bill/119th-congress/house-bill/1721
  summary: 'Critical Infrastructure Manufacturing Feasibility Act


    This bill requires the Department of Commerce to study and report on products that are
    in high demand across the critical infrastructure sectors. Critical infrastructure sectors
    are those whose assets, systems, and networks are vital to national security, the economy,
    public health or safety, or any combination of those matters.


    The study must (1) identify the products in high demand across those sectors that are
    being imported due to manufacturing, material, or supply chain constraints; and (2) analyze
    the costs, benefits, and feasibility of manufacturing those products in the United States.'
  summary_version: Introduced in House
