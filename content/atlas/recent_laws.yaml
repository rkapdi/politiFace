- law_number: 119-116
  title: Modernizing Access to Our Public Oceans Act
  bill: S 759
  enacted_date: '2026-09-25'
  origin_chamber: Senate
  sponsor:
    bioguide: C001098
    name: Sen. Cruz, Ted [R-TX]
  url: https://www.congress.gov/bill/119th-congress/senate-bill/759
  summary: 'Modernizing Access to Our Public Oceans Act


    This act directs the National Oceanic and Atmospheric Administration (NOAA) to standardize
    and publish geospatial data related to public recreational use of federal waterways (e.g.,
    boating and fishing).


    Under the act, NOAA must consult with relevant stakeholders (including state and local
    governments, Indian tribes, and Native Hawaiian organizations) to develop and adopt standards
    for the coordination and dissemination of geospatial data relating to fishing restrictions
    and recreational vessels'' use of federal waterways, including the exclusive economic
    zone of the United States (EEZ). (The EEZ generally includes waters between 3 and 200
    miles seaward from the U.S. coastline.)


    Within four years after the act is enacted, NOAA must provide geographic information system
    data on a public website that identifies and describes the locations where and conditions
    under which certain recreational activities are restricted in federal waterways. Specifically,
    the website must identify (1) locations where fishing restrictions are imposed, (2) areas
    in the EEZ with restrictions on specified recreational vessel types, and (3) federally
    protected areas (e.g., National Marine Sanctuaries). NOAA must also continue to provide
    digitized navigation information related to the EEZ and make the information available
    on the website to the extent practicable.


    The act allows NOAA to coordinate and partner with nonfederal entities to carry out this
    act. It also directs NOAA to work with other federal agencies to ensure compatibility
    and interoperability among federal databases with respect to collecting and disseminating
    geospatial data related to the public outdoor recreational use of the EEZ.'
  summary_version: Public Law
  summary_date: '2026-09-25'
  summary_truncated: false
- law_number: 119-115
  title: A bill to designate the General George C. Marshall House, in the Commonwealth of
    Virginia, as an affiliated area of the National Park System, and for other purposes.
  bill: S 603
  enacted_date: '2026-09-25'
  origin_chamber: Senate
  sponsor:
    bioguide: K000384
    name: Sen. Kaine, Tim [D-VA]
  url: https://www.congress.gov/bill/119th-congress/senate-bill/603
  summary: 'This bill establishes the General George C. Marshall House in Leesburg, Virginia,
    as an affiliated area of the National Park System to promote public appreciation of the
    historic contributions made by George Catlett Marshall, Jr. (George Catlett Marshall,
    Jr. served as Army Chief of Staff during World War II, and later as Secretary of State,
    president of the American Red Cross, and Secretary of Defense.)


    The bill designates the George C. Marshall International Center as the management entity
    for the affiliated area. The Department of the Interior must enter into an agreement with
    the center that describes the roles and responsibilities for management of the affiliated
    area. Further, Interior may provide technical assistance and enter into cooperative agreements
    with the center for the purpose of providing financial assistance for the marketing, marking,
    interpretation, and preservation of the affiliated area.'
  summary_version: Passed Senate
  summary_date: '2026-05-20'
