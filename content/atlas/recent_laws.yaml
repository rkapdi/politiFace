  summary_truncated: false
- law_number: 119-120
  title: Billion Dollar Boondoggle Act of 2025
  bill: S 766
  enacted_date: '2026-10-07'
  origin_chamber: Senate
  sponsor:
    bioguide: E000295
    name: Sen. Ernst, Joni [R-IA]
  url: https://www.congress.gov/bill/119th-congress/senate-bill/766
  summary: 'Billion Dollar Boondoggle Act


    This act requires the Office of Management and Budget (OMB) to collect information from
    federal agencies and report to Congress regarding projects that are behind schedule or
    have expenditures that have exceeded the original cost estimate.


    Specifically, the act requires OMB to issue guidance directing federal agencies to annually
    submit specified information to OMB regarding certain federally funded projects that (1)
    are more than five years behind schedule, or (2) have expenditures that are at least $1
    billion more than the original cost estimate for the project.


    Among other information, the agencies must submit to OMB


    a description of each project;


    an explanation of any change to the original scope of the project;


    the original and current expected dates for the completion of the project;


    the original and current cost estimates adjusted for inflation;


    an explanation for any delays in completing the project or increases in the cost; and


    the amount of and rationale for any award, incentive fee, or other type of bonus awarded
    for the project.


    The act also requires OMB to submit an annual report to Congress containing the information
    submitted by the agencies and post the report on the OMB website.'
  summary_version: Public Law
  summary_date: '2026-10-07'
  summary_truncated: false
- law_number: 119-119
  title: Improving Social Security’s Service to Victims of Identity Theft Act
  bill: HR 5345
  enacted_date: '2026-10-07'
  origin_chamber: House
  sponsor:
    bioguide: K000392
    name: Rep. Kustoff, David [R-TN-8]
  url: https://www.congress.gov/bill/119th-congress/house-bill/5345
  summary: 'Improving Social Security''s Service to Victims of Identity Theft Act


    This act requires the Social Security Administration to provide a single point of contact
    for any individual whose Social Security number has been misused or whose Social Security
    card has been lost in transport. The point of contact must track cases to completion and
    coordinate with other units to resolve issues as quickly as possible.


    The point of contact must consist of a team or subset of specially trained employees.
    Staffing may change provided there are procedures in place to ensure continuity of records
    and notify affected individuals when appropriate.'
  summary_version: Public Law
  summary_date: '2026-10-07'
  summary_truncated: false
- law_number: 119-118
