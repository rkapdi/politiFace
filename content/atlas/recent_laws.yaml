- law_number: 119-125
  title: Clergy Act
  bill: HR 227
  enacted_date: '2026-10-20'
  origin_chamber: House
  sponsor:
    bioguide: F000480
    name: Rep. Fong, Vince [R-CA-20]
  url: https://www.congress.gov/bill/119th-congress/house-bill/227
  summary: 'Clergy Act


    This act establishes a two-year window for members of the clergy who have opted out of
    Social Security and Medicare taxes (and are thus ineligible for benefits under those programs)
    to opt back in.


    Under current law, certain ministers, members of religious orders, and Christian Science
    practitioners who object to participation in public insurance programs on religious or
    conscientious grounds may apply to the Internal Revenue Service (IRS) for an exemption
    from Social Security and Medicare taxes on ministerial earnings. Individuals who are approved
    for the exemption do not receive Social Security or Medicare benefits in retirement unless
    they have qualifying credits from other employment. The exemption is irrevocable.


    Under the act, clergy members may choose to revoke their exemption by filing an application
    with the IRS by the due date of their federal income tax return for the second taxable
    year after December 31, 2028 (i.e., April 15, 2031, unless an individual obtains an extension
    to file their taxes). A clergy member may choose for the revocation to take effect in
    taxable year 2029 or taxable year 2030. A revocation under the act is permanent.


    Clergy members who opt back in will generally need 10 years of covered employment (40
    credits) to be eligible for Social Security and Medicare benefits, as is currently required
    for these programs.


    The IRS must develop a plan to inform clergy members of their eligibility to revoke prior
    exemptions, pursuant to the act''s changes.'
  summary_version: Public Law
  summary_date: '2026-10-20'
  summary_truncated: false
- law_number: 119-124
  title: Retire through Ownership Act
  bill: S 2403
  enacted_date: '2026-10-15'
  origin_chamber: Senate
  sponsor:
    bioguide: M001198
    name: Sen. Marshall, Roger [R-KS]
  url: https://www.congress.gov/bill/119th-congress/senate-bill/2403
  summary: 'Retire through Ownership Act


    This bill allows the fiduciary of an Employee Stock Ownership Plan (ESOP) to rely on a
    valuation provided by an independent valuation expert or business appraiser in determining
    the fair market value of the plan''s assets if the assets are not securities for which
    there is a generally recognized market and the expert or appraiser follows specified methodologies.


    In general, ESOPs are defined contribution pension plans where employees accrue shares
    of their employers'' stock in individual accounts as part of their compensation. After
    separating from employment or retiring, employees receive the cash value of their shares.


    Under the bill, an independent expert or appraiser must adhere to the methodology established
    under the Internal Revenue Service Ruling 59-60, which prescribes the factors a professional
    business appraiser should consider in forming a valuation of the stock for a closely held
    business.'
  summary_version: Passed Senate
  summary_date: '2025-10-09'
  summary_truncated: false
- law_number: 119-123
  title: Illegal Red Snapper and Tuna Enforcement Act
  bill: S 283
  enacted_date: '2026-10-15'
  origin_chamber: Senate
  sponsor:
    bioguide: C001098
    name: Sen. Cruz, Ted [R-TX]
  url: https://www.congress.gov/bill/119th-congress/senate-bill/283
  summary: 'Illegal Red Snapper and Tuna Enforcement Act


    This act directs the National Oceanic and Atmospheric Administration (NOAA) and the National
    Institute of Standards and Technology (NIST) to jointly develop a standard methodology
    for identifying the country of origin of seafood to support enforcement against illegal,
    unreported, and unregulated fishing (IUU fishing) and seafood fraud.


    NOAA and NIST must consult with U.S. Customs and Border Protection and the Coast Guard
    in developing the methodology, which must use chemical analysis to identify the country
    of origin of seafood. The methodology must be consistent with the needs of federal and
    state law enforcement agencies in combating IUU fishing and seafood fraud. The methodology
    must also include a portable field kit and, to the extent practicable, be appropriate
    for testing prepared food (including raw preparations of seafood such as sushi). The agencies
    must conduct pilot studies of the methodology on red snapper and tuna.


    Within two years after the act''s enactment, NIST must report to Congress regarding the
    methodology and a plan for operationalizing it. The report must explain any aspects of
    its methodology that are impracticable, whether additional research would make the methodology
    practicable, and whether an alternate approach might be practicable.'
  summary_version: Public Law
  summary_date: '2026-10-15'
  summary_truncated: false
- law_number: 119-122
  title: Crow Tribe Water Rights Settlement Amendments Act of 2025
  bill: S 240
  enacted_date: '2026-10-15'
  origin_chamber: Senate
  sponsor:
    bioguide: D000618
    name: Sen. Daines, Steve [R-MT]
  url: https://www.congress.gov/bill/119th-congress/senate-bill/240
  summary: 'Crow Tribe Water Rights Settlement Amendments Act of 2025


    This bill revises the water rights settlement agreement entered into by the Crow Tribe
    of Montana and Montana.


    The Crow Tribe Water Rights Settlement Act of 2010 ratified, authorized, and confirmed
    the water rights compact between the tribe and Montana. Among other provisions, this settlement
    act authorized the Bureau of Reclamation to plan, design and construct the following two
    major projects on the Crow Reservation: (1) the rehabilitation and improvement of the
    Crow Irrigation Project (CIP); and (2) the planning, design, and construction of the MR&I
    System (the municipal, rural, and industrial water system of the Crow Reservation).


    Among other provisions, the bill revises the settlement act to


    replace references to the MR&I System with MR&I Projects;


    establish a nontrust, interest-bearing account (to be known as the Crow CIP Implementation
    Account) to allow Reclamation to continue to work on the rehabilitation of the CIP;


    create a new MR&I Projects Account, through which the tribe must use funds for activities
    related to water production, treatment, or delivery infrastructure; and


    extend by five years (to 2030) the period during which the tribe has the exclusive right
    to construct hydropower facilities on the Yellowtail Afterbay Dam in Montana.'
  summary_version: Introduced in Senate
  summary_date: '2025-01-24'
  summary_truncated: false
- law_number: 119-121
  title: American Music Tourism Act of 2025
  bill: S 195
  enacted_date: '2026-10-09'
  origin_chamber: Senate
  sponsor:
    bioguide: B001243
    name: Sen. Blackburn, Marsha [R-TN]
  url: https://www.congress.gov/bill/119th-congress/senate-bill/195
  summary: 'American Music Tourism Act of 2025


    This bill directs the National Travel and Tourism Office (NTTO) of the Department of Commerce
    to promote tourism to music-related and sports attractions.


    The bill requires NTTO to promote domestic and international travel and tourism to U.S.
    music festivals, concert venues, and other music-related attractions and locations. The
    bill also expands NTTO''s current mandate to facilitate sports and recreation events and
    activities to include the promotion of international travel and tourism to such activities
    in the United States.


    NTTO must report its activities and findings to Congress within one year after the bill''s
    enactment and, thereafter, every two years.'
  summary_version: Introduced in Senate
