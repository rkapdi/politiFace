- law_number: 119-103
  title: Continuing Appropriations and Extensions Act, 2027
  bill: HR 6500
  enacted_date: '2026-09-02'
  origin_chamber: House
  sponsor:
    bioguide: S001195
    name: Rep. Smith, Jason [R-MO-8]
  url: https://www.congress.gov/bill/119th-congress/house-bill/6500
  summary: 'Continuing Appropriations and Extensions Act, 2027


    This act provides continuing FY2027 appropriations for federal agencies through December
    11, 2026, and extends various expiring programs and authorities.


    DIVISION A--CONTINUING APPROPRIATIONS ACT, 2027


    Continuing Appropriations Act, 2027


    This division provides continuing FY2027 appropriations to federal agencies through the
    earlier of December 11, 2026, or the enactment of the applicable appropriations act. It
    is known as a continuing resolution (CR) and prevents a government shutdown that would
    otherwise occur if the FY2027 appropriations bills have not been enacted when FY2027 begins
    on October 1, 2026.


    The CR funds most programs and activities at the FY2026 levels with several exceptions
    that provide funding flexibility or additional appropriations for various programs. For
    example, the CR includes exceptions for


    the Special Supplemental Nutrition Program for Women, Infants, and Children (WIC);


    Small Business Administration loans;


    the Disaster Relief Fund;


    the Indian Health Service;


    the Department of Justice; and


    wildfire suppression activities.


    For more information on this division, see CRS Report R49353, Overview of Continuing Appropriations
    for FY2027 (Division A of P.L. 119-103).


    DIVISION B--AUTHORIZING EXTENSIONS


    This division extends various expiring programs and authorities, including certain programs
    related to agriculture and foreign trade.


    (Sec. 2001) This section reauthorizes the United States Grain Standards Act, which authorizes
    the Department of Agriculture to establish official marketing standards for grains.


    Specifically, this section extends the authority of the Federal Grain Inspection Service
    (FGIS) through December 11, 2026, to (1) collect fees for required federal supervision
    of official inspections and weighing services provided by designated official agencies
    and state agencies, and (2) maintain the Grain Inspection Advisory Committee.


    The section also extends through FY2027 (1) the cap on FGIS''s administrative and supervisory
    costs, and (2) authorization for FGIS grain standards development and maintenance activities.'
  summary_version: Public Law
  summary_date: '2026-09-02'
  summary_truncated: true
- law_number: 119-102
  title: Emergency Conservation Program Improvement Act of 2025
  bill: S 629
  enacted_date: '2026-07-12'
  origin_chamber: Senate
  sponsor:
    bioguide: F000463
    name: Sen. Fischer, Deb [R-NE]
  url: https://www.congress.gov/bill/119th-congress/senate-bill/629
  summary: 'Emergency Conservation Program Improvement Act of 2025


    This act revises the Emergency Conservation Program (ECP) and the Emergency Forest Restoration
    Program (EFRP) to expand eligibility for payments to agricultural producers and owners
    of forest land impacted by natural disasters. The act also provides additional options
    to receive an advance on cost-sharing payments before carrying out emergency measures.


    The act expands advance ECP payments to include the replacement, repair, or restoration
    of farmland or conservation structures requiring an immediate response. Producers may
    receive an advance on cost-sharing payments for 75% of the cost of the replacement and
    50% of the cost of the repair or restoration. Current law limits advance payments to 25%
    of the cost of the repair or replacement of fencing.


    Under EFRP, the act allows owners of nonindustrial private forest land impacted by a natural
    disaster to receive an advance on cost-sharing payments for up to 75% of the cost of the
    emergency measures. Currently, advance payments are not available under the program.


    ECP and EFRP recipients must use the funds within 180 days after the funds are disbursed.
    This provides additional time to ECP recipients who currently must use the funds within
    60 days.


    The act also expands eligibility for payments under the programs to include emergency
    measures to address damages caused by (1) a wildfire that is not caused naturally, if
    the damage is caused by the spread of the wildfire due to natural causes; and (2) a wildfire
    that is caused by the federal government.'
  summary_version: Public Law
  summary_date: '2026-07-12'
  summary_truncated: false
- law_number: 119-101
  title: 21st Century ROAD to Housing Act
  bill: HR 6644
  enacted_date: '2026-07-11'
  origin_chamber: House
  sponsor:
    bioguide: H001072
    name: Rep. Hill, J. French [R-AR-2]
  url: https://www.congress.gov/bill/119th-congress/house-bill/6644
  summary: '21st Century ROAD to Housing Act


    This act establishes and modifies various federal housing programs.


    TITLE I--OPPORTUNITIES FOR HOUSING


    (Sec. 101) This section requires the Department of Housing and Urban Development (HUD)
    to review the performance of organizations that receive grants to provide housing counseling
    services. Such review may take into account the performance of individual counselors.


    HUD may terminate assistance for such organizations that are not in compliance with the
    program''s requirements.


    (Sec. 102) This section requires HUD to establish best practices and provide technical
    assistance to state and local entities to support permitting for point-access block buildings
    (i.e., apartments with a single staircase to access the dwelling units and that are no
    more than six stories high).


    It also allows HUD to award competitive grants to state and local entities to assess the
    feasibility, safety, and cost-effectiveness of such buildings. This authority expires
    after seven years.


    (Sec. 103) This section exempts from environmental review specified rural housing projects
    located on an infill site (i.e., a site served by existing infrastructure, including water
    lines, sewer lines, and roads).


    (Sec. 104) This section requires Community Development Block Grant (CDBG) grantees to
    maintain a publicly accessible, searchable database identifying undeveloped land owned
    by the grantee.


    (Sec. 105) This section authorizes the Federal Housing Administration (FHA) to establish
    a four-year pilot program to increase the number of mortgages originated with a principal
    balance of $100,000 or less.


    (Sec. 106) This section requires HUD to establish a three-year pilot program to award
    grants to public housing agencies (PHAs) and owners of federally assisted rental housing
    to install temperature sensors in residential dwelling units.


    (Sec. 107) This section requires HUD to publish guidelines and best practices for state
    and local zoning frameworks that support production of adequate housing to meet the needs
    of communities and provide housing opportunities for individuals of all income levels.


    TITLE II--BUILDING MORE IN AMERICA'
  summary_version: Public Law
  summary_date: '2026-07-11'
  summary_truncated: true
