- law_number: 119-108
  title: Doug LaMalfa Federal Disaster Tax Relief Certainty Act
  bill: HR 5366
  enacted_date: '2026-09-11'
  origin_chamber: House
  sponsor:
    bioguide: S001214
    name: Rep. Steube, W. Gregory [R-FL-17]
  url: https://www.congress.gov/bill/119th-congress/house-bill/5366
  summary: 'Doug LaMalfa Federal Disaster Tax Relief Certainty Act


    This act extends the federal tax deduction for qualified disaster-related personal casualty
    losses and the exclusion from gross income of qualified wildfire relief payments.


    Under current law, unreimbursed personal casualty losses arising in a qualified disaster
    area (qualified disaster-related personal casualty losses) are deductible (as an itemized
    tax deduction or as part of the standard tax deduction) if such losses exceed $500 per
    casualty. A qualified disaster area is an area with respect to which a major disaster
    has been declared during the period beginning in 2020 and ending 60 days after July 4,
    2025, if the incident period begins on or after December 28, 2019, and on or before July
    4, 2025.


    The act extends the federal tax deduction for qualified disaster-related personal casualty
    losses by defining a qualified disaster area as an area with respect to which a major
    disaster has been declared if the incident period begins on or after December 28, 2019,
    and before January 1, 2027.


    The act provides that the exclusion from gross income of qualified wildfire relief payments
    applies to such payments attributable to forest or range fires declared a federal disaster
    after 2014 and before 2027, regardless of when such payments are received. (Currently,
    qualified wildfire relief payments attributable to forest or range fires declared a federal
    disaster after 2014 and received after 2019 and before 2026 may be excluded from gross
    income.)


    The act also provides statutory authority for several related tax rules.'
  summary_version: Public Law
  summary_date: '2026-09-11'
  summary_truncated: false
