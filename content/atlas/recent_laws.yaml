  summary: 'Cape Fox Land Entitlement Finalization Act of 2025


    This act waives a statutory core township selection requirement for the Cape Fox Corporation
    and allows Cape Fox to receive other lands to fulfill its remaining land entitlement.
    Cape Fox is an Alaska Native village corporation for the Alaska Native village of Saxman,
    Alaska.


    Specifically, the act states that Cape Fox shall not be required to receive its previously
    selected land of approximately 185 acres located within the township in which the Alaska
    Native village of Saxman, Alaska, is located. Instead, the act allows Cape Fox to receive
    land outside of Cape Fox''s current exterior selection boundary upon written notice of
    the new selection to the Department of the Interior.


    In particular, if Cape Fox submits written notice of its selection of approximately 180
    acres of surface land within the Tongass National Forest in Alaska to Interior within
    90 days of the act''s enactment, then Interior must convey the federal land to Cape Fox.
    Upon conveyance of the surface estate of the federal land to Cape Fox, Interior must convey
    the subsurface estate of the federal land to Sealaska Corporation (the Alaska Native regional
    corporation representing southeastern Alaska).


    The act reserves a public access easement on the federal land conveyed to Cape Fox and
    Sealaska.'
  summary_version: Public Law
  summary_date: '2026-05-19'
  summary_truncated: false
- law_number: 119-92
  title: Investing in All of America Act of 2025
  bill: HR 2066
  enacted_date: '2026-05-19'
  origin_chamber: House
  sponsor:
    bioguide: M001204
    name: Rep. Meuser, Daniel [R-PA-9]
  url: https://www.congress.gov/bill/119th-congress/house-bill/2066
  summary: 'Investing in All of America Act of 2025


    This bill modifies the limit on the amount of financing available to a Small Business
    Investment Company (SBIC) from the Small Business Administration (SBA). It also expands
    the definition of private capital with respect to SBICs.


    Specifically, the bill reduces the maximum outstanding financing available to an SBIC
    from 300% to 200% of the SBIC''s private capital. The bill increases from $350 million
    to $475 million the maximum financing available to two or more commonly controlled SBICs
    that make quarterly or semiannual interest payments.


    The bill also expands the amounts that may be excluded from the calculation of the financing
    limit to include the amounts an SBIC invests in (1) rural areas, (2) certain technology
    categories, or (3) small manufacturers. The bill revises the cap on such excluded amounts
    to the lesser of $125 million or the aggregate of 50% of the private capital of the SBIC.


    Additionally, the bill expands what is considered the private capital of an SBIC to include
    funds obtained from the business revenue of additional government-sponsored corporations
    and funds invested by the trust or endowment of a college or university.'
  summary_version: Reported to House
  summary_date: '2025-08-15'
  summary_truncated: false
- law_number: 119-91
  title: Sloan Canyon Conservation and Lateral Pipeline Act
  bill: HR 972
  enacted_date: '2026-05-19'
  origin_chamber: House
  sponsor:
    bioguide: T000468
    name: Rep. Titus, Dina [D-NV-1]
  url: https://www.congress.gov/bill/119th-congress/house-bill/972
  summary: 'Sloan Canyon Conservation and Lateral Pipeline Act


    This act expands the boundaries of the Sloan Canyon National Conservation Area in Clark
    County, Nevada, and grants rights-of-way through the conservation area and other land
    administered by the Bureau of Land Management (BLM) for the construction of a water transmission
    pipeline and related facilities.


    Specifically, the act requires the BLM to grant certain rights-of-way to the Southern
    Nevada Water Authority (SNWA) for the purposes of (1) performing geotechnical investigations
    within the rights-of-way, and (2) constructing and operating a water pipeline and related
    facilities.


    The rights-of-way may not be located through or under areas designated as wilderness,
    and construction of the pipeline may not permanently adversely affect surface resources
    within the conservation area. The BLM may place other reasonable terms and conditions
    on the issuance of rights-of-way as necessary to protect the conservation area’s resources.


    In tunneling the water pipeline, SNWA may excavate and dispose of sand, gravel, minerals,
    and other materials as needed. The BLM must enter into a memorandum of understanding with
    SNWA to identify federal land on which SNWA may dispose of such materials.


    The act also adds approximately 9,290 acres of land to the conservation area. This expansion
    of the conservation area is subject to valid existing rights (e.g., utility transmission
    rights), must not preclude authorized activities within existing rights-of-way or corridors,
    and must not preclude the BLM from authorizing new utility rights-of-way.'
  summary_version: Public Law
  summary_date: '2026-05-19'
  summary_truncated: false
- law_number: 119-90
  title: A bill to require the Federal Energy Regulatory Commission to extend the time period
    during which licensees are required to commence construction of certain hydropower projects.
  bill: S 1020
  enacted_date: '2026-05-11'
  origin_chamber: Senate
  sponsor:
    bioguide: D000618
    name: Sen. Daines, Steve [R-MT]
  url: https://www.congress.gov/bill/119th-congress/senate-bill/1020
  summary: 'This act authorizes the Federal Energy Regulatory Commission (FERC) to extend
    construction deadlines for hydropower projects that were issued a license before March
    13, 2020. FERC is authorized, upon the request of the licensees, to extend the deadline
    for beginning construction on such projects an additional six years beyond the eight-year
    extension FERC is authorized to provide under current law. The extension must consist
    of no more than three consecutive two-year periods.


    The act also provides that FERC may reinstate certain expired licenses for projects with
    construction deadlines extended under this act, effective as of the date they expire.'
  summary_version: Public Law
  summary_date: '2026-05-11'
  summary_truncated: false
- law_number: 119-89
  title: Rural Broadband Protection Act of 2025
  bill: S 98
  enacted_date: '2026-05-11'
  origin_chamber: Senate
  sponsor:
    bioguide: C001047
    name: Sen. Capito, Shelley Moore [R-WV]
  url: https://www.congress.gov/bill/119th-congress/senate-bill/98
  summary: 'Rural Broadband Protection Act of 2025


    This act requires the Federal Communications Commission (FCC) to vet the qualifications
    of applicants for certain funding programs that support affordable broadband deployment
    in high-cost areas (e.g., rural communities).


    Specifically, the FCC must develop a vetting process for applicants seeking funding under
    high-cost universal service programs for the deployment of a broadband-capable network
    and the provision of supported services over the network. The FCC must require applicants
    to submit a proposal that contains sufficient detail and documentation for the FCC to
    ascertain that the applicant possesses the technical, financial, and operational capabilities
    related to the proposed deployment and has a reasonable business plan. The FCC must evaluate
    applications against reasonable and well-established standards and must consider each
    applicant’s history of compliance with the requirements of other government broadband
    funding programs.


    The FCC must establish this vetting process through a rulemaking proceeding. After the
    rule is finalized, funds may only be awarded to applicants that satisfy the standards
    established therein.


    Finally, the FCC must set financial penalties for applicants that default in some manner
    during the evaluation process before they are authorized to begin receiving support.'
  summary_version: Public Law
  summary_date: '2026-05-11'
  summary_truncated: false
- law_number: 119-88
  title: Tribal Trust Land Homeownership Act of 2025
  bill: S 723
  enacted_date: '2026-05-04'
  origin_chamber: Senate
  sponsor:
    bioguide: T000250
    name: Sen. Thune, John [R-SD]
  url: https://www.congress.gov/bill/119th-congress/senate-bill/723
  summary: 'Tribal Trust Land Homeownership Act of 2025


    This act sets forth requirements for the processing of a proposed residential leasehold
    mortgage, business leasehold mortgage, land mortgage, or right-of-way document by the
    Bureau of Indian Affairs (BIA). The BIA must notify lenders upon receipt of such documentation,
    perform a preliminary review of such documents not later than 10 days after receipt, and
    approve or disapprove of such documents within 20 or 30 days, depending on the type of
    application.


    Additionally, the act sets forth requirements for the BIA regarding (1) response times
    for the completion of certified title status reports, (2) notification of delays in processing,
    and (3) the form of notices and delivery of certain reports.


    The act also provides relevant federal agencies and Indian tribes with read-only access
    to the Trust Asset and Accounting Management System maintained by the BIA.


    The Government Accountability Office must report on digitizing documents for the purpose
    of streamlining and expediting the completion of mortgage packages for residential mortgages
    on Indian land.


    Finally, the act establishes within the BIA''s Division of Real Estate Services the position
    of Realty Ombudsman.'
  summary_version: Public Law
  summary_date: '2026-05-04'
  summary_truncated: false
- law_number: 119-87
  title: A bill to amend the FISA Amendments Act of 2008 to extend the authorities of title
    VII of the Foreign Intelligence Surveillance Act of 1978, and for other purposes.
  bill: S 4465
  enacted_date: '2026-04-30'
  origin_chamber: Senate
  sponsor:
    bioguide: C001095
    name: Sen. Cotton, Tom [R-AR]
  url: https://www.congress.gov/bill/119th-congress/senate-bill/4465
  summary: 'This act extends the authorities of Title VII of the Foreign Intelligence Surveillance
    Act (FISA) until June 12, 2026.


    Title VII of FISA generally addresses electronic surveillance and other methods of acquiring
    foreign intelligence information that are directed at targets outside the United States.
    Title VII includes surveillance under Section 702, which concerns acquiring communications
    of non-U.S. persons believed to be outside the United States to obtain foreign intelligence
    information. Information about U.S. persons may incidentally be acquired by this type
    of surveillance and subsequently queried (searched) under certain circumstances.


    For additional information see


    CRS In Focus, IF11451 Foreign Intelligence Surveillance Act (FISA); and


    CRS Report, R48592 FISA Section 702 and the 2024 Reforming Intelligence and Securing America
    Act.'
  summary_version: Public Law
  summary_date: '2026-04-30'
  summary_truncated: false
