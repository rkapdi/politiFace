- law_number: 119-136
  title: Mystic Alerts Act
  bill: HR 7022
  enacted_date: '2026-10-22'
  origin_chamber: House
  sponsor:
    bioguide: P000048
    name: Rep. Pfluger, August [R-TX-11]
  url: https://www.congress.gov/bill/119th-congress/house-bill/7022
  summary: 'Mystic Alerts Act


    This bill provides for wireless emergency alerts to be transmitted to mobile devices via
    satellite. (Currently, wireless emergency alerts are sent via terrestrial mobile networks
    to individual devices in geographically targeted areas. Commercial mobile service providers
    are not required to participate; only devices connected to a participating service provider’s
    network receive alerts.)


    Under the bill, commercial mobile service providers that participate in the wireless emergency
    alerts system must give notice to the Federal Communications Commission (FCC) indicating
    whether they will transmit such alerts via satellite (in addition to sending alerts via
    terrestrial networks).


    The FCC must establish technical standards and other regulations to enable satellite emergency
    alerts. Providers that opt to transmit emergency alerts via satellite must comply with
    such regulations.


    If a provider elects not to transmit satellite alerts, the provider must give notice of
    that election to new and existing subscribers. Separately, mobile service subscribers
    may opt out of receiving satellite alerts.'
  summary_version: Introduced in House
  summary_date: '2026-01-12'
  summary_truncated: false
- law_number: 119-135
  title: Reversionary Interest Conveyance Act
  bill: HR 952
  enacted_date: '2026-10-22'
  origin_chamber: House
  sponsor:
    bioguide: M001163
    name: Rep. Matsui, Doris O. [D-CA-7]
  url: https://www.congress.gov/bill/119th-congress/house-bill/952
  summary: 'Reversionary Interest Conveyance Act


    This bill directs the Bureau of Land Management (BLM) to offer to sell the reversionary
    interest of the United States in approximately 8.43 acres of land in Sacramento, California,
    as generally depicted on a specified map dated November 7, 2022. Within two years of receiving
    a request from the owner of the land, the BLM must offer the reversionary interest and
    convey the reversionary interest to the buyer upon payment. The payment must be in an
    amount that is at least the fair market value of the reversionary interest. The buyer
    must also pay all costs related to the applicable conveyance of the reversionary interest,
    including all surveys, appraisals, and other administrative costs.


    The bill subjects the conveyance to valid existing rights.


    The proceeds from the sale must be deposited into Federal Land Disposal Account.'
  summary_version: Introduced in House
  summary_date: '2025-02-04'
  summary_truncated: false
