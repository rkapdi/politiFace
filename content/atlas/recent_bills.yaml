  title: Northern Nevada Economic Development and Conservation Act of 2026
  action_date: '2026-09-10'
  action: Placed on the Union Calendar, Calendar No. 710.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/2317
  summary: 'Northern Nevada Economic Development and Conservation Act of 2025


    This bill provides for the designation, conveyance, exchange, sale, or disposal of certain
    federal lands in Nevada.


    Specifically, the bill provides for the transfer of ownership of federal lands from the
    Forest Service and the Bureau of Land Management to the State of Nevada, counties (Douglas,
    Clark, Pershing, and Elko Counties), cities (Carson City, City of Elko, the City of Fernley,
    and the City of Sparks), the Incline Village General Improvement District, and the Truckee
    River Flood Management Authority for economic development, recreation, or certain public
    purposes.


    It also designates specified parcels of federal land as wilderness and as components of
    the National Wilderness Preservation System.


    The bill also releases the reversionary interest of the United States in the Jean Prison
    site, thereby allowing the State of Nevada to use the land for purposes unrelated to the
    prison.


    It also allows the Department of the Interior and the Forest Service to establish a federal
    complex for specified Bureau of Land Management, Forest Service, U.S. Fish and Wildlife
    Service, Bureau of Reclamation, and Bureau of Indian Affairs offices or headquarters in
    Nevada on certain federal lands.


    Additionally, the bill takes land into trust for the Washoe Tribe of Nevada and California.'
  summary_version: Introduced in House
