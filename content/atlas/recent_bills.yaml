  url: https://www.congress.gov/bill/118th-congress/senate-bill/777
  summary: 'Veterans'' Compensation Cost-of-Living Adjustment Act of 2023 or the Veterans''
    COLA Act of 2023


    This act requires the Department of Veterans Affairs (VA) to increase the amounts payable
    for wartime disability compensation, additional compensation for dependents, the clothing
    allowance for certain disabled veterans, and dependency and indemnity compensation for
    surviving spouses and children. Specifically, the VA must increase the amounts by the
    same percentage as the cost-of-living increase in benefits for Social Security recipients
    that is effective on December 1, 2023. The bill requires the VA to publish the amounts
    payable, as increased, in the Federal Register.


    The VA is authorized to make a similar adjustment to the rates of disability compensation
    payable to persons who have not received compensation for service-connected disability
    or death.'
