- bill: HR 7701
  congress: 117
  title: Wage Theft Prevention and Wage Recovery Act of 2022
  action_date: '2022-10-07'
  action: Placed on the Union Calendar, Calendar No. 388.
  origin_chamber: House
  url: https://www.congress.gov/bill/117th-congress/house-bill/7701
  summary: 'Wage Theft Prevention and Wage Recovery Act of 2022


    This bill requires employers to make initial and modified disclosures to employees of
    the terms of their employment, provide such employees with regular paystubs, and make
    a final payment to an employee for uncompensated work hours within 14 days of the employee''s
    termination. Employers must also allow employees access to wage records.


    An employer must compensate an employee at the rate specified in an employment contract,
    including a collective bargaining agreement, that specifies a rate of pay higher than
    the minimum wage rate. The bill makes all of such unpaid wages recoverable through civil
    enforcement.


    The bill establishes new and increased civil and criminal penalties for violations of
    overtime or minimum wage requirements, including referral to the Department of Justice
    for criminal prosecution of employers who engage in wage theft, falsification of wage
    records, or retaliation against employees.


    The Wage and Hour Division of the Department of Labor must provide grants to specified
    organizations, including nonprofits and educational institutions, to support efforts to
    prevent and reduce violations of wage and hour laws.'
  summary_version: Reported to House
  summary_date: '2022-10-07'
  summary_truncated: false
