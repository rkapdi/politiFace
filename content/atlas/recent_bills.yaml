- bill: HR 40
  congress: 119
  title: Commission to Study and Develop Reparation Proposals for African Americans Act
  action_date: '2025-01-03'
  action: Referred to the House Committee on the Judiciary.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/40
  summary: 'Commission to Study and Develop Reparation Proposals for African Americans Act


    This bill establishes the Commission to Study and Develop Reparation Proposals for African
    Americans.


    The commission must (1) compile documentary evidence of slavery in the United States;
    (2) study the role of the federal and state governments in supporting the institution
    of slavery; (3) analyze discriminatory laws and policies against freed African slaves
    and their descendants; and (4) recommend ways the United States may recognize and remedy
    the effects of slavery and discrimination on African Americans, including through a formal
    apology and compensation (i.e., reparations).


    The commission consists of individuals from civil society and reparations organizations
    and individuals appointed by the President and congressional leadership; Members of Congress
    and governmental employees may not serve on the commission. The commission may hold hearings,
    subpoena witnesses and records, and contract with other entities to conduct its work.


    The commission must submit its final report within 18 months of its first meeting.'
  summary_version: Introduced in House
  summary_date: '2025-01-03'
  summary_truncated: false
