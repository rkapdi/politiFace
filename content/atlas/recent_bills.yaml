  title: HEADACHE Act
  action_date: '2025-09-19'
  action: Referred to the House Committee on Energy and Commerce.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/5536
  summary: 'Headache Education, Access, Diagnosis, and Care Health Equity Act or the HEADACHE
    Act


    This bill temporarily establishes a federal initiative, an advisory council, and related
    reporting to address headache disorders. The bill defines headache disorder as a medical
    condition for which a headache is a principal symptom, including primary conditions (e.g.,
    tension-type headaches, migraines) and secondary conditions (i.e., headaches that are
    symptoms of other health conditions).


    Specifically, the Department of Health and Human Services (HHS) must establish a coordinated
    federal initiative to take actions that advance research and improve care for headache
    disorders.


    Also, HHS must establish an advisory council comprised of certain federal and non-federal
    members to advise HHS on headache disorders and hold annual research meetings.


    Finally, HHS must annually report to Congress on headache disorders, including (1) an
    annually updated national plan, (2) evaluations of all relevant federally funded efforts,
    and (3) recommendations for priority actions.


    The requirements of the bill sunset five years after the bill’s enactment.'
  summary_version: Introduced in House
  summary_date: '2025-09-19'
  summary_truncated: false
