  title: Ski Hill Resources for Economic Development Act of 2023
  action_date: '2023-03-28'
  action: Subcommittee Hearings Held.
  origin_chamber: House
  url: https://www.congress.gov/bill/118th-congress/house-bill/930
  summary: 'Ski Hill Resources for Economic Development Act of 2023


    This bill allocates ski area permit rental charges for ski area administration, improvements,
    visitor services, and wildfire preparedness. Such charges are collected by the Department
    of Agriculture (USDA) from ski area operators on National Forest System land.


    USDA shall expend 80% of the ski area permit rental charges from a National Forest System
    unit at that unit in accordance with the following:


    75% shall be used at the unit for activities such as administration of the ski area permit
    program, visitor information, or reducing the likelihood of wildfire in or adjacent to
    a recreation site; and


    25% shall be used at the unit for activities such as repair of a Forest Service-owned
    facility, habitat restoration, or search and rescue activities.


    The remaining 20% of ski area permit rental charges shall be expended by USDA for any
    of the activities specified in this bill at any National Forest System unit.'
