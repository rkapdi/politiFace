- bill: S 140
  congress: 119
  title: Wildfire Prevention Act of 2025
  action_date: '2026-06-10'
  action: Committee on Energy and Natural Resources. Ordered to be reported with an amendment
    in the nature of a substitute favorably.
  origin_chamber: Senate
  url: https://www.congress.gov/bill/119th-congress/senate-bill/140
  summary: 'This bill establishes forest management requirements for federal lands, particularly
    with respect to reducing wildfires.


    For example, the bill establishes annual goals to increase (1) the number of acres of
    Forest Service and Bureau of Land Management (BLM) land that are mechanically thinned
    (i.e., a management process related to the removal of trees and vegetation); and (2) the
    number of acres of Forest Service and BLM land treated by prescribed fire. By FY2029,
    the goals must be to increase the number of acres of each by at least 40% compared to
    the average number of acres of each in FY2019-FY2023.


    The bill also directs the Forest Service and the BLM to (1) implement standardized procedures
    for tracking data relating to hazardous fuels reduction activities they carry out, and
    (2) develop a strategy to identify opportunities to use livestock grazing as a wildfire
    risk reduction tool on federal land. Additionally, the Forest Service and the Department
    of the Interior must establish a deployment and test bed pilot program for wildfire prevention,
    detection, communication, and mitigation technologies.


    The bill mandates use of existing authorities for expedited environmental review for certain
    forest land at high risk from wildfire, insects, or disease.


    Finally, the bill provides local governments and Indian tribes the right to intervene
    in lawsuits concerning certain projects on federal land that (1) reduce risks posed by
    wildfire, insects, or disease; or (2) generate revenue from harvesting timber.'
  summary_version: Introduced in Senate
  summary_date: '2025-01-16'
  summary_truncated: false
- bill: HR 9086
  congress: 119
  title: Foreign Service Modernization Act
  action_date: '2026-06-02'
  action: Referred to the Committee on Foreign Affairs, and in addition to the Committee on
    Ways and Means, for a period to be subsequently determined by the Speaker, in each case
    for consideration of such provisions as fall within the jurisdiction of the committee
    concerned.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/9086
  summary: 'Foreign Service Modernization Act


    This bill requires or authorizes certain actions related to U.S. Foreign Service (FS)
    management and operations, including an increased focus on expeditionary diplomacy (a
    concept that emphasizes diplomats conducting direct diplomacy in high-risk environments
    outside of the embassy), expanded hiring pathways, and additional training requirements.


    For example, the bill requires the Department of State to establish


    a team to develop a plan to improve the capability and willingness of FS members and leaders
    to engage in expeditionary diplomacy;


    a program to recruit qualified veterans and separating military personnel into the FS,
    including by integrating FS recruitment into military transition programs; and


    a Diplomatic Reserve Corps pilot program to assess the feasibility and effectiveness of
    a trained reserve cadre providing a surge workforce to support foreign affairs contingencies.


    Additionally, the State Department is authorized to establish a structured training framework
    that is integrated into normal career progression with protected training periods (similar
    to the Armed Forces'' professional military education model).


    The bill specifies that FS members


    must successfully complete specified leadership and management training prior to assuming
    leadership assignments;


    who participate in approved external training, education, or details shall have certain
    employment protections (such as eligibility for promotions and pay increases on the same
    basis as those not on such assignments); and


    who undergo full-time, department-funded language training for more than six months must
    serve at least three consecutive tours in positions requiring proficiency in that language,
    with assignments beginning immediately after such language training.'
  summary_version: Introduced in House
  summary_date: '2026-06-02'
  summary_truncated: false
