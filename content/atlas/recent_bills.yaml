- bill: HR 1061
  congress: 119
  title: Protecting Sensitive Locations Act
  action_date: '2025-02-06'
  action: Referred to the House Committee on the Judiciary.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/1061
  summary: 'Protecting Sensitive Locations Act


    This bill prohibits immigration enforcement actions within 1,000 feet of a sensitive location
    except in exigent circumstances, such as the imminent risk of death, violence, or physical
    harm to any person.


    Sensitive locations include


    health care facilities;


    schools and school bus stops;


    places that provide assistance for people such as children, pregnant women, and abuse
    victims;


    child care facilities;


    places that provide disaster or emergency services;


    places of worship;


    courthouses and lawyers’ offices;


    facilities used as polling places;


    certain labor union facilities; and


    public assistance offices.


    The prohibition shall apply to Department of Homeland Security officers and agents, as
    well as state employees pursuing immigration enforcement actions.


    If an enforcement action is carried out in violation of this prohibition (1) no information
    resulting from the action may be entered into the record in a resulting removal proceeding,
    and (2) the affected individual may move to immediately terminate such a proceeding.


    U.S. Immigration and Customs Enforcement and U.S. Customs and Border Protection shall
    annually report to Congress about enforcement actions taken at sensitive locations in
    the preceding year.'
  summary_version: Introduced in House
  summary_date: '2025-02-06'
  summary_truncated: false
- bill: HR 51
  congress: 119
  title: Washington, D.C. Admission Act
  action_date: '2025-01-03'
  action: Referred to the Committee on Oversight and Government Reform, and in addition to
    the Committees on Rules, Armed Services, the Judiciary, and Energy and Commerce, for a
    period to be subsequently determined by the Speaker, in each case for consideration of
    such provisions as fall within the jurisdiction of the committee concerned.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/51
  summary: 'Washington, D.C. Admission Act


    This bill provides for the establishment of the State of Washington, Douglass Commonwealth,
    and its admission into the United States.


    The state is composed of most of the territory of the District of Columbia (DC), excluding
    a specified area that encompasses the U.S. Capitol, the White House, the U.S. Supreme
    Court building, federal monuments, and federal office buildings adjacent to the National
    Mall and the U.S. Capitol. The excluded territory shall be known as the Capital and serve
    as the seat of the government of the United States, as provided for in Article I of the
    Constitution. The state may not impose taxes on federal property except as Congress permits.


    The bill provides for the DC Mayor to issue a proclamation for the first elections to
    Congress of two Senators and one Representative of the state. The bill eliminates the
    office of Delegate to the House of Representatives.


    The bill applies current DC laws to the state. DC judicial proceedings and contractual
    obligations shall continue under the state’s authority. The bill also provides for specified
    federal obligations to transfer to the state upon its certification that it has funds
    and laws in place to assume the obligations. These include maintaining a retirement fund
    for judges and operating public defender services.


    The bill establishes a commission that is generally comprised of members who are appointed
    by DC and federal government officials to advise on an orderly transition to statehood.'
  summary_version: Introduced in House
  summary_date: '2025-01-03'
  summary_truncated: false
- bill: S 2939
  congress: 117
  title: Voter Choice Act
  action_date: '2021-10-05'
  action: Read twice and referred to the Committee on Rules and Administration.
  origin_chamber: Senate
  url: https://www.congress.gov/bill/117th-congress/senate-bill/2939
  summary: 'Voter Choice Act


    This bill directs the Election Assistance Commission (EAC) to establish a program to support
    state and local governments in the transition to ranked choice voting (a system in which
    voters rank candidates in order of preference).


    Specifically, the EAC must provide technical assistance to state and local governments
    that are considering whether to make, or that are in the process of making, the transition
    to a ranked choice voting system for their elections.


    The EAC must also award grants to support such transition, including through the acquisition
    of voting equipment and tabulation software, appropriate ballot design, educational materials,
    and voter outreach.'
  summary_version: Introduced in Senate
  summary_date: '2021-10-05'
  summary_truncated: false
