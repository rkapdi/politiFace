- bill: HR 6644
  congress: 119
  title: 21st Century ROAD to Housing Act
  action_date: '2026-07-11'
  action: 'Became Public Law No: 119-101.'
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/6644
  summary: '21st Century ROAD to Housing Act


    This act establishes and modifies various federal housing programs.


    TITLE I--OPPORTUNITIES FOR HOUSING


    (Sec. 101) This section requires the Department of Housing and Urban Development (HUD)
    to review the performance of organizations that receive grants to provide housing counseling
    services. Such review may take into account the performance of individual counselors.


    HUD may terminate assistance for such organizations that are not in compliance with the
    program''s requirements.


    (Sec. 102) This section requires HUD to establish best practices and provide technical
    assistance to state and local entities to support permitting for point-access block buildings
    (i.e., apartments with a single staircase to access the dwelling units and that are no
    more than six stories high).


    It also allows HUD to award competitive grants to state and local entities to assess the
    feasibility, safety, and cost-effectiveness of such buildings. This authority expires
    after seven years.


    (Sec. 103) This section exempts from environmental review specified rural housing projects
    located on an infill site (i.e., a site served by existing infrastructure, including water
    lines, sewer lines, and roads).


    (Sec. 104) This section requires Community Development Block Grant (CDBG) grantees to
    maintain a publicly accessible, searchable database identifying undeveloped land owned
    by the grantee.


    (Sec. 105) This section authorizes the Federal Housing Administration (FHA) to establish
    a four-year pilot program to increase the number of mortgages originated with a principal
    balance of $100,000 or less.


    (Sec. 106) This section requires HUD to establish a three-year pilot program to award
    grants to public housing agencies (PHAs) and owners of federally assisted rental housing
    to install temperature sensors in residential dwelling units.


    (Sec. 107) This section requires HUD to publish guidelines and best practices for state
    and local zoning frameworks that support production of adequate housing to meet the needs
    of communities and provide housing opportunities for individuals of all income levels.


    TITLE II--BUILDING MORE IN AMERICA'
  summary_version: Public Law
