- bill: S 233
  congress: 119
  title: Restoring Confidence in the World Anti-Doping Agency Act of 2025
  action_date: '2026-02-23'
  action: Placed on Senate Legislative Calendar under General Orders. Calendar No. 340.
  origin_chamber: Senate
  url: https://www.congress.gov/bill/119th-congress/senate-bill/233
  summary: 'Restoring Confidence in the World Anti-Doping Agency Act of 2025


    This bill requires the Office of National Drug Control Policy (ONDCP) to annually evaluate
    the governance and procedures of the World Anti-Doping Agency (WADA).


    Specifically, the ONDCP, in consultation with the United States Anti-Doping Agency, the
    United States Olympic and Paralympic Committee, the Athletes'' Advisory Council (Team
    USA AC), must determine whether WADA


    has a credible and independent governance model that provides for fair representation
    of the United States;


    fully implements or has implemented governance reforms to ensure independent governance;
    and


    has fair processes and procedures for selecting independent athletes for decision-making
    roles on the WADA Executive Committee, the WADA Foundation Board, and relevant expert
    advisory groups, standing committees, permanent special committees, and working groups
    of WADA.


    If the ONDCP determines WADA has not met these criteria, the ONDCP must use all available
    tools and efforts to bring WADA into compliance with them.


    Further, upon such a determination, the ONDCP may withhold up to the full amount of the
    United States'' membership dues to WADA.'
  summary_version: Reported to Senate
  summary_date: '2026-02-23'
  summary_truncated: false
