  summary: 'Daniel J. Harvey, Jr. and Adam Lambert Improving Servicemember Transition to Reduce
    Veteran Suicide Act


    This bill requires the Department of Veterans Affairs (VA) and Department of Defense (DOD)
    to provide additional information and assistance related to mental health care to veterans
