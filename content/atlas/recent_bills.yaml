  title: Innovative FEED Act of 2025
  action_date: '2025-03-18'
  action: Referred to the House Committee on Energy and Commerce.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/2203
  summary: 'Innovative Feed Enhancement and Economic Development Act of 2025 or the Innovative
    FEED Act of 2025


    This bill provides for the regulation of zootechnical animal food substances as food additives.


    The bill defines zootechnical animal food substance as a substance that is added to the
    food or drinking water of animals and that affects only the animal''s gastrointestinal
    tract, with the intended purpose of affecting the byproducts of the animal''s digestion,
    reducing foodborne pathogens, or altering the animal''s gastrointestinal biome.


    The definition does not include substances that are used to treat or prevent diseases
    in animals, hormones, or active ingredients of animal drugs. Labels for zootechnical animal
    food substances must include a disclaimer that the substance may not be used to treat
    or prevent diseases in animals.'
  summary_version: Introduced in House
