  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/8005
  summary: 'Stop Pills That Kill Act


    This bill increases criminal penalties for offenses relating to the manufacture of fentanyl
    or counterfeit substances. It also establishes requirements for federal agencies to address
    the use of counterfeit substances.


    Specifically, the bill applies an increased criminal penalty for possessing, manufacturing,
    or distributing certain equipment or materials that are used to illegally manufacture
    fentanyl, an analogue of fentanyl, or a counterfeit substance (the increased penalty is
    currently limited to offenses involving methamphetamine).


    The Drug Enforcement Administration must establish and implement a plan to address counterfeit
    fentanyl or methamphetamine substances through law enforcement action and education and
    prevention efforts. In addition, the Department of Justice must annually report on the
    collection of counterfeit fentanyl or methamphetamine substances by law enforcement and
    on related prosecutions.'
