- bill: HR 1957
  congress: 119
  title: End Veteran Homelessness Act of 2025
  action_date: '2026-02-24'
  action: Forwarded by Subcommittee to Full Committee by Voice Vote.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/1957
  summary: 'End Veteran Homelessness Act of 2025


    This bill requires the Department of Veterans Affairs (VA) to furnish case management
    to certain veterans who are eligible for the HUD-Veterans Affairs Supportive Housing (HUD-VASH)
    program administered by the Department of Housing and Urban Development (HUD) and the
    VA.


    Specifically, the VA must furnish case management to veterans who are eligible for HUD-VASH
    that the VA determines require case management. The VA must prioritize vulnerable homeless
    veterans in assigning case managers and providing services.


    The VA must take certain actions if a veteran refuses case management. HUD or a public
    housing authority may not revoke assistance solely on the basis that a veteran has refused
    case management. Additionally, a veteran may not be evicted or penalized by the owner
    of a property solely on the basis that they have refused case management or cannot be
    provided case management for health and safety reasons.


    The Government Accountability Office must report to Congress on veterans who are served
    by the HUD-VASH program, case managers and case management services provided under the
    program, and metrics about housing stability for veterans participating in federal housing
    assistance programs.


    The bill also provides statutory authority to expand eligibility for the HUD-VASH program
    to any veteran who is homeless, at risk of homelessness, or receiving assistance under
    another housing assistance program if the VA determines a voucher under HUD-VASH is more
    appropriate. (Currently, assistance is statutorily limited to certain veterans who have
    chronic mental illness or substance use disorders.)'
