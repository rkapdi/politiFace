- bill: HR 2826
  congress: 118
  title: Save Local Business Act
  action_date: '2023-04-25'
  action: Referred to the House Committee on Education and the Workforce.
  origin_chamber: House
  url: https://www.congress.gov/bill/118th-congress/house-bill/2826
  summary: 'Save Local Business Act


    This bill provides that a person may be considered a joint employer in relation to an
    employee under federal labor law only if such person directly, actually, and immediately
    (and not in a limited and routine manner) exercises significant control over the essential
    terms and conditions of employment. Such control may by demonstrated by hiring and discharging
    employees, determining individual employee rates of pay and benefits, day-to-day supervision
    of employees, assigning individual work schedules, positions, and tasks, and administering
    employee discipline.'
  summary_version: Introduced in House
  summary_date: '2023-04-25'
