- bill: HR 9203
  congress: 119
  title: Student Protection and University Accountability Act
  action_date: '2026-09-08'
  action: Placed on the Union Calendar, Calendar No. 700.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/9203
  summary: 'Student Protection and University Accountability Act


    This bill requires institutions of higher education (IHEs) participating in federal student
    aid programs and the Department of Education (ED) to take certain actions to investigate
    alleged violations of civil rights under Title VI of the Civil Rights Act of 1964. (Title
    VI of the Civil Rights Act of 1964 prohibits discrimination based on race, color, or national
    origin in federally funded programs or activities.)


    Specifically, the bill requires an IHE to develop specific procedures for investigating
    Title VI complaints and widely distribute those procedures to students and their families.
    Among these procedures, an IHE must designate at least one Title VI coordinator and have
    a system for maintaining records of complaints.


    The bill makes an IHE that fails to meet the bill''s requirements for two consecutive
    award years ineligible to participate in federal student aid programs for at least two
    subsequent award years. However, the IHE may regain eligibility if it demonstrates compliance
    with the bill''s requirements.


    ED''s Office for Civil Rights (OCR) must give bimonthly congressional briefings on (1)
    the number of complaints filed with OCR, (2) how OCR plans to address those complaints
    and the investigations being carried out in response to those complaints, and (3) data
    about the length of those investigations.


    The bill revises the process through which OCR investigates Title VI complaints, including
    by prohibiting OCR from closing a complaint due to the filing of another complaint involving
    the same allegations against the same IHE under certain circumstances.'
  summary_version: Reported to House
  summary_date: '2026-09-08'
  summary_truncated: false
- bill: HR 9098
  congress: 119
  title: Congressional Records Protection Act of 2026
  action_date: '2026-09-08'
  action: Placed on the Union Calendar, Calendar No. 704.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/9098
  summary: 'Congressional Records Protection Act of 2026


    This bill generally prohibits the government from issuing a search warrant, grand jury
    subpoena, court order, statutory authorization, certification, subpoena, or an administrative
    order (i.e., executing legal process) that could reasonably return congressional records.
    Congressional records include (1) written materials and electronic or wire communications
    prepared by, shared with, or obtained by a Member of Congress or congressional employee
    in the course of official duties; and (2) records of an electronic or wire communications
    service related to accounts or certain communications of a Member of Congress or congressional
    employee.


    The bill provides exceptions to the general prohibition. Specifically, the government
    may execute legal process that could reasonably return congressional records if (1) the
    subject of the process is the target of a criminal investigation, (2) the material sought
    pertains to a Member of Congress or congressional employee who is the target of a criminal
    investigation, or (3) the records are certain electronic or wire communications.


    If the government executes legal process under an exception that could reasonably return
    or that unexpectedly returns congressional records, then the bill generally requires the
    government to notify the Member of Congress or congressional employee and delay or halt
    review of the materials for 30 days.


    If the legal process could reasonably return certain congressional records from an electronic
    or wire communications service provider, then the bill requires a special master to be
    appointed to identify materials that are constitutionally protected from disclosure.'
  summary_version: Reported to House
  summary_date: '2026-09-08'
  summary_truncated: false
- bill: HR 8781
  congress: 119
  title: Title IX Clarification Act of 2026
  action_date: '2026-09-08'
  action: Placed on the Union Calendar, Calendar No. 698.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/8781
  summary: 'Title IX Clarification Act of 2026


    This bill defines the terms sex, female, and male for purposes of Title IX of the Education
    Amendments of 1972. Title IX prohibits discrimination on the basis of sex in education
    programs that receive federal financial assistance.


    Specifically, the bill defines sex as an individual’s biologically determined sex, as
    either male or female. Therefore, Title IX''s prohibition on sex discrimination only applies
    to biological sex under the bill.


    The bill defines female, when used with respect to a natural person, as an individual
    who naturally has, had, will have, or would have, but for a congenital anomaly, historical
    accident, or intentional or unintentional disruption, the reproductive system that at
    some point produces, transports, and utilizes the large gamete (ova) for fertilization.


    The bill defines male, when used with respect to a natural person, as an individual who
    naturally has, had, will have, or would have, but for a congenital anomaly, historical
    accident, or intentional or unintentional disruption, the reproductive system that at
    some point produces, transports, and utilizes the small gamete (sperm) for fertilization.


    (A January 20, 2025, executive order stated that it is the policy of the United States
    to recognize two sexes—male and female—which are not changeable. On February 4, 2025,
    the Department of Education announced its intent to enforce its Title IX regulations consistent
    with this executive order. For more information on the status of these regulations, see
    LBS11279.)'
  summary_version: Introduced in House
  summary_date: '2026-05-13'
  summary_truncated: false
