- bill: HR 1329
  congress: 119
  title: Smithsonian American Women’s History Museum Act
  action_date: '2026-05-21'
  action: Motion to reconsider laid on the table Agreed to without objection.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/1329
  summary: 'Smithsonian American Women’s History Museum Act


    This bill authorizes the Smithsonian American Women''s History Museum to be located on
    a particular site within the Reserve of the National Mall in Washington, DC.


    Specifically, the bill designates the South Monument site as the location for the museum;
    however, the President may designate an alternative site within 180 days of the bill''s
    enactment. (The site is the undeveloped land across the National Mall from the National
    Museum of African American History and Culture.) Administrative jurisdiction of the site
    must be transferred to the Smithsonian Institution.


    The Board of Regents of the Smithsonian Institution must have the approval of specified
    federal entities (e.g., the Commission of Fine Arts) to plan, design, and construct a
    museum building. The bill (1) outlines the criteria for considering site and design proposals,
    and (2) requires the Smithsonian Institution to reimburse for costs resulting from the
    building approval process.


    The bill directs the museum to be dedicated to preserving, researching, and presenting
    the history, achievements, and lived experiences of biological women in the United States.
    Under this bill, the museum may not identify, present, describe, or depict any biological
    male as a female.


    In carrying out its duties, the museum''s advisory council must (1) seek and utilize guidance
    from a broad array of knowledgeable and respected sources reflecting the diversity of
    the political viewpoints and authentic experiences held by women in the United States,
    and (2) seek guidance for the creation and substantial revision of exhibits and programs.'
  summary_version: Reported to House
  summary_date: '2026-04-23'
