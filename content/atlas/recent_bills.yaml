- bill: HR 5818
  congress: 119
  title: Country of Origin Labeling Enforcement Act of 2025
  action_date: '2025-12-02'
  action: Referred to the Subcommittee on Livestock, Dairy, and Poultry.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/5818
  summary: 'Country of Origin Labeling Enforcement Act of 2025


    This bill requires retailers to notify their customers of the country of origin of beef.


    In general, under the Department of Agriculture''s (USDA''s) mandatory Country of Origin
    Labeling (COOL) requirements, retailers (such as grocery stores, supermarkets, and club
    warehouses) must provide certain information to consumers regarding the origin of specific
    foods (e.g., lamb, chicken, fish, and perishable agriculture products). This bill expands
    these requirements to include mandatory COOL for beef (including ground beef).


    In order to designate beef as exclusively having a country of origin of the United States,
    the product must generally be derived from an animal that was exclusively born, raised,
    and slaughtered in the United States.


    A retailer (or a supplier for the retailer) who willfully violates the COOL requirements
    for beef may be subject to a USDA fine of $5,000 for each pound of beef that is not in
    compliance. Under current law, the USDA fine may not exceed $1,000 for each COOL violation.


    The bill specifies that no ruling by the World Trade Organization (or by any other international
    organization of which the United States is a member) may be construed to limit, alter,
    or affect USDA''s authority to implement COOL under this bill.'
  summary_version: Introduced in House
  summary_date: '2025-10-24'
