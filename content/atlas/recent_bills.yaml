- bill: SJRES 186
  congress: 119
  title: A joint resolution proposing an amendment to the Constitution of the United States
    relative to the fundamental right to vote.
  action_date: '2026-04-27'
  action: 'Read twice and referred to the Committee on the Judiciary. (text: CR S2055)'
  origin_chamber: Senate
  url: https://www.congress.gov/bill/119th-congress/senate-joint-resolution/186
  summary: 'This joint resolution proposes a constitutional amendment related to the fundamental
    right to vote.


    Specifically, it grants every U.S. citizen of legal voting age the fundamental right to
    vote in any public election held in the jurisdiction in which the citizen resides.


    Next, it specifies that the fundamental right to vote shall not be denied or abridged
    by the United States, a state, or a political subdivision of a state, unless the denial
    or abridgment is in furtherance of a compelling governmental interest by the least restrictive
    means.


    Finally, it repeals a specific portion of the Fourteenth Amendment to the Constitution,
    which allows for the denial of the right to vote based on crime. (Currently, some states
    disallow individuals from voting, either temporarily or indefinitely, after incarceration
    for a felony.)'
  summary_version: Introduced in Senate
  summary_date: '2026-04-27'
  summary_truncated: false
