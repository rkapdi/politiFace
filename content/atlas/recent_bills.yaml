  summary: 'Providing Appropriate Recognition and Treatment Needed to Enhance Relations Act
    or the PARTNER Act


    This bill authorizes the President to extend diplomatic immunities and privileges provided
    by the International Organizations Immunities Act, including immunity from certain lawsuits
    and exemption from property taxes, to specified international regional and research organizations.


    Specifically, the bill authorizes the President to extend these immunities and privileges
    to


    the Association of Southeast Asian Nations (ASEAN), a regional organization with 10 members
    including Brunei, Indonesia, Singapore, and Vietnam;


    the Pacific Islands Forum, a regional organization with 18 members including Australia,
    Fiji, New Zealand, and Papua New Guinea;


    the Caribbean Community (CARICOM), a regional organization with 15 members and 6 associate
    members including Barbados, Grenada, Jamaica, and Saint Lucia; and


    the European Organization for Nuclear Research (CERN), an international research organization
    focused on particle physics.


    The bill also authorizes the President to extend to the permanent observer mission of
    the African Union to the United Nations the privileges and immunities provided to permanent
    missions to the United Nations of member states.'
