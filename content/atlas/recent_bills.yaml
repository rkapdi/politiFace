- bill: HRES 157
  congress: 118
  title: Recognizing the Dominican community's presence and contributions to Washington Heights
    and Inwood.
  action_date: '2023-03-22'
  action: Referred to the Subcommittee on Federal Lands.
  origin_chamber: House
  url: https://www.congress.gov/bill/118th-congress/house-resolution/157
  summary: 'This resolution supports the designation of a noncontiguous Dominican cultural
    heritage district under the control of the National Park Service to acknowledge and celebrate
    the contributions of the Dominican community to New York City, New York State, and the
    nation.


    The resolution


    recognizes that the cultural legacy and contributions of the Dominican community enrich,
    enliven, and permeate the Washington Heights and Inwood, New York neighborhoods;


    honors the history and contributions of Dominican-American elected officials, artists,
    small business and bodega owners, writers, and trailblazers; and


    supports efforts to recognize and preserve the history of the Dominican people in Washington
    Heights and Inwood, including through the designation of historic buildings and districts.'
  summary_version: Introduced in House
