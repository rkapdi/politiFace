- bill: HR 9616
  congress: 119
  title: EMRTAI Authorization Act of 2026
  action_date: '2026-09-16'
  action: Received in the Senate and Read twice and referred to the Committee on Environment
    and Public Works.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/9616
  summary: 'Environmental Monitoring and Remediation Technology Assessment Initiative Authorization
    Act of 2026 or the EMRTAI Authorization Act of 2026


    This provides statutory authority for an initiative within the Environmental Protection
    Agency (EPA) that recovers critical materials from contaminated sites.


    A critical material means (1) any non-fuel mineral, element, substance, or material that
    the Department of Energy determines has a high risk of a supply chain disruption and serves
    an essential function in energy technologies; and (2) any critical mineral. A critical
    mineral means any mineral, element, substance, or material designated as critical by the
    U.S. Geological Survey.


    Under the program, the EPA must investigate, evaluate, and support processes, methods,
    and systems which may be used to identify sources of critical materials at contaminated
    sites and recover such critical materials from those sites. In carrying out the program,
    the EPA may provide assistance (e.g., awards) to persons, nonprofit organizations, and
    state, local, and tribal government entities.


    The bill prohibits the EPA from providing assistance (1) in an amount that exceeds $10
    million in any fiscal year in the aggregate; or (2) to any person, nonprofit organization,
    or government entity, in an amount that exceeds $3 million.


    The bill terminates the program after 10 years.'
  summary_version: Introduced in House
  summary_date: '2026-07-09'
  summary_truncated: false
- bill: HR 9499
  congress: 119
  title: Protecting Taxpayers from Ghost Preparers Act
  action_date: '2026-09-16'
  action: Received in the Senate and Read twice and referred to the Committee on Finance.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/9499
  summary: 'Protecting Taxpayers from Ghost Preparers Act


    This bill limits the amount of time the Internal Revenue Service (IRS) has to assess taxes
    related to fraudulent or false federal tax returns where there is no intent by the taxpayer
    to evade taxes.


    As background, the IRS generally has three years from the date that a tax return is filed
    (statute of limitations) to assess taxes owed by the taxpayer for the tax year. However,
    if a false or fraudulent tax return is filed with the intent to evade tax (fraud exception),
    then the IRS may assess taxes at any time. In Murrin v. Commissioner the U.S. Tax Court
    held (and the U.S. Court of Appeals for the Third Circuit affirmed) that the fraud exception
    applies when a tax return preparer places false or fraudulent entries on a tax return
    without the taxpayer’s knowledge. In contrast, the U.S. Court of Federal Claims held in
    BASR Partnership v. Commissioner that the fraud exception only applies if the taxpayer
    intends to evade taxes.


    The bill limits the fraud exception to cases in which the taxpayer intends to evade taxes.'
  summary_version: Passed House
  summary_date: '2026-09-15'
  summary_truncated: false
- bill: HR 9498
  congress: 119
  title: Taxpayer Advocate Participation Act
  action_date: '2026-09-16'
  action: Received in the Senate and Read twice and referred to the Committee on Finance.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/9498
  summary: 'Taxpayer Advocate Participation Act


    This bill authorizes the National Taxpayer Advocate to appear as amicus curiae and submit
    amicus briefs in a U.S. court in cases involving federal tax law.


    Further, the bill requires federal courts to permit such appearances. (An amicus curiae
    is a person or group that is not a party in a court case but has an interest in the case
    and may be permitted to submit a brief, known as an amicus brief, to the court in relation
    to the case.) Under the bill, the National Taxpayer Advocate may present the views of
    the National Taxpayer Advocate in such a case only with respect to an issue which may
    broadly affect certain rights of taxpayers.


    As background, the National Taxpayer Advocate leads the Taxpayer Advocate Service, which
    is an independent organization within the Internal Revenue Service (IRS) responsible for
    helping taxpayers resolve problems with the IRS. The National Taxpayer Advocate is also
    responsible for proposing administrative and legislative changes to mitigate such problems.
    Under current law, the National Taxpayer Advocate is not authorized to appear as amicus
    curiae or submit amicus briefs in cases involving federal tax law.'
  summary_version: Introduced in House
  summary_date: '2026-06-29'
  summary_truncated: false
- bill: HR 9394
  congress: 119
  title: Civil Preparedness for Agroterrorism Exercise Act of 2026
  action_date: '2026-09-16'
  action: Received in the Senate and Read twice and referred to the Committee on Homeland
    Security and Governmental Affairs.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/9394
  summary: 'Civil Preparedness for Agroterrorism Exercise Act of 2026


    This bill requires the Department of Homeland Security (DHS), within four years after
    the bill’s enactment, to conduct an exercise to enhance collective domestic prevention,
    response, and recovery regarding acts of agroterrorism (i.e., terrorism targeting or threatening
    agriculture and food systems of vital importance to national security, public health,
    or safety). The scenario in the exercise must involve agroterrorists transporting and
    deploying in the United States a biological agent (e.g., microorganism or infectious substance)
    capable of harming critical agriculture and food operations and must address how relevant
    public and private entities can coordinate to develop preparedness and mitigate widespread
    disruption.


    Within 180 days after completion of the exercise, DHS must submit to Congress an after-action
    report including the findings of the exercise, plans for incorporating lessons learned
    into future operations, and recommended legislative actions.'
  summary_version: Introduced in House
  summary_date: '2026-06-23'
  summary_truncated: false
