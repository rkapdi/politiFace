  action: Placed on Senate Legislative Calendar under General Orders. Calendar No. 524.
  origin_chamber: Senate
  url: https://www.congress.gov/bill/113th-congress/senate-bill/1961
  summary: 'Chemical Safety and Drinking Water Protection Act of 2014 - (Sec. 2) Amends the
    Safe Drinking Water Act (SDWA) to direct the Environmental Protection Agency (EPA) or
    each state exercising primary enforcement responsibility for public water systems to establish
    within two years a state chemical storage tank surface water protection program for chemicals
    identified as a hazardous substance under the Comprehensive Environmental Response, Compensation,
    and Liability Act (CERCLA), subject to emergency planning or reporting requirements of
    the Emergency Planning and Community Right-To-Know Act, or defined as a contaminant under
    the Safe Drinking Water Act.


    Includes within the program bulk storage tanks that contain chemicals that if released
    could pose a risk of harm to a public water system. Excludes from the program a tank or
    container that is subject to regulations to prevent discharges of oil and hazardous substances
    under the National Response System of the Federal Water Pollution Control Act (commonly
    known as the Clean Water Act). Authorizes the EPA or a state, as applicable, to adopt
    additional exclusions based on federal or state laws that substantially meet the requirements
    of this Act, or for tanks that would not pose a risk of harm to a public water system.


    Requires the programs to provide for oversight and inspection of each covered chemical
    storage tank in accordance with minimum requirements, established by this Act, to prevent
    the release of chemicals into the water supplies of public water systems.


    Requires inspections for: (1) high hazard tanks every year by a certified inspector, (2)
    tanks identified in source water assessment every three years, and (3) for any other covered
    chemical storage tank every five years.


    Requires the program to include a comprehensive inventory of the covered chemical storage
    tanks in each state.


    Requires the EPA or a state, as applicable, to develop within two years a list of covered
    chemical storage tanks that hold chemicals that if released could pose the greatest risk
    of harm to public water systems in the state and the greatest risk to public health.


    Deems a program and its requirements, for purposes of primary enforcement responsibility,
    to be part of the national primary drinking water regulations and requires that they be
    implemented and enforced in accordance with applicable SDWA procedures.'
