- bill: HR 1700
  congress: 119
  title: Social Security Expansion Act
  action_date: '2025-02-27'
  action: Referred to the Subcommittee on Railroads, Pipelines, and Hazardous Materials.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/1700
  summary: 'Social Security Expansion Act


    This bill increases Social Security benefits, expands Social Security payroll taxes, and
    makes other changes to the Social Security program.


    Specifically, the bill changes the way Social Security benefits are calculated by increasing
    the primary insurance amount applicable to average monthly earnings that fall below a
    specified amount, and increasing bend points for individuals who become eligible for Social
    Security after 2025. (Bend points are dollar amounts at which earnings are segmented for
    the purpose of calculating an individual’s primary insurance amount. The share of an individual’s
    earnings that are replaced by Social Security decreases at each escalating bend point.)


    The bill also revises the method of calculating cost-of-living adjustments to account
    for the spending of individuals over the age of 62 and establishes a new minimum benefit
    for certain low earners. Further, the bill permits full-time students who are the children
    of deceased or disabled workers to collect Social Security or railroad retirement child’s
    benefits until they reach age 22.


    With respect to taxes, the bill extends payroll taxes on wages, salaries, and self-employment
    earnings to income above $250,000. (In 2025, the maximum amount subject to Social Security
    payroll tax is $176,100.) The bill also increases the net investment income tax and subjects
    active trade or business income to this tax.


    Finally, the bill combines the existing Federal Old-Age and Survivors Insurance Trust
    Fund and the Federal Disability Insurance Trust Fund into a single Social Security Trust
    Fund.'
