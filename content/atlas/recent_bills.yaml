  title: National Taxpayer Advocate Enhancement Act of 2025
  action_date: '2026-11-10'
  action: 'Became Public Law No: 119-139.'
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/997
  summary: 'National Taxpayer Advocate Enhancement Act of 2025


    This act authorizes the National Taxpayer Advocate to appoint legal counsel within the
    Taxpayer Advocate Service (TAS) to report directly to the National Taxpayer Advocate.
    The act also expands the authority of the National Taxpayer Advocate to take personnel
    actions with respect to local taxpayer advocates (located in each state) to include actions
    with respect to any employee of TAS.


    Prior to this act, pursuant to a Department of the Treasury order, all legal counsel whose
    duties include providing legal advice to any official in any office or bureau of Treasury
    were part of the Legal Division within Treasury and under the supervision of the General
    Counsel, with limited exceptions. TAS assists taxpayers in matters involving the Internal
    Revenue Service (IRS) and is part of the IRS, within Treasury.'
  summary_version: Public Law
