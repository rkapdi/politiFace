  url: https://www.congress.gov/bill/119th-congress/house-bill/5631
  summary: 'Geothermal Ombudsman for National Deployment and Optimal Reviews Act


    This bill establishes a geothermal ombudsman and task force to oversee geothermal project
    permitting and authorizations on federal land.


    The Department of the Interior must appoint a geothermal ombudsman from within the Bureau
    of Land Management (BLM). The ombudsman must act as a liaison among different parts of
    BLM, provide dispute resolution services between BLM and geothermal project applicants,
    and facilitate permit processing in different BLM field offices regarding geothermal projects
    on federal land.


    The ombudsman must also lead the Geothermal Permitting Task Force established by this
    bill. The task force must support the ombudsman’s duties. Through the task force, the
    ombudsman may reassign employees from other Interior bureaus or offices to assist in the
    completion of geothermal authorizations. The ombudsman may pay a retention allowance to
    reassigned employees.'
