  title: Nuclear REFUEL (Recycling Efficient Fuels Utilizing Expedited Licensing) Act
  action_date: '2026-11-05'
  action: Placed on the Union Calendar, Calendar No. 768.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/3978
  summary: 'The following analysis is based on draft bill text that was made available by
    the House of Representatives and may differ from the bill text as introduced.


    Nuclear REFUEL (Recycling Efficient Fuels Utilizing Expedited Licensing) Act


    This bill directs the Nuclear Regulatory Commission (NRC) to license future recycling
    facilities that reprocess certain spent nuclear fuel (i.e., radioactive waste) under regulations
    for special nuclear material rather than regulations for production and utilization facilities.
    The bill applies to domestic facilities that reprocess spent nuclear fuel in a manner
    that does not isolate plutonium. Generally, such recycling facilities reprocess spent
    nuclear fuel into materials that may be reused as nuclear fuel for electricity.


    While there are no commercial reprocessing facilities currently operating in the United
    States, the bill specifies which regulatory framework the NRC must use when issuing licenses
    to future facilities by excluding such facilities from the statutory definition of production
    facility. The licensing process under regulations for special nuclear material has fewer
    steps than the licensing process under regulations for production and utilization facilities.'
  summary_version: Introduced in House
  summary_date: '2025-06-12'
  summary_truncated: false
- bill: HR 3100
  congress: 119
  title: CHILD Act of 2026
  action_date: '2026-11-05'
  action: Placed on the Union Calendar, Calendar No. 770.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/3100
  summary: 'This bill restores the authority for businesses and organizations that provide
    care or care placement services for children, the elderly, or individuals with disabilities
    (care-providing businesses and organizations) to request national criminal history background
    checks for contractors and for individuals they certify or license.


    Federal law authorizes care-providing businesses and organizations to request national
    criminal history background checks for certain covered individuals.


    From 1994 to 2018, covered individuals included three categories of individuals: (1) current
    or prospective employees or volunteers; (2) current or prospective owners or operators;
    and (3) anyone who had, may have had, or sought to have access to children, the elderly,
    or individuals with disabilities (e.g., contractors and licensees).


    In 2018, the Child Protection Improvements Act removed the third category, narrowing the
    scope of covered individuals to just two categories: (1) current or prospective employees
    or volunteers, and (2) current or prospective owners or operators. Under the law, an individual
    in one of the categories who has, may have, or seeks to have access to children, the elderly,
    or individuals with disabilities is a covered individual.


    This bill expands covered individuals to include additional categories: (1) current or
    prospective contractors, (2) current or prospective employees or volunteers for a contracted
    entity, and (3) individuals licensed or certified by a business or organization. Like
    the 2018 law, an individual in one of the categories who has, may have, or seeks to have
    access to children, the elderly, or individuals with disabilities is a covered individual.'
