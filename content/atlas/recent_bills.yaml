  summary: 'Improving Veteran Access to Care Act


    This bill requires the Department of Veterans Affairs (VA) to establish an integrated
    project team to improve the process for scheduling VA health care appointments. Among
    other objectives, the team must (1) develop or continue the development of a scheduling
    system and platform that enables personnel and patients of the VA to view available appointments
    for VA care, (2) create a process through which patients can telephonically speak with
    a scheduler who can assist in determining availability and scheduling, and (3) carry out
    other functions with respect to health care appointments furnished by the VA.


    In carrying out its objectives, the team must consult and coordinate with the deployment
    schedule and capabilities of the VA’s Electronic Health Record Modernization Program.


