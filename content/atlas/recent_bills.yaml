- bill: S 124
  congress: 119
  title: Restore VA Accountability Act of 2025
  action_date: '2025-03-11'
  action: 'Committee on Veterans'' Affairs. Hearings held. Hearings printed: S.Hrg. 119-35.'
  origin_chamber: Senate
  url: https://www.congress.gov/bill/119th-congress/senate-bill/124
  summary: 'Restore Department of Veterans Affairs Accountability Act of 2025 or the Restore
    VA Accountability Act of 2025


    This bill modifies personnel action procedures regarding certain employees and executives
    of the Department of Veterans Affairs (VA).


    The bill authorizes the VA to remove from civil service, demote, or suspend VA employees
    that are supervisors or managers if the VA determines by substantial evidence that the
    performance or misconduct of such individual warrants such action. This authority does
    not apply to certain appointees or individuals in their probationary or trial period.


    Supervisors or managers who are subject to a removal, demotion, or suspension under this
    bill are entitled to (1) advance notice of the action and supporting evidence, (2) representation
    by an attorney or representative, and (3) grieve the action in accordance with an internal
    grievance process.


    The bill also provides protections from removal, demotion, or suspension for supervisor
    or managers who are whistleblowers or are seeking corrective action for an alleged prohibited
    personnel practice such as discrimination.


    The bill also modifies the procedures to remove, demote, or suspend VA employees or senior
    executives based on performance or misconduct, specifically by requiring the VA to determine
    by substantial evidence that the performance or misconduct of the individual warrants
    such removal, demotion, or suspension. Such procedures must apply retroactively, beginning
    on the date of enactment of the Department of Veterans Affairs Accountability and Whistleblower
    Protection Act of 2017 (June 23, 2017).'
  summary_version: Introduced in Senate
  summary_date: '2025-01-16'
  summary_truncated: false
