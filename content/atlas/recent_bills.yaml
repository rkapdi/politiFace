- bill: HR 9496
  congress: 119
  title: End Tax Penalties on American Hostages Act
  action_date: '2026-09-08'
  action: Placed on the Union Calendar, Calendar No. 697.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/9496
  summary: 'End Tax Penalties on American Hostages Act


    This bill extends certain federal tax deadlines for U.S. nationals who are unlawfully
    or wrongfully detained abroad or held hostage abroad and their spouses. The bill also
    allows for an abatement and refund of additional taxes, interest, and penalties assessed
    to such individuals for failing to meet a federal tax deadline during a period of detention.


    Specifically, under the bill, the time period during which a U.S. national is unlawfully
    or wrongfully detained abroad or held hostage abroad is disregarded in determining certain
    federal tax deadlines, including deadlines for


    filing a return for and paying federal income, estate, gift, employment, or excise taxes;


    a tax credit or refund claim; and


    the determination, assessment, and collection of additional taxes, interest, or penalties.


    The bill requires the Department of State and the Department of Justice to annually provide
    the Internal Revenue Service (IRS) with lists to identify U.S. nationals who qualify for
    an extension.


    The bill also requires the IRS to (1) abate and refund additional taxes, interest, and
    penalties assessed for any tax year ending during a period of detention for which an extension
    of a federal tax deadline is permitted; and (2) establish a program allowing U.S. nationals
    unlawfully or wrongfully detained abroad or taken hostage abroad (or their spouse or dependent)
    to claim a refund of additional taxes, interest, and penalties assessed for any tax year
    ending during a period of detention from 2021 to the bill’s enactment date.'
  summary_version: Reported to House
  summary_date: '2026-09-08'
  summary_truncated: false
- bill: HR 7834
  congress: 119
  title: Safe Cloud Storage Act
  action_date: '2026-09-08'
  action: Placed on the Union Calendar, Calendar No. 703.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/7834
  summary: 'Safe Cloud Storage Act


    This bill limits the civil and criminal liability of vendors that contract with law enforcement
    agencies to provide digital storage services (e.g., cloud-based storage) for storing,
    maintaining, and processing child sexual abuse material (CSAM) in investigations of online
    child sexual exploitation.


    Under current law, the National Center for Missing & Exploited Children (NCMEC) receives
    reports of online child sexual exploitation via its CyberTipline, evaluates and prioritizes
    the reports, and refers the reports to law enforcement agencies to investigate. Currently,
    federal law limits the liability of vendors that contract directly with the NCMEC to store
    and transfer CSAM. However, federal law does not limit the liability of vendors that contract
    with law enforcement agencies to assist in investigations.


    This bill establishes liability protections for vendors that contract with federal, state,
    and local law enforcement agencies to store, maintain, and process CSAM in investigations
    of online child sexual exploitation. Specifically, the bill prohibits a civil claim or
    criminal charge in federal or state court against such a vendor, so long as the vendor
    has not engaged in intentional misconduct or negligent conduct, acted with malice or reckless
    disregard, or acted for a purpose unrelated to its contractual duties.


    The bill requires vendors to comply with cybersecurity requirements for CSAM that is stored,
    maintained, or processed. The bill also requires vendors to comply with storage requirements
    for CSAM that is retained as evidence.'
  summary_version: Reported to House
  summary_date: '2026-09-08'
  summary_truncated: false
