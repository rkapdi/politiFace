  title: Proposing an amendment to the Constitution of the United States relating to the authority
    of Congress and the States to regulate contributions and expenditures intended to affect
    elections and to enact public financing systems for political campaigns.
  action_date: '2023-01-09'
  action: Referred to the House Committee on the Judiciary.
