- bill: S 668
  congress: 119
  title: SAFE STEPS for Veterans Act of 2025
  action_date: '2025-12-10'
  action: 'Committee on Veterans'' Affairs. Hearings held. Hearings printed: S.Hrg. 119-247.'
  origin_chamber: Senate
  url: https://www.congress.gov/bill/119th-congress/senate-bill/668
  summary: 'Supporting Access to Falls Education and Prevention and Strengthening Training
    Efforts and Promoting Safety Initiatives for Veterans Act of 2025 or the SAFE STEPS for
    Veterans Act of 2025


    This bill addresses certain mobility and aging care and services provided by the Department
    of Veterans Affairs (VA).


    First, the bill requires the establishment and operation of the Office of Falls Prevention
    within the Veterans Health Administration (VHA) for purposes of providing, evaluating,
    and improving VA health care services related to falls prevention.


    Among other duties, the office must oversee and support a national education campaign
    for veterans, their families, and health care providers that focuses on reducing falls
    and increases awareness of available benefits or services provided by the VA to reduce
    falls.


    The bill also expands membership of the Interagency Coordinating Committee on Healthy
    Aging and Age-Friendly Communities by including the VA.


    The VA must issue or update directives of the VHA for facilities and providers relating
    to safe patient handling and mobility policies.


    Additionally, the VA must determine the feasibility and advisability of implementing a
    pilot program to provide home improvements and structural alterations to prevent falls
    for veterans who are eligible for such services under VA laws.


    Finally, the bill requires the VA to ensure certain veterans receive a falls risk assessment
    from a licensed physical therapist or occupational therapist.'
  summary_version: Introduced in Senate
  summary_date: '2025-02-20'
  summary_truncated: false
- bill: S 3329
  congress: 119
  title: United States Cadet Nurse Corps Service Recognition Act of 2025
  action_date: '2025-12-03'
  action: Read twice and referred to the Committee on Veterans' Affairs.
  origin_chamber: Senate
  url: https://www.congress.gov/bill/119th-congress/senate-bill/3329
  summary: 'United States Cadet Nurse Corps Service Recognition Act of 2025


    This bill recognizes service as a member of the U.S. Cadet Nurse Corps between July 1,
    1943, and December 31, 1948, as active duty service. The active duty designation entitles
    qualifying individuals to certain benefits afforded to veterans, such as burial benefits
    (not including interment at Arlington National Cemetery) and honorary veteran status.


    Under the bill, the Department of Defense (DOD) must issue individuals who served in the
    corps during the specified period a discharge from their service under honorable conditions
    if such a discharge is warranted based on the duration and nature of the service.


    Such individuals are not entitled to Department of Veterans Affairs benefits aside from
    those related to burials and memorials.


    The bill also authorizes DOD to produce a service medal or other commendation, memorial
    plaque, or grave marker to honor the individuals.'
  summary_version: Introduced in Senate
  summary_date: '2025-12-03'
  summary_truncated: false
