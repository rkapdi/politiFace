- bill: HR 7198
  congress: 118
  title: Prove It Act of 2024
  action_date: '2024-12-09'
  action: Received in the Senate.
  origin_chamber: House
  url: https://www.congress.gov/bill/118th-congress/house-bill/7198
  summary: 'Prove It Act of 2024


    This bill expands the requirements for federal agency rulemaking with respect to small
    businesses, organizations, and governmental jurisdictions.


    Specifically, when conducting an initial regulatory flexibility analysis, agencies must
    include, where feasible, any reasonably foreseeable potential indirect costs the proposed
    rule may impose on such small entities.


    Further, if an agency certifies that an initial regulatory flexibility analysis is not
    required because the rule will not have a significant economic impact on a substantial
    number of small entities, the agency must provide such certification within 10 days to
    the Office of Advocacy of the Small Business Administration. A small entity or group of
    small entities may petition the Office of Advocacy to review such certification. The petition
    must include specified information, such as the issues the petitioner believes should
    be addressed and a proposed solution to the issues raised.


    If the Office of Advocacy ultimately determines, upon a full review of the petition, that
    the proposed rule would have a significant economic impact on a substantial number of
    small entities, the agency promulgating the rule must perform an initial and final regulatory
    flexibility analysis for the rule. Additionally, if the agency does not participate or
    assist in the full review process, the finalized rule shall not apply to small entities.


    The bill also requires agencies to publish, and allow for comments on, all guidance documents
    with respect to any rule an agency determines is likely to have a significant economic
    impact on a substantial number of small entities.'
  summary_version: Reported to House
  summary_date: '2024-11-22'
