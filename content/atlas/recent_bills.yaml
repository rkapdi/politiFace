  summary: 'Tribal Warrant Fairness Act


    This bill authorizes the U.S. Marshals Service (USMS) to assist with certain tribal law
    enforcement activities and allows tribal law enforcement agencies to participate in regional
    fugitive task forces.


    Specifically, the bill authorizes the USMS, upon the request of an Indian tribe, to investigate
    tribal fugitive matters. The USMS may investigate tribal fugitive matters both within
    and outside the United States, as directed by the Department of Justice (DOJ).


    Additionally, the USMS, upon the request of tribal law enforcement agencies, may assist
    these agencies in locating and recovering missing children.


    The bill also allows tribal law enforcement agencies to participate in regional fugitive
    task forces. DOJ must consult with tribes when establishing new task forces. (The USMS
    oversees regional fugitive task forces. Currently, these task forces combine the efforts
    of federal, state, and local law enforcement agencies to locate and apprehend fugitives.)'
