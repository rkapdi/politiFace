  title: I&A Mission Reorientation Act of 2026
  action_date: '2026-06-24'
  action: 'Ordered to be Reported (Amended) by the Yeas and Nays: 30 - 0.'
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/7443
  summary: 'I&A Mission Reorientation Act of 2026


    This bill requires the Office of Intelligence and Analysis (I&A) of the Department of
    Homeland Security (DHS) to prioritize providing intelligence support to state, local,
    tribal, and territorial governments and private sector entities equally with providing
    support to other elements of the intelligence community.


    To carry out this requirement, the bill directs I&A to facilitate two-way information
    sharing between I&A and its government and private sector partners and to identify and
    address threats using forward-deployed intelligence capabilities. I&A must also ensure
    that its provision of intelligence support to DHS leadership does not interfere with I&A’s
    responsibilities to government and private sector partners.


    Further, the bill directs I&A to maintain robust and sustained engagement with fusion
    centers. (Fusion centers are collaborative efforts between federal, state, local, or tribal
    governments that combine resources, expertise, or information to detect, prevent, investigate,
    and respond to criminal or terrorist activity.)


    After the bill’s enactment, I&A must report to Congress on its efforts to implement these
    provisions.'
  summary_version: Introduced in House
