- bill: HR 9368
  congress: 119
  title: Voter ID Act
  action_date: '2026-07-15'
  action: Placed on the Union Calendar, Calendar No. 653.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/9368
  summary: 'Voter ID Act


    This bill establishes certain photo identification requirements for voting in federal
    elections.


    Specifically, the bill prohibits a state or local election official from providing a ballot
    for a federal election to an individual who does not present valid physical photo identification.


    Next, the bill outlines the availability of provisional ballots and the requirements for
    counting those ballots. An individual who does not present a valid photo identification
    must be permitted to cast a provisional ballot. However, an election official may not
    determine that the individual is eligible under state law to vote in the election unless,
    not later than three days after casting the provisional ballot, the individual presents
    (1) the identification required, or (2) an affidavit attesting that the individual does
    not possess the identification because of a religious objection to being photographed.


    An election official may not allow for voting methods other than in-person voting unless
    the individual (1) submits the ballot with a copy of their photo identification or the
    last four digits of their Social Security number with an affidavit attesting that the
    individual is unable to obtain a copy of a valid photo identification after making reasonable
    efforts to obtain a copy, or (2) includes a notarization attesting that the individual
    has personally marked the ballot. This prohibition shall not apply to overseas military
    voters and certain disabled or elderly voters.


    The Election Assistance Commission must make grants to states and tribal governments that
    provide eligible individuals with free valid photo identification.'
