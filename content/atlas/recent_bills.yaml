- bill: S 278
  congress: 119
  title: Kids Off Social Media Act
  action_date: '2025-06-30'
  action: Placed on Senate Legislative Calendar under General Orders. Calendar No. 108.
  origin_chamber: Senate
  url: https://www.congress.gov/bill/119th-congress/senate-bill/278
  summary: 'Kids Off Social Media Act


    This bill limits children’s access to social media platforms and requires both platforms
    and schools to implement certain restrictions on children’s social media usage.


    Specifically, the bill prohibits social media platforms from knowingly allowing children
    under the age of 13 to create or maintain accounts. Platforms must delete existing accounts
    held by children and any personal data collected from child users. Platforms are also
    generally prohibited from using automated systems to suggest or promote content based
    on personal data collected from users under the age of 17. The bill directs the Federal
    Trade Commission to enforce these provisions. States may also bring civil actions against
    platforms whose violations of these provisions have adversely affected their residents.


    Further, as a condition of receiving discounted telecommunications service under the Schools
    and Libraries Universal Service Support (E-Rate) program, schools must enforce policies
    preventing the use of E-Rate-supported services, networks, and devices to access social
    media, and must use blocking or filtering technology to prevent such access. Schools that
    do not make a good faith effort to comply and correct known violations are required to
    reimburse any E-Rate support they received for the applicable period. Schools must also
    submit copies of their internet safety policies to the Federal Communications Commission
    for publication.


    Under the bill, social media platforms are defined as public-facing sites that function
    primarily as forums for user-generated content. Some categories of online platforms are
    explicitly excluded, including sites that provide primarily videoconferencing, emailing,
    or educational services.'
  summary_version: Introduced in Senate
  summary_date: '2025-01-28'
  summary_truncated: false
