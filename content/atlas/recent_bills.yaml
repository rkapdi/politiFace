  summary: 'Supplemental Oxygen Access Reform Act of 2025 or the SOAR Act of 2025


    This bill establishes certain requirements with respect to the payment and provision of
    supplemental oxygen and related services under Medicare.


    For example, the bill provides for separate payments, indexed to inflation, of oxygen
    and related equipment, supplies, and services under Medicare (rather than under the competitive
    acquisition program). It also specifically covers services that are provided by respiratory
    therapists under Medicare and provides for an additional payment adjustment for these
    services.


    Additionally, the bill (1) requires the Centers for Medicare & Medicaid Services to develop
    an electronic template for providers to use when prescribing oxygen and related equipment,
    supplies, and services; and (2) establishes certain rights for beneficiaries receiving
    these items and services, such as the right to choose their suppliers and to receive clear
    communications and be informed about the services provided.'
  summary_version: Introduced in House
