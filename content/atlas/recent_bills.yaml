    principles in this bill, and (2) until after the U.S. Army Corps of Engineers (Corps of
    Engineers) and the Environmental Protection Agency (EPA) carry out the requirements of
    this bill.


    In promulgating a revised regulatory definition, the Corps of Engineers and the EPA must
    adhere to three principles. First, the Clean Water Act is an Act to protect traditional
    navigable waters from water pollution.


    Second, the definition of "waters of the United States" should identify bodies of water
    subject to federal jurisdiction and should include:


    traditional navigable waters and interstate waters;


    certain lengths of streams that are drinking water source protection areas;


    certain lengths of streams with surface flow in a normal year of sufficient volume, duration,
    and frequency that pollutants in that length of stream would degrade the water quality
    of a connected traditional navigable water, based on a quantifiable and statistically
    valid measure of flow; and


    wetlands situated next to a water of the United States that, in a normal year, prevent
    the movement of pollutants to a navigable water.


