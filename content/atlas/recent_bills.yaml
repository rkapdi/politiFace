- bill: HR 726
  congress: 119
  title: Crow Tribe Water Rights Settlement Amendments Act of 2025
  action_date: '2026-08-27'
  action: Placed on the Union Calendar, Calendar No. 670.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/726
  summary: 'Crow Tribe Water Rights Settlement Amendments Act of 2025


    This bill revises the water rights settlement agreement entered into by the Crow Tribe
    of Montana and Montana.


    The Crow Tribe Water Rights Settlement Act of 2010 ratified, authorized, and confirmed
    the water rights compact between the tribe and Montana. Among other provisions, this settlement
    act authorized the Bureau of Reclamation to plan, design and construct the following two
    major projects on the Crow Reservation: (1) the rehabilitation and improvement of the
    Crow Irrigation Project (CIP); and (2) the planning, design, and construction of the MR&I
    System (the municipal, rural, and industrial water system of the Crow Reservation).


    Among other provisions, the bill revises the settlement act to


    replace references to the MR&I System with MR&I Projects;


    establish a nontrust, interest-bearing account (to be known as the Crow CIP Implementation
    Account) to allow Reclamation to continue to work on the rehabilitation of the CIP;


    create a new MR&I Projects Account, through which the tribe must use funds for activities
    related to water production, treatment, or delivery infrastructure; and


    extend by five years (to 2030) the period during which the tribe has the exclusive right
    to construct hydropower facilities on the Yellowtail Afterbay Dam in Montana.'
  summary_version: Introduced in House
  summary_date: '2025-01-24'
  summary_truncated: false
- bill: HR 6021
  congress: 119
  title: Archie Cavanaugh Migratory Bird Treaty Clarification Act
  action_date: '2026-08-27'
  action: Placed on the Union Calendar, Calendar No. 675.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/6021
  summary: 'Archie Cavanaugh Migratory Bird Treaty Amendment Act


    This bill states that nothing in the Migratory Bird Treaty Act of 1918 (MBTA) prohibits
    possessing, selling, bartering, purchasing, shipping, or transporting any authentic Alaska
    Native handicraft, clothing, or art on the basis that it contains a nonedible migratory
    bird part, so long as the bird was not taken in a wasteful or illegal manner. (The MBTA
    implements four international treaties that the United States entered into with Canada,
    Mexico, Japan, and Russia. The MBTA prohibits the taking of protected migratory bird species
    without prior authorization.)


    The bill directs the Department of State to work with the Department of the Interior to
    enter into appropriate bilateral procedures with countries that are parties to the treaties
    under the MBTA to clarify the treatment of Alaska Native handicraft containing nonedible
    migratory bird parts from the species of migratory birds listed in those treaties. Further,
    Interior must modify any regulations implementing the MBTA to implement this bill.'
  summary_version: Introduced in House
  summary_date: '2025-11-12'
