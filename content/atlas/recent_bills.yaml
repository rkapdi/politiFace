- bill: HRES 918
  congress: 117
  title: Honoring the legacy of the Harlem Renaissance, a cultural, social, and political
    movement in American history.
  action_date: '2022-02-09'
  action: Referred to the House Committee on Oversight and Reform.
  origin_chamber: House
  url: https://www.congress.gov/bill/117th-congress/house-resolution/918
  summary: 'This resolution recognizes that the Harlem Renaissance represented a pivotal moment
    in American history for African Americans and the African diaspora community of intellectuals,
    artists, performers, writers, poets, and musicians whose works of political discourse
    and creative expression set a path for self-determination and self-empowerment that is
    still evident today.


    The resolution also celebrates the lasting impact of the Harlem Renaissance on the art,
    literature, music, discourse, and culture of the United States.'
