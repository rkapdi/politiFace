  title: Caring for Survivors Act of 2023
  action_date: '2024-04-16'
  action: Forwarded by Subcommittee to Full Committee by Voice Vote.
  origin_chamber: House
  url: https://www.congress.gov/bill/118th-congress/house-bill/1083
  summary: 'Caring for Survivors Act of 2023


    This bill increases the monthly rate of dependency and indemnity compensation payable
    to surviving spouses through the Department of Veterans Affairs (VA).


    Dependency and indemnity compensation is a monthly payment made to eligible survivors
    (i.e., spouses, parents, or children) of (1) certain veterans who died as a result of
    a service-connected condition; (2) service members killed while on active military duty
    or active or inactive duty for training; or (3) veterans who did not die from a service-connected
    condition, but were totally disabled by a service-connected disability for a certain period
    of time.


    The bill also (1) reduces, from 10 years to 5 years, the period of time that certain veterans
    must have been rated totally disabled due to a service-connected disability in order for
    a survivor to qualify for benefits; and (2) specifies the amount that is payable to survivors
    of veterans who were rated totally disabled for a period of less than 10 years before
    their death.'
  summary_version: Introduced in House
