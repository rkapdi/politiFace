- bill: HR 1497
  congress: 119
  title: NIH Reform Act
  action_date: '2025-02-21'
  action: Referred to the House Committee on Energy and Commerce.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/1497
  summary: 'NIH Reform Act


    This bill separates the National Institute of Allergy and Infectious Diseases (NIAID)
    into three separate institutes: the National Institute of Allergic Diseases, the National
    Institute of Infectious Diseases, and the National Institute of Immunologic Diseases.


    The bill also requires that the President appoint the directors of the new institutes
    (under current law, the Director of NIAID is appointed by the Director of the National
    Institutes of Health). It further requires that the Senate confirm the appointment of
    the directors of the new institutes and the National Cancer Institute.'
  summary_version: Introduced in House
