- bill: HR 3554
  congress: 118
  title: Protecting Veteran Community Care Act
  action_date: '2023-06-14'
  action: Referred to the Subcommittee on Health.
  origin_chamber: House
  url: https://www.congress.gov/bill/118th-congress/house-bill/3554
  summary: 'Protecting Veteran Community Care Act


    This bill requires the Department of Veterans Affairs (VA) to furnish residential mental
    health or substance-use services to certain veterans through the Veterans Community Care
    Program (VCCP). Specifically, the VA must furnish such care if a veteran (1) meets VA
    criteria for priority admission to a VA Mental Health Residential Rehabilitation Treatment
    Program and the VA is unable to accommodate priority admission, or (2) has contacted the
    VA to request such mental health services and the VA is not able to furnish such services
    in a manner that complies with VA access standards for specialty care provided under the
    VCCP.


    The VA must ensure that a referral to an alternate Mental Health Residential Rehabilitation
    Treatment Program does not take precedence over timely access to mental health or substance-use
    services unless the referral is requested by the veteran.


    The VA is prohibited from determining a veteran is ineligible for VCCP care solely because
    VCCP providers are unable to comply with wait times or access standards.


    If multiple options for care or services are available, the VA must permit a veteran to
    elect the option the veteran prefers.


    Additionally, the bill provides minimum standards for residential mental health or substance-use
    services provided under the VCCP (e.g., treatment programs or facilities must be licensed
    and accredited for the specified services).'
  summary_version: Introduced in House
  summary_date: '2023-05-18'
