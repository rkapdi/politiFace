- bill: S 49
  congress: 119
  title: Expel Illegal Chinese Police Act of 2025
  action_date: '2025-01-09'
  action: Read twice and referred to the Committee on Foreign Relations.
  origin_chamber: Senate
  url: https://www.congress.gov/bill/119th-congress/senate-bill/49
  summary: 'Expel Illegal Chinese Police Act of 2025


    This bill requires sanctions on certain foreign persons associated with the Chinese Communist
    Party (CCP) or Chinese law enforcement institutions, including those seeking to establish
    a Chinese police presence in the United States.


    The bill requires the President to impose visa-blocking sanctions on certain non-U.S.
    nationals (aliens under federal law), including those who are (1) employees of Chinese
    law enforcement institutions or their immediate family members, or (2) directly associated
    with a Chinese police or United Front Work Department (UFWD) presence in the United States.
    (The CCP''s UFWD seeks to win support for the CCP from non-CCP groups at home and abroad,
    with a focus on ethnic-Chinese diaspora communities.)


    The President must also impose property-blocking sanctions on foreign individuals or entities
    that are (1) Chinese law enforcement institutions, their senior leaders, or those acting
    under the control of such institutions; (2) directly associated with establishing or maintaining
    a Chinese police presence in the United States; or (3) acting under the control of the
    UFWD with the intention of covertly monitoring or intimidating those living in the United
    States.


    Additionally, the bill requires the President to prohibit federal agencies from participating
    in investigations into foreign persons subject to these sanctions unless the investigation
    is (1) initiated by the U.S. government; or (2) the President determines that such participation
    is vital to the health, safety, and well-being of U.S. citizens.'
  summary_version: Introduced in Senate
  summary_date: '2025-01-09'
  summary_truncated: false
