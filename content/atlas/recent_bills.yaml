- bill: HR 6506
  congress: 119
  title: Taxpayer Due Process Enhancement Act
  action_date: '2026-05-20'
  action: Received in the Senate and Read twice and referred to the Committee on Finance.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/6506
  summary: 'Taxpayer Due Process Enhancement Act


    This bill suspends the period of time allowed for claiming a federal tax refund (limitations
    period) during collection due process (CDP) proceedings, prohibits the Internal Revenue
    Service (IRS) from applying tax overpayments to a tax liability that is disputed in such
    proceedings, and expands the Tax Court’s jurisdiction.


    As background, IRS collection actions and the underlying tax liability (in some circumstances)
    may be disputed in a CDP hearing. Collection actions are suspended during CDP proceedings,
    but the IRS may apply tax overpayments from other tax years to the disputed tax liability.
    The Tax Court may review an appeal of a CDP hearing determination. However, the Supreme
    Court held in Commissioner v. Zuch that the Tax Court loses jurisdiction over a CDP appeal
    if the CDP hearing determination is revoked because tax overpayments are applied to and
    fully satisfy the tax liability. In such circumstances, the taxpayer may claim a refund
    and seek redress in federal district court. Currently, the limitations period to file
    a refund claim is not suspended during CDP proceedings.


    The bill


    suspends the limitations period for claiming a tax refund during CDP proceedings (with
    exceptions),


    prohibits the IRS from applying tax overpayments to a properly disputed tax liability
    during CDP proceedings (unless waived or an exception applies),


    expands the Tax Court''s jurisdiction in CDP cases to include jurisdiction over the underlying
    tax liability amount (if properly disputed), and


    provides that the Tax Court retains its jurisdiction if the IRS abandons collection actions.'
  summary_version: Reported to House
  summary_date: '2026-01-07'
  summary_truncated: false
- bill: HR 3726
  congress: 119
  title: Fisher House Availability Act of 2026
  action_date: '2026-05-20'
  action: Received in the Senate and Read twice and referred to the Committee on Veterans'
    Affairs.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/3726
  summary: 'Fisher House Availability Act of 2026


    This bill expands eligibility for temporary lodging at a Fisher House to additional individuals
    receiving medical care or treatment at a Department of Veteran Affairs (VA) or non-VA
    facility or those accompanying individuals receiving such treatment. (Fisher Houses are
    where the VA furnishes no-cost lodging to veterans and other eligible individuals when
    receiving treatment or accompanying an individual receiving treatment.)


    Specifically, the bill authorizes the VA to provide lodging at a Fisher House on a space-available
    basis to


    members of the uniformed services performing active duty (i.e., covered beneficiaries)
    who must travel a significant distance to receive care or services;


    family members and others accompanying such covered beneficiaries to receive care or services;


    veterans, members of a veteran''s family, and others who must travel a significant distance
    for a member of a veteran''s family to receive care or services; and


    covered beneficiaries, members of a covered beneficiary’s family, and others who must
    travel a significant distance for a member of a beneficiary’s family to receive care or
    services.


    Finally, the bill extends the limitation on pension amounts for certain hospitalized or
    institutionalized veterans through July 31, 2033.'
  summary_version: Reported to House
  summary_date: '2026-04-30'
  summary_truncated: false
- bill: HR 3482
  congress: 119
  title: Veterans Community Care Scheduling Improvement Act
  action_date: '2026-05-20'
  action: Received in the Senate and Read twice and referred to the Committee on Veterans'
    Affairs.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/3482
  summary: 'Veterans Community Care Scheduling Improvement Act


    This bill requires the Department of Veterans Affairs (VA) to implement an electronic
    process for scheduling health care appointments furnished by the VA or through the Veterans
    Community Care Program (VCCP) and extends an existing limitation on certain pensions.
    Under the bill, the VA must implement the electronic process not later than two years
    after the enactment of this bill.


    The VA must implement a mandatory training program for VA schedulers or other employees
    involved in scheduling appointments regarding guidelines for the implementation of the
    electronic process. Additionally, the VA must prescribe performance benchmarks and outcome-based
    metrics for the electronic process.


    The VA must also implement an outreach strategy to encourage non-VA health care providers
    participating in the VCCP to participate in the electronic process.


    Under current law, the pension paid to veterans who reside in Medicaid nursing homes and
    have no spouse or child is limited to $90 a month through January 31, 2033. The bill extends
    this limitation through June 30, 2033.'
