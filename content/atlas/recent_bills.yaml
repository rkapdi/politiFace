- bill: HR 5587
  congress: 119
  title: HEATS Act
  action_date: '2026-07-15'
  action: Committee on Energy and Natural Resources Subcommittee on Public Lands, Forests,
    and Mining. Hearings held.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/5587
  summary: 'Harnessing Energy At Thermal Sources Act or the HEATS Act


    This bill exempts certain geothermal activities on state and private lands (except Indian
    lands) from drilling permit requirements as well as environmental and historic preservation
    review requirements.


    First, the bill prohibits the Department of the Interior from requiring an operator to
    obtain a drilling permit under the Geothermal Steam Act of 1970 for any geothermal exploration
    and production activity conducted on a nonfederal surface estate (i.e., the part of the
    estate that is above ground) if (1) the United States holds an ownership interest of less
    than 50% of the subsurface geothermal estate to be accessed by the proposed action, and
    (2) the operator submits to Interior a state permit to conduct the geothermal exploration
    and production activity on the nonfederal surface estate.


    Next, the bill states that such geothermal exploration and production activity is not
    considered a major federal action under National Environmental Policy Act of 1969 (NEPA).
    Thus, such activity does not trigger NEPA''s environmental review requirements.


    In addition, the bill exempts such activity from the consultation requirements under the
    Endangered Species Act of 1973. It also exempts the activity from review under the National
    Historic Preservation Act unless the state in which the activity occurs does not have
    a state law that addresses the preservation of historic properties.'
  summary_version: Introduced in House
  summary_date: '2025-09-26'
  summary_truncated: false
- bill: HR 1687
  congress: 119
  title: CLEAN Act
  action_date: '2026-07-15'
  action: Committee on Energy and Natural Resources Subcommittee on Public Lands, Forests,
    and Mining. Hearings held.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/1687
  summary: 'Committing Leases for Energy Access Now Act or the CLEAN Act


    This bill directs the Department of the Interior to increase the frequency of lease sales
    for developing and utilizing geothermal energy on federal land.


    Specifically, Interior must hold lease sales at least once a year (rather than two years)
    in states with pending nominations of federal land to be leased for geothermal energy
    development.


    In conducting such lease sales, Interior must offer all of the pending nominated parcels
    eligible for geothermal development and utilization under the resource management plan
    in effect for the state.


    If a lease sale is canceled or delayed, Interior must conduct a replacement sale during
    the same year.


    Finally, the bill establishes deadlines for Interior to respond to applications for geothermal
    drilling permits.'
  summary_version: Introduced in House
  summary_date: '2025-02-27'
  summary_truncated: false
