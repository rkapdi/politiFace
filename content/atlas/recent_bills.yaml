- bill: HR 9394
  congress: 119
  title: Civil Preparedness for Agroterrorism Exercise Act of 2026
  action_date: '2026-09-10'
  action: Placed on the Union Calendar, Calendar No. 712.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/9394
  summary: 'Civil Preparedness for Agroterrorism Exercise Act of 2026


    This bill requires the Department of Homeland Security (DHS), within four years after
    the bill’s enactment, to conduct an exercise to enhance collective domestic prevention,
    response, and recovery regarding acts of agroterrorism (i.e., terrorism targeting or threatening
    agriculture and food systems of vital importance to national security, public health,
    or safety). The scenario in the exercise must involve agroterrorists transporting and
    deploying in the United States a biological agent (e.g., microorganism or infectious substance)
    capable of harming critical agriculture and food operations and must address how relevant
    public and private entities can coordinate to develop preparedness and mitigate widespread
    disruption.


    Within 180 days after completion of the exercise, DHS must submit to Congress an after-action
    report including the findings of the exercise, plans for incorporating lessons learned
    into future operations, and recommended legislative actions.'
