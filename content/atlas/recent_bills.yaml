  title: Ski Hill Resources for Economic Development Act of 2023
  action_date: '2024-11-21'
  action: Placed on Senate Legislative Calendar under General Orders. Calendar No. 575.
  origin_chamber: Senate
  url: https://www.congress.gov/bill/118th-congress/senate-bill/254
  summary: 'Ski Hill Resources for Economic Development Act of 2023


    This bill allocates ski area permit rental charges for ski area administration, improvements,
    visitor services, and wildfire preparedness. Such charges are collected by the Department
    of Agriculture (USDA) from ski area operators on National Forest System land.


    USDA shall expend 80% of the ski area permit rental charges from a National Forest System
    unit at that unit in accordance with the following:


    75% shall be used at the unit for activities such as administration of the ski area permit
    program, visitor information, or reducing the likelihood of wildfire in or adjacent to
    a recreation site; and


    25% shall be used at the unit for activities such as repair of a Forest Service-owned
    facility, habitat restoration, or search and rescue activities.


    The remaining 20% of ski area permit rental charges shall be expended by USDA for any
    of the activities specified in this bill at any National Forest System unit.'
  summary_version: Introduced in Senate
  summary_date: '2023-02-02'
  summary_truncated: false
- bill: HR 7409
  congress: 118
  title: HEATS Act
  action_date: '2024-11-18'
  action: Received in the Senate and Read twice and referred to the Committee on Energy and
    Natural Resources.
  origin_chamber: House
  url: https://www.congress.gov/bill/118th-congress/house-bill/7409
  summary: 'Harnessing Energy At Thermal Sources Act or the HEATS Act


    This bill exempts certain geothermal activities on state and private lands (except Indian
    lands) from drilling permit requirements as well as environmental and historic preservation
    review requirements.


    First, the bill prohibits the Department of the Interior from requiring an operator to
    obtain a drilling permit under the Geothermal Steam Act of 1970 for any geothermal exploration
    and production activity conducted on a nonfederal surface estate (i.e., the part of the
    estate that is above ground) if (1) the United States holds an ownership interest of less
    than 50% of the subsurface geothermal estate to be accessed by the proposed action, and
    (2) the operator submits to Interior a state permit to conduct the geothermal exploration
    and production activity on the nonfederal surface estate.


    Next, the bill states that such geothermal exploration and production activity is not
    considered a major federal action under National Environmental Policy Act of 1969 (NEPA).
    Thus, such activity does not trigger NEPA''s environmental review requirements.


    In addition, the bill exempts such activity from the consultation requirements under the
    Endangered Species Act of 1973. It also exempts the activity from review under the National
    Historic Preservation Act unless the state in which the activity occurs does not have
    a state law that addresses the preservation of historic properties.'
  summary_version: Introduced in House
  summary_date: '2024-02-20'
  summary_truncated: false
