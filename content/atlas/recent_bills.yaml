- bill: S 5254
  congress: 119
  title: Civil Nuclear Export Act of 2026
  action_date: '2026-08-05'
  action: Read twice and referred to the Committee on Banking, Housing, and Urban Affairs.
  origin_chamber: Senate
  url: https://www.congress.gov/bill/119th-congress/senate-bill/5254
  summary: 'Civil Nuclear Export Act of 2026


    This bill provides the Export-Import Bank with certain authorities to finance civil nuclear
    energy exports.


    Specifically, the bill allows the Export-Import Bank to provide financing for the purchase
    of liquid metal fast breeder nuclear reactors and nuclear fuel reprocessing facilities
    if the purchase is otherwise permitted by law.


    Additionally, the bill expands the China and Transformational Exports Program (CTEP) by
    making civil nuclear energy eligible for financing under the program. Currently, the bank
    may extend loans, guarantees, and insurance to advance the comparative leadership of the
    United States with respect to China in specified export areas (e.g., artificial intelligence,
    biotechnology, and wireless communications equipment). This bill expands those areas to
    include civil nuclear energy technologies, materials, services, and related infrastructure
    and goods.


    The bill also revises the financial limitation on the outstanding aggregate amount of
    all of the bank''s loans, guarantees, and insurance. In particular, the bill exempts those
    amounts attributed by the bank to CTEP, as long as that financing does not exceed a specified
    amount.


    The bill also increases from 2% to 4% the bank''s default rate cap. Further, the bill
    allows the bank to exclude financing under CTEP from this default rate, subject to approval
    of the bank''s board of directors.'
  summary_version: Introduced in Senate
  summary_date: '2026-08-05'
