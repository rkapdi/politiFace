  summary: 'Restore Protections for Dialysis Patients Act


    This bill specifies certain requirements for private health insurers regarding coverage
    of individuals with end stage renal disease (ESRD) who are also covered under Medicare.


    In particular, the bill specifies that insurers may not limit benefits, including limiting
    network composition, in a manner that will affect ESRD Medicare beneficiaries differently
    compared to others without ESRD. The bill additionally specifies that insurers are not
    required to include a particular renal dialysis provider or a particular number of such
    providers as part of their networks.'
  summary_version: Introduced in House
