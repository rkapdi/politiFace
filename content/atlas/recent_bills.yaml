- bill: HR 5343
  congress: 119
  title: Ensuring Patient Access to Critical Breakthrough Products Act
  action_date: '2025-09-17'
  action: 'Ordered to be Reported in the Nature of a Substitute (Amended) by the Yeas and
    Nays: 37 - 3.'
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/5343
  summary: 'Ensuring Patient Access to Critical Breakthrough Products Act


    This bill provides for Medicare coverage of medical devices that are approved under the
    Food and Drug Administration (FDA) Breakthrough Devices Program. (Under the program, manufacturers
    work with the FDA to expedite the review and approval of certain medical devices that
    provide for more effective treatment or diagnosis of life-threatening or irreversibly
    debilitating human diseases or conditions.)


    The bill allows designated medical breakthrough devices to be temporarily covered under
    Medicare during a four-year transitional period. Manufacturers must apply to the Centers
    for Medicare & Medicaid Services (CMS) to receive this designation. Qualifying devices
    must (1) have received priority review from the FDA, (2) received premarket approval (if
    applicable) based on clinical data that includes data from Medicare beneficiaries, (3)
    already generally qualify for Medicare coverage, and (4) not present an undue risk of
    harm that outweighs potential clinical benefits for Medicare beneficiaries.


    The CMS must approve or deny applications within six months of receipt and must provide
    an explanation in the case of a denial. In addition, the CMS must make permanent coverage
    decisions before the end of the transitional period upon a timely request to do so, as
    specified.


    The bill provides funds through FY2030 for the CMS to implement the bill.'
  summary_version: Introduced in House
  summary_date: '2025-09-15'
  summary_truncated: false
- bill: HR 5269
  congress: 119
  title: RESULTS Act
  action_date: '2025-09-10'
  action: Referred to the Committee on Energy and Commerce, and in addition to the Committee
    on Ways and Means, for a period to be subsequently determined by the Speaker, in each
    case for consideration of such provisions as fall within the jurisdiction of the committee
    concerned.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/5269
  summary: 'Reforming and Enhancing Sustainable Updates to Laboratory Testing Services Act
    of 2025 or the RESULTS Act


    This bill requires the use of particular data from the private sector to inform Medicare
    payment rates for certain widely available laboratory tests.


    Specifically, the Centers for Medicare & Medicaid Services (CMS) must contract with an
    entity that maintains a database of claims data for clinical diagnostic laboratory tests
    that (1) are not advanced diagnostic tests, and (2) were furnished by more than 100 providers
    and suppliers of such services over a specified six-month period (i.e., widely available
    tests).


    The database must meet specified requirements, such as having data that is representative
    of the entire country and from more than 50 private payors and claims administrators.
    The contracted entity must be a nonprofit entity that is not affiliated with any government
    agency, any insurance issuer or provider, or any other organization in the health care
    sector.


    Beginning January 1, 2028, the CMS must use the information obtained from the database
    to inform Medicare payment rates for these widely available laboratory tests.


    The bill additionally specifies processes for determining payment rates for laboratory
    tests that are not advanced diagnostic tests, are not widely available, and lack adequate
    claims data. The CMS must use certain existing processes to set appropriate rates.


    The bill also delays scheduled payment reductions for laboratory tests until 2028 and
    allows for judicial and administrative review of payment rates.'
  summary_version: Introduced in House
  summary_date: '2025-09-10'
  summary_truncated: false
