- bill: HR 7834
  congress: 119
  title: Safe Cloud Storage Act
  action_date: '2026-09-17'
  action: Received in the Senate.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/7834
  summary: 'Safe Cloud Storage Act


    This bill limits the civil and criminal liability of vendors that contract with law enforcement
    agencies to provide digital storage services (e.g., cloud-based storage) for storing,
    maintaining, and processing child sexual abuse material (CSAM) in investigations of online
    child sexual exploitation.


    Under current law, the National Center for Missing & Exploited Children (NCMEC) receives
    reports of online child sexual exploitation via its CyberTipline, evaluates and prioritizes
    the reports, and refers the reports to law enforcement agencies to investigate. Currently,
    federal law limits the liability of vendors that contract directly with the NCMEC to store
    and transfer CSAM. However, federal law does not limit the liability of vendors that contract
    with law enforcement agencies to assist in investigations.


    This bill establishes liability protections for vendors that contract with federal, state,
    and local law enforcement agencies to store, maintain, and process CSAM in investigations
    of online child sexual exploitation. Specifically, the bill prohibits a civil claim or
    criminal charge in federal or state court against such a vendor, so long as the vendor
    has not engaged in intentional misconduct or negligent conduct, acted with malice or reckless
    disregard, or acted for a purpose unrelated to its contractual duties.


    The bill requires vendors to comply with cybersecurity requirements for CSAM that is stored,
    maintained, or processed. The bill also requires vendors to comply with storage requirements
    for CSAM that is retained as evidence.'
  summary_version: Reported to House
  summary_date: '2026-09-08'
  summary_truncated: false
- bill: HR 10326
  congress: 119
  title: PROOF Act
  action_date: '2026-09-17'
  action: Received in the Senate and Read twice and referred to the Committee on the Judiciary.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/10326
  summary: 'Preventing Rip-offs and Obtaining Oversight of Funds Act or the PROOF Act


    This bill requires states to provide such information as the Department of Justice (DOJ)
    may require for the purpose of investigating or prosecuting alleged fraud committed with
    regard to certain federally funded programs.


    Programs covered by this requirement include:


    Medicaid,


    Supplemental Nutrition Assistance Program (SNAP),


    Temporary Assistance for Needy Families (TANF),


    certain federal payments and grants to state governments related to the coronavirus response,
    and


    any other program to which funds are made available to states and identified by DOJ as
    vulnerable to fraud.


    A federal agency may only use such information for law enforcement purposes related to
    fraud and may not disclose it for any unrelated administrative or commercial purpose.


    DOJ must annually report to Congress on the number of requests for information issued
    to state agencies under this bill, the programs with respect to which such requests were
    made, and the number of fraud investigations initiated and convictions secured using the
    information obtained.'
  summary_version: Introduced in House
