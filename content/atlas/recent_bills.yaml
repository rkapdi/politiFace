  title: Foreign Animal Disease Prevention, Surveillance, and Rapid Response Act of 2025
  action_date: '2025-06-11'
  action: Referred to the House Committee on Agriculture.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/3915
  summary: 'Foreign Animal Disease Prevention, Surveillance, and Rapid Response Act of 2025


    This bill provides additional funding for Animal and Plant Health Inspection Service (APHIS)
    animal disease prevention and management programs and reauthorizes the programs through
    FY2030.


    Specifically, the bill reauthorizes and provides additional funding for


    the National Animal Health Laboratory Network (a nationally coordinated network and partnership
    of federal, state, and university-associated animal health laboratories that provides
    animal health diagnostic testing to surveil and detect biological threats to U.S. animal
    health, public health, and the food supply);


    the National Animal Disease Preparedness and Response Program (a collaborative network
    between APHIS and state departments of agriculture, state health officials, universities,
    Tribes, and others to carry out projects that enhance prevention, preparedness, detection,
    and response to emerging foreign animal diseases and boost efforts to keep them from entering
    and spreading in the United States); and


    the National Animal Vaccine and Veterinary Countermeasures Bank (which allows the Department
    of Agriculture to stockpile animal vaccines and related products to use in the event of
    an outbreak of foot-and-mouth disease or other high-impact foreign animal diseases).'
  summary_version: Introduced in House
