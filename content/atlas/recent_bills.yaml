- bill: HR 1266
  congress: 119
  title: Combating Illicit Xylazine Act
  action_date: '2026-09-16'
  action: Received in the Senate. Read twice. Placed on Senate Legislative Calendar under
    General Orders. Calendar No. 623.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/1266
  summary: 'Combating Illicit Xylazine Act


    This bill regulates xylazine under the Controlled Substances Act (CSA).


    Xylazine, also known as tranq, is a nonopioid sedative and pain reliever that is approved
    for use in animals. Recently, the Drug Enforcement Administration (DEA) has reported an
    increase in trafficking of fentanyl mixed with xylazine.


    This bill adds xylazine, including its salts, isomers, and salts of isomers, to schedule
    III of the CSA. Schedule III controlled substances, including anabolic steroids, buprenorphine,
    and ketamine, have less potential for abuse than a schedule I or II substance, have a
    currently accepted medical use, and have low or moderate risk of dependence if abused.


    Under the bill, manufacturing, distributing, or dispensing xylazine, or possessing with
    intent to manufacture, distribute, or dispense xylazine for illicit use is subject to
    criminal penalties under the CSA. The bill also requires xylazine transactions to be tracked
    in the drug reporting system maintained by the DEA.


    The bill exempts from registration under the CSA persons and entities that possess xylazine
    (1) lawfully dispensed by a veterinarian or pharmacy and (2) for an animal or for use
    in certain animal-control or wildlife programs.


    The bill also exempts xylazine manufacturers from the CSA''s physical security requirements.


    Finally, the bill requires the DEA, in coordination with the Food and Drug Administration,
    to report on (1) the prevalence and impact of illicit xylazine use in the United States,
    and (2) updated information on the prevalence and proliferation of xylazine trafficking
    and misuse in the United States.'
  summary_version: Introduced in House
  summary_date: '2025-02-12'
  summary_truncated: false
