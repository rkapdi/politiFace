- bill: HR 5334
  congress: 119
  title: Lindsey O. Graham Sanctioning Russia and Iran Act of 2026
  action_date: '2026-08-10'
  action: Message on Senate action sent to the House.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/5334
  summary: 'Lindsey O. Graham Sanctioning Russia and Iran Act of 2026


    This bill imposes a variety of sanctions, tariffs, and prohibitions related to Russia,
    extends an Iran-related sanctions law, and expands a tax deduction for teacher expenses
    to include early childhood educators.


    For example, under the bill, the President must impose visa- and property-blocking sanctions
    on specified persons (individuals and entities) such as the Russian president and certain
    Russian military commanders. The President must also increase the rate of duty up to 100%
    ad valorem (i.e., relative to the value) on all goods imported into the United States
    from a country that was among the five largest importers of Russian-origin crude oil or
    natural gas if such country knowingly makes new purchases of such products after enactment
    of the bill.


    The bill prohibits (1) the export, reexport, or in-country transfer to or in Russia of
    any U.S.-produced energy or energy product; (2) U.S. persons from making new investments
    in Russia or purchasing Russian sovereign debt; and (3) trading the securities of Russian
    government-owned, -controlled, or -affiliated entities on U.S. national securities exchanges.


    The bill extends through 2031 the Iran Sanctions Act of 1996, which requires the President,
    with some exceptions, to impose sanctions on certain persons engaged in specified transactions
    related to Iran''s energy sector or Iran''s efforts to acquire or develop certain weapons.


    The bill expands eligibility for federal tax deductions of certain educator expenses to
    early childhood educators providing educational or childcare services to those under age
    6.'
  summary_version: Passed Senate
  summary_date: '2026-08-07'
  summary_truncated: false
