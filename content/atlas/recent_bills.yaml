- bill: S 571
  congress: 113
  title: Great Lakes Water Protection Act
  action_date: '2014-07-16'
  action: 'Committee on Environment and Public Works Senate Subcommittee on Water and Wildlife.
    Hearings held. With printed Hearing: S.Hrg. 113-772.'
  origin_chamber: Senate
  url: https://www.congress.gov/bill/113th-congress/senate-bill/571
  summary: 'Great Lakes Water Protection Act - Amends the Federal Water Pollution Control
    Act (commonly known as the Clean Water Act) to prohibit a publicly owned treatment works
    (POTW) from performing a discharge (defined as an intentional diversion of waste streams
    to bypass any portion of a treatment facility which results in a discharge of untreated
    or partially treated sewage into the Great Lakes) unless: (1) the bypass is unavoidable
    to prevent loss of life, personal injury, or severe property damage, there is no feasible
    alternative, and the treatment works provides notice; or (2) the bypass does not cause
    effluent limitations to be exceeded and is for essential maintenance to ensure efficient
    operation of the treatment facility.


    Requires a POTW to provide prior notice for any anticipated discharge, or notice as soon
    as practicable for any unanticipated discharge (but no later than two hours after a discharge
    begins for a POTW with an automated detection system or 12 hours after a discharge begins
    for a POTW without such system), to: (1) the Administrator of the Environmental Protection
    Agency (EPA) (or a state if the state has an approved permit program), (2) each local
    health department (or a state health department if a local department does not exist),
    (3) the municipality in which a discharge occurred, (4) each municipality with jurisdiction
    over waters that may be affected, (5) a daily newspaper of general circulation in each
    county in which such a municipality is located, and (6) the public.


    Requires a POTW, within five days after such initial notice, to provide follow-up notice
    regarding the cause of, reason for, dates and times of, anticipated duration of, volume
    of, public access areas affected by, and steps taken or planned to reduce, eliminate,
    and prevent recurrence of, the discharge. Requires the Administrator (or a state with
    an approved permit program) to annually publish and make available to the public a list
    of the POTWs from which a follow-up notice was received.


    Includes among prohibited bypasses those resulting in discharges from a POTW that consist
    of effluent routed around treatment units and blended with effluent from treatment units
    prior to discharge.


    Directs the Administrator to establish procedures to ensure that permits issued to POTWs
    under the National Pollutant Discharge Elimination System include requirements to comply
    with this Act.'
  summary_version: Introduced in Senate
  summary_date: '2013-03-14'
  summary_truncated: true
