  action_date: '2026-09-01'
  action: Placed on the Union Calendar, Calendar No. 686.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/4646
  summary: 'Whistleblower Protection Act of 2025


    This bill expands existing whistleblower protections for employees of federal contractors
    or grant recipients to apply to all contracts and grants funded by the Department of Housing
    and Urban Development (HUD) regardless of the date of execution.


    Current law protects employees of federal contractors or grant recipients from a reprisal
    (i.e., discharge, demotion, or discrimination) for disclosing evidence to Congress or
    another appropriate official of certain misconduct involving federal contracts, grants,
    or funds. This provision currently applies only to contracts and grants signed or modified
    after the law took effect in 2013. The bill expands these protections to apply to HUD
    contracts and grants signed before the law was enacted.'
