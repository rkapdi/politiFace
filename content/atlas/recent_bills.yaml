- bill: S 1545
  congress: 118
  title: Veterans Health Care Freedom Act
  action_date: '2023-07-12'
  action: 'Committee on Veterans'' Affairs. Hearings held. Hearings printed: S.Hrg. 118-217.'
  origin_chamber: Senate
  url: https://www.congress.gov/bill/118th-congress/senate-bill/1545
  summary: 'Veterans Health Care Freedom Act


    This bill requires the Center for Innovation for Care and Payment within the Department
    of Veterans Affairs (VA) to implement a three-year pilot program to improve the ability
    of veterans who are enrolled in the VA health care system to access hospital care, medical
    services, and extended care services through the covered care system by providing such
    veterans with the ability to choose health care providers. Under the bill, the covered
    care system includes VA medical facilities, health care providers participating in the
    Veterans Community Care Program (VCCP), and eligible entities or providers that have entered
    into a Veterans Care Agreement.


    A veteran participating in the program may elect to receive care at any provider in the
    covered care system.


    The pilot program removes certain requirements (e.g., location of the veteran) to access
    care at VA and non-VA facilities. After four years, the bill permanently phases out the
    requirements for accessing care under the VCCP and Veterans Care Agreements and requires
    the VA to provide such care under the same conditions of the pilot program. Additionally,
    after four years, veterans may receive care at a VA medical facility regardless of whether
    the facility is in the same Veterans Integrated Service Network as the veteran.'
  summary_version: Introduced in Senate
  summary_date: '2023-05-10'
  summary_truncated: false
