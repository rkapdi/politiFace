  title: Essential Caregivers Act of 2026
  action_date: '2026-07-15'
  action: 'Ordered to be Reported in the Nature of a Substitute by the Yeas and Nays: 38 -
    0.'
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/9641
  summary: 'Essential Caregivers Act of 2026


    This bill requires certain nursing and long-term care facilities to ensure residents have
    access to their designated essential caregivers during periods of restricted visitation.


    Specifically, the bill requires Medicare skilled nursing facilities, long-term care hospitals,
    and inpatient rehabilitation facilities, as well as Medicaid nursing facilities and intermediate
    care facilities for individuals with intellectual disabilities, to allow residents to
    designate two essential caregivers and to allow these caregivers in-person access to residents
    even when visitation is otherwise restricted.


    Facilities may limit access of essential caregivers only in accordance with guidance from
    the Centers for Medicare & Medicaid Services, as specified. Essential caregivers must
    agree to follow all safety protocols established by the facility, which may be no more
    restrictive than the protocols for staff.'
