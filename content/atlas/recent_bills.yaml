  title: Resources and Ecosystems Sustainability, Tourist Opportunities, and Revived Economies
    of the Gulf Coast States Act of 2011
  action_date: '2011-06-28'
  action: 'Committee on Environment and Public Works Subcommittee on Water and Wildlife. Hearings
    held. With printed Hearing: S.Hrg. 112-951.'
  origin_chamber: Senate
  url: https://www.congress.gov/bill/112th-congress/senate-bill/861
  summary: 'Resources and Ecosystems Sustainability, Tourist Opportunities, and Revived Economies
    of the Gulf Coast States Act of 2011 - Establishes in the Treasury the Gulf Coast Restoration
    Trust Fund to be available for expenditure for programs and projects to restore, protect,
    and make sustainable use of the natural resources, ecosystems, fisheries, marine habitats,
    coastal wetlands, and the economy of the Gulf Coast states of Alabama, Florida, Louisiana,
    Mississippi, and Texas.


    Requires the Secretary to deposit in the Fund 80% of all administrative, civil, and criminal
    penalties paid after this Act''s enactment in connection with the explosion on, and sinking
    of, the mobile offshore drilling unit Deepwater Horizon pursuant to a court order, negotiated
    settlement, or other instrument in accordance with the Federal Water Pollution Control
    Act (commonly known as the Clean Water Act).


    Amends the Clean Water Act to require 35% of amounts made available from the Fund in any
    fiscal year to be disbursed to the Gulf Coast states in equal shares. Authorizes such
    amounts to be used for: (1) coastal protection projects; (2) mitigation of damage to,
    and restoration of, fish, wildlife, or natural resources; (3) implementation of a federally
    approved marine, coastal, or comprehensive conservation management plan, including fisheries
    monitoring; and (4) programs to promote tourism and the consumption of Gulf Coast seafood.
    Authorizes a governor of a Gulf Coast state, in awarding contracts for such a project
    or program, to give a preference to individuals and companies that reside in, are headquartered
    in, or are principally engaged in business in, a Gulf Coast state.'
  summary_version: Introduced in Senate
  summary_date: '2011-04-14'
  summary_truncated: true
- bill: S 662
  congress: 112
  title: Natural Resources Restoration Act of 2011
  action_date: '2011-06-28'
  action: 'Committee on Environment and Public Works Subcommittee on Water and Wildlife. Hearings
    held. With printed Hearing: S.Hrg. 112-951.'
  origin_chamber: Senate
  url: https://www.congress.gov/bill/112th-congress/senate-bill/662
  summary: 'Natural Resources Restoration Act of 2011 - Amends the Oil Pollution Act of 1990
    to require the Administrator of the Environmental Protection Agency (EPA) to enter into
    an arrangement with the National Academies to convene a panel of scientists to evaluate
    and report on the natural resource damages from the blowout and explosion of the mobile
    offshore drilling unit Deepwater Horizon on April 20, 2010, the resulting hydrocarbon
    releases into the environment, and the various response actions that injured natural resources
    in the Gulf of Mexico and in state water and land bordering the Gulf of Mexico (Deepwater
    Horizon Oil Spill).


    Requires the panel to report on the costs for federal and state trustees designated with
    respect to natural resource damages from the spill of: (1) restoring such injured natural
    resources; and (2) compensating such trustees for the loss of natural resource services
    from April 20, 2010, to the date the natural resources are fully restored. Requires trustees,
    in assessing such damages, to include a special assessment in an amount equal to 30% of
    the cost of restoring such resources and services or an amount mutually agreed to by the
    responsible parties and the trustees. Requires special assessments to be: (1) paid by
    the responsible parties; (2) used by trustees to conduct projects to restore natural resources
    injured by such spill; and (3) credited toward any other natural resource damages assessed
    against the responsible parties for such spill.


    Requires the Administrator to promulgate regulations establishing a program under which
    responsible parties can purchase credits for the cost of such projects carried out by
    trustees.'
