- bill: HR 8658
  congress: 119
  title: Indian Health Service Emergency Claims Parity Act
  action_date: '2026-08-27'
  action: Placed on the Union Calendar, Calendar No. 679.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/8658
  summary: 'Indian Health Service Emergency Claims Parity Act


    This bill extends from 72 hours to not less than 15 days the time period to notify the
    Purchased/Referred Care (PRC) program of emergency medical care received from a non-Indian
    Health Service (IHS) medical provider or at a non-IHS medical facility. This bill does
    not apply to individuals who are elderly or disabled, who continue to have a 30-day notification
    requirement for emergency services.


    The IHS provides medical and dental services directly to American Indian and Alaska Native
    patients whenever possible. The PRC program pays for medical or dental care that is provided
    away from an IHS or tribal health care facility. The PRC program must be notified of requests
    for authorization of payment for health care services from a non-IHS provider.


    Currently in emergency cases, the patient, an individual on behalf of the patient, or
    the medical care provider must, within 72 hours after the beginning of treatment for the
    condition or after admission to a health care facility, notify a PRC authorizing official
    of the need for the emergency medical care. This bill instead allows the patient, other
    individual, or provider to notify PRC not less than 15 days of the treatment or admission.'
  summary_version: Introduced in House
  summary_date: '2026-05-04'
  summary_truncated: false
