- bill: HR 5349
  congress: 119
  title: TAS Act
  action_date: '2026-09-30'
  action: Passed Senate with an amendment and an amendment to the Title by Unanimous Consent.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/5349
  summary: 'Tax Court Improvement Act


    This bill expands the authority of the U.S. Tax Court to issue subpoenas, authorizes the
    Tax Court to extend certain petition deadlines, and makes other changes related to Tax
    Court procedures.


    The bill authorizes the Tax Court to issue subpoenas compelling the production of documents
    and other items from a litigant or witness for evidentiary or discovery purposes (whether
    or not it is in connection with a scheduled hearing). (Under current law, the Tax Court
    may issue subpoenas only to compel the attendance and testimony of witnesses and the production
    of evidence at a scheduled hearing or deposition.)


    The bill authorizes the Tax Court to extend (or toll) the deadline to file a Tax Court
    petition contesting an Internal Revenue Service (IRS) deficiency notice if it is equitable
    to do so (known as equitable tolling). Further, under the bill, the dismissal of a petition
    contesting an IRS deficiency notice because the petition is not filed before the deadline
    and equitable tolling is denied is not treated as a decision of the Tax Court. This allows
    a subsequent claim to be filed in U.S. district court if certain conditions are met.


    The bill also


    expands the type of Tax Court proceedings for which special trial judges may be appointed,


    authorizes Tax Court special trial judges to impose fines up to $5,000 and up to 30 days
    in jail for contempt of court, and


    requires Tax Court judges and special trial judges to recuse themselves in certain circumstances.'
  summary_version: Introduced in House
  summary_date: '2025-09-15'
