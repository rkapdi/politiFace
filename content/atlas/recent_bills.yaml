- bill: HR 685
  congress: 119
  title: SAVE Moms and Babies Act of 2025
  action_date: '2025-01-23'
  action: Referred to the House Committee on Energy and Commerce.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/685
  summary: 'Support And Value Expectant Moms and Babies Act of 2025 or the SAVE Moms and Babies
    Act of 2025


    This bill prohibits the Food and Drug Administration (FDA) from approving any new drug
    (either as a brand-name drug or a generic) intended to terminate a pregnancy and imposes
    additional restrictions on such drugs that are already approved.


    Under the bill, an already-approved drug intended to terminate a pregnancy may be dispensed
    to a patient only with a prescription. Furthermore, the FDA may not approve any labeling
    change that would authorize (1) using the drug after 70 days of gestation, or (2) dispensing
    the drug by any means other than in-person administration by the prescribing health care
    practitioner.


    The FDA must also impose additional restrictions on such already-approved drugs, including
    by (1) requiring the prescribing health care practitioner to receive a special certification,
    (2) prohibiting the practitioner from also acting as the dispensing pharmacist, and (3)
    requiring the practitioner to have the ability to provide surgical intervention to the
    patient.


    The bill also rescinds any investigational use exemption already granted to such a drug
    if the bill would have prohibited the FDA from granting the exemption. (Currently, the
    FDA may grant an exemption to certain market approval requirements if a drug is intended
    solely for use in safety and effectiveness investigations.)'
  summary_version: Introduced in House
  summary_date: '2025-01-23'
  summary_truncated: false
- bill: HR 251
  congress: 119
  title: Legal Workforce Act
  action_date: '2025-01-09'
  action: Referred to the Committee on the Judiciary, and in addition to the Committees on
    Ways and Means, and Education and Workforce, for a period to be subsequently determined
    by the Speaker, in each case for consideration of such provisions as fall within the jurisdiction
    of the committee concerned.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/251
  summary: 'Legal Workforce Act


    This bill directs the Department of Homeland Security (DHS) to create an electronic employment
    eligibility confirmation system modeled after and to replace the E-Verify system, which
    allows employers and recruiters to verify the immigration status of individuals. The bill
    also mandates the use of such a system, where currently only some employers, such as those
    with federal contracts, are required to use E-Verify.


    The bill specifies documents that can establish an individual''s identity and employment
    authorization. During the period starting when a job offer is made until three business
    days after hiring, the individual must attest to his or her employment authorization,
    and the employer or recruiter must attest that it has examined the individual''s required
    documents.


    Employers shall reverify certain types of employees who were not previously verified using
    E-Verify.


    The Social Security Administration shall notify employees if their Social Security number
    has been used multiple times in an unusual manner. DHS shall establish programs for blocking
    and suspending misused numbers.


    Employers that are required to use the verification system shall not be liable for any
    employment-related action based on a good-faith reliance on the system.


    The bill establishes a phased-in participation deadline for different sizes and categories
    of employers, including agricultural employers.


    The bill increases civil penalties related to hiring individuals without work authorization.
    It also preempts state laws relating to hiring and employment eligibility verification,
    but states may use their authority of business licensing to penalize employers for failing
    to comply with the bill''s provisions.'
  summary_version: Introduced in House
  summary_date: '2025-01-09'
  summary_truncated: false
