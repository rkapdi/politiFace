  url: https://www.congress.gov/bill/119th-congress/house-bill/8141
  summary: 'Fair Credit Reporting Reseller Accuracy Act


    This bill requires a consumer credit data reseller (a consumer reporting agency that does
    not maintain a credit database of its own, but assembles and merges a consumer''s credit
    information from other agencies that it provides to a third party) to follow reasonable
    procedures to ensure the maximum possible accuracy of the credit information it provides.


    A reseller may not be held liable under the Fair Credit Reporting Act for the information
    it provides if the reseller accurately communicates the information obtained from another
    consumer reporting agency.'
