  title: Law Enforcement Support and Counter Transnational Repression Act
  action_date: '2025-04-09'
  action: Ordered to be Reported by Voice Vote.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/2116
  summary: 'Law Enforcement Support and Counter Transnational Repression Act


    This bill requires the Department of Homeland Security (DHS) to take actions to combat
    transnational repression against individuals inside the United States. The term transnational
    repression generally refers to actions of a foreign government or agent to harm, intimidate,
    threaten, harass, or coerce individuals in the United States.


    Specifically, the bill requires DHS to direct the Office of Partnership and Engagement
    to conduct a public service announcement campaign to educate the public and international
    allies on the issue of transnational repression and related terrorism threats.


    The bill also requires DHS to conduct research and development into technologies and techniques
    for enhancing its support to federal, state, local, tribal, and territorial officials
    in combating transnational repression and related terrorism threats.'
