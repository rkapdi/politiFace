  title: Long Island Sound Restoration and Stewardship Act
  action_date: '2017-05-17'
  action: Placed on Senate Legislative Calendar under General Orders. Calendar No. 90.
  origin_chamber: Senate
  url: https://www.congress.gov/bill/115th-congress/senate-bill/675
  summary: '(This measure has not been amended since it was introduced. The summary has been
    expanded because action occurred on the measure.)


    Long Island Sound Restoration and Stewardship Act


    (Sec. 2) This bill amends the Federal Water Pollution Control Act (commonly known as the
    Clean Water Act) to direct the Office of the Management Conference of the Long Island
    Sound Study within the Environmental Protection Agency (EPA) to include in studies on
    strengthening the implementation of the Comprehensive Conservation and Management Plan
    for Long Island Sound: (1) environmental impacts on the sound watershed; and (2) planning
    initiatives that identify areas most suitable for various activities in order to reduce
    conflicts among uses, reduce adverse environmental impacts, facilitate compatible uses,
    or preserve critical ecosystem services.


    The office must: (1) develop and implement strategies to increase education and awareness
    about the ecological health and water quality of the sound; and (2) monitor progress toward
    meeting the goals, actions, and schedules of the plan.


    Grants in support of the plan (other than citizen involvement and education grants) must
    not exceed 60% (currently 50%) of the cost of research, studies, or work.


    The bill establishes a biennial reporting requirement with respect to the office''s implementation
    of the plan. In addition, the President''s annual budget must include information about
    the involvement of each federal department and agency in the protection and restoration
    of the Long Island Sound watershed, including an interagency crosscut budget and a summary
    of proposed modifications to the plan for the following year.


    The EPA must coordinate the actions of all federal departments and agencies that impact
    water quality in the Long Island Sound watershed to improve the water quality and living
    resources of the watershed.


    A federal agency that owns or occupies real property, or carries out activities, within
    the sound watershed must: (1) participate in regional and subwatershed planning, protection,
    and restoration activities; and (2) ensure that the property and activities are consistent
    with the plan to the maximum extent practicable.


    The bill: (1) extends the Long Island Sound Stewardship Advisory Committee through 2023,
    and (2) exempts the committee from requirements of the Federal Advisory Committee Act.'
