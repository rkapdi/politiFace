- bill: HR 9771
  congress: 119
  title: Stopping Foreign Influence in Elections Act of 2026
  action_date: '2026-08-27'
  action: Placed on the Union Calendar, Calendar No. 669.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/9771
  summary: 'Stopping Foreign Influence in Elections Act of 2026


    This bill imposes on certain tax-exempt organizations federal income taxes and penalties,
    including loss of tax-exempt status, for contributing to a political entity within two
    years of receiving a contribution or gift from a foreign national (disqualified political
    committee contribution).


    Under the bill, tax-exempt organizations described in Section 501(c) of the Internal Revenue
    Code (e.g., charities, social welfare organizations, labor organizations, and business
    or civics leagues) that make disqualified political committee contributions are subject
    to federal taxes in the amounts of 100% of the contribution for the first such contribution
    and 200% of the contribution for each subsequent contribution.


    For a third and each subsequent contribution, the bill also revokes the organization’s
    tax-exempt status for two years (from the date the contribution is made).


    A penalty of twice the amount of any disqualified political committee contribution also
    is imposed on certain tax-exempt 501(c) organizations that have (1) gross receipts of
    $200,000 or more for the prior tax year, or (2) assets of $500,000 or more for the prior
    tax year.'
  summary_version: Introduced in House
  summary_date: '2026-07-18'
  summary_truncated: false
- bill: HR 9722
  congress: 119
  title: Fair Treatment of Religious Organizations Act of 2026
  action_date: '2026-08-27'
  action: Placed on the Union Calendar, Calendar No. 680.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/9722
  summary: 'Fair Treatment of Religious Organizations Act of 2026


    This bill provides that an organization’s religious beliefs or practices concerning marriage,
    sexuality, or gender identity may not be treated as inconsistent with public law or policy
    for purposes of determining whether the organization has a charitable purpose and, thus,
    is exempt from federal income tax.


    As background, charitable organizations generally must be organized and operated for one
    or more tax-exempt purposes (e.g., religious, charitable, scientific, or educational)
    to be exempt from federal income tax and receive tax-deductible contributions. The Internal
    Revenue Service’s position, which was upheld by the Supreme Court in Bob Jones University
    v. United States, is that an organization is not organized or operated for a tax-exempt
    purpose if the organization is against public policy or illegal.


    The bill provides that a religious belief or practice concerning marriage, sexuality or
    gender identity may not be treated as being inconsistent with public law or policy for
    purposes of determining if an organization is organized and operated for a tax-exempt
    purpose. Further, under the bill, a belief need not be compelled by or central to a system
    of religion to be a religious belief.'
  summary_version: Introduced in House
  summary_date: '2026-07-16'
  summary_truncated: false
