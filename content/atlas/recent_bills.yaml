- bill: HR 9436
  congress: 119
  title: Northeast Lobsterman Protection Act of 2026
  action_date: '2026-08-27'
  action: Placed on the Union Calendar, Calendar No. 667.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/9436
  summary: 'Northeast Lobsterman Protection Act of 2026


    This bill extends the deadline from 2028 to 2035 for the National Marine Fisheries Service
    to issue new regulations that protect the endangered Atlantic large whale from certain
    lobster and crab fishing gear. Under current law, the new regulations must include requirements
    for the American lobster and Jonah crab fisheries to utilize existing and innovative fishing
    gear technologies as appropriate to reduce the risk of whales becoming entangled in their
    gear.'
  summary_version: Reported to House
  summary_date: '2026-08-27'
  summary_truncated: false
- bill: HR 8658
  congress: 119
  title: Indian Health Service Emergency Claims Parity Act
  action_date: '2026-08-27'
  action: Placed on the Union Calendar, Calendar No. 679.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/8658
  summary: 'Indian Health Service Emergency Claims Parity Act


    This bill extends from 72 hours to not less than 15 days the time period to notify the
    Purchased/Referred Care (PRC) program of emergency medical care received from a non-Indian
    Health Service (IHS) medical provider or at a non-IHS medical facility. This bill does
    not apply to individuals who are elderly or disabled, who continue to have a 30-day notification
    requirement for emergency services.


    The IHS provides medical and dental services directly to American Indian and Alaska Native
    patients whenever possible. The PRC program pays for medical or dental care that is provided
    away from an IHS or tribal health care facility. The PRC program must be notified of requests
    for authorization of payment for health care services from a non-IHS provider.


    Currently in emergency cases, the patient, an individual on behalf of the patient, or
    the medical care provider must, within 72 hours after the beginning of treatment for the
    condition or after admission to a health care facility, notify a PRC authorizing official
    of the need for the emergency medical care. This bill instead allows the patient, other
    individual, or provider to notify PRC not less than 15 days of the treatment or admission.'
  summary_version: Introduced in House
  summary_date: '2026-05-04'
  summary_truncated: false
- bill: HR 8454
  congress: 119
  title: To provide for the transfer of administrative jurisdiction over certain Federal land
    in the State of California, and for other purposes.
  action_date: '2026-08-27'
  action: Placed on the Union Calendar, Calendar No. 678.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/8454
  summary: 'This bill exchanges administrative jurisdiction over specified parcels of federal
    land between Yosemite National Park and Stanislaus National Forest in California.


    By way of background, cattle are grazing on the land currently managed by the National
    Park Service. However, grazing on federal lands primarily occurs on lands managed by the
    Bureau of Land Management or the Forest Service. The transfer would allow the land with
    cattle grazing to be managed by the Forest Service, which has a multiple-use management
    plan that is consistent with grazing.'
  summary_version: Introduced in House
  summary_date: '2026-04-22'
  summary_truncated: false
- bill: HR 7730
  congress: 119
  title: Bankruptcy Threshold Adjustment Act
  action_date: '2026-08-27'
  action: Placed on the Union Calendar, Calendar No. 684.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/7730
  summary: 'Bankruptcy Threshold Adjustment Act of 2026


    This bill restores changes that expired in 2024 applicable to debt limits for Subchapter
    V (small business reorganization) and Chapter 13 (the wage earner''s plan) bankruptcies.


    Specifically, the bill increases the debt limit under Subchapter V from approximately
    $3.4 million to $7.5 million and increases the cumulative debt limit under Chapter 13
    from approximately $2.1 million to $2.75 million.


    The bill also applies both secured and unsecured debt towards the Chapter 13 limit. (Currently,
    separate limits apply to secured and unsecured debt under Chapter 13 bankruptcy.)'
  summary_version: Introduced in House
  summary_date: '2026-02-26'
  summary_truncated: false
- bill: HR 6021
  congress: 119
  title: Archie Cavanaugh Migratory Bird Treaty Clarification Act
  action_date: '2026-08-27'
  action: Placed on the Union Calendar, Calendar No. 675.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/6021
  summary: 'Archie Cavanaugh Migratory Bird Treaty Amendment Act


    This bill states that nothing in the Migratory Bird Treaty Act of 1918 (MBTA) prohibits
    possessing, selling, bartering, purchasing, shipping, or transporting any authentic Alaska
    Native handicraft, clothing, or art on the basis that it contains a nonedible migratory
    bird part, so long as the bird was not taken in a wasteful or illegal manner. (The MBTA
    implements four international treaties that the United States entered into with Canada,
    Mexico, Japan, and Russia. The MBTA prohibits the taking of protected migratory bird species
    without prior authorization.)


    The bill directs the Department of State to work with the Department of the Interior to
    enter into appropriate bilateral procedures with countries that are parties to the treaties
    under the MBTA to clarify the treatment of Alaska Native handicraft containing nonedible
    migratory bird parts from the species of migratory birds listed in those treaties. Further,
    Interior must modify any regulations implementing the MBTA to implement this bill.'
  summary_version: Introduced in House
  summary_date: '2025-11-12'
  summary_truncated: false
- bill: HR 4795
  congress: 119
  title: Protect Economic and Academic Freedom Act of 2026
  action_date: '2026-08-27'
  action: Placed on the Union Calendar, Calendar No. 681.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/4795
  summary: 'Protect Economic and Academic Freedom Act of 2026


    This bill prohibits institutions of higher education (IHEs) that participate in federal
    student aid programs from engaging in boycotts against Israel. Specifically, IHEs may
    not engage in a commercial action intended to limit commercial relations with Israel,
    or with an entity licensed by, regulated by, or organized under the laws of Israel, that
    is not based on a valid business reason.


    Further, IHEs receiving, or applying to receive, Title VI funds (federal funding for foreign
    language and international education programs) must annually certify that (1) students
    and faculty are allowed to participate in academic programs located in Israel in the same
    manner and under the same terms and conditions as programs in other foreign countries,
    and (2) students and faculty at postsecondary institutions located in Israel may participate
    in such IHE’s academic programs in the same manner and under the same terms and conditions
    as students and faculty from other foreign countries.'
  summary_version: Reported to House
  summary_date: '2026-08-27'
  summary_truncated: false
- bill: HR 2555
  congress: 119
  title: Freedom of Association in Higher Education Act of 2026
  action_date: '2026-08-27'
  action: Placed on the Union Calendar, Calendar No. 682.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/2555
  summary: 'Freedom of Association in Higher Education Act of 2025


    This bill establishes freedom of association protections for college students in single-sex
    social organizations.


    Specifically, the bill gives students (or groups of students) enrolled at institutions
    of higher education (IHEs) the right to form or join social organizations, including single-sex
    social organizations.


    Additionally, the bill prohibits IHEs that participate in federal student aid programs
    from


    taking adverse actions against single-sex social organizations or students who are members
    or prospective members of such organizations based solely on the practice of limiting
    membership to only individuals of one sex;


    taking actions that require or coerce members or prospective members of such organizations
    to waive protections provided under the bill, including as a condition of enrolling in
    the IHE; or


    imposing a recruitment restriction on a single-sex social organization that is not imposed
    upon other student organizations, unless the organization and IHE have entered into a
    written agreement allowing the restriction.'
  summary_version: Introduced in House
  summary_date: '2025-04-01'
  summary_truncated: false
