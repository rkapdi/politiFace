  congress: 119
  title: Justice for ALS Veterans Act of 2025
  action_date: '2026-04-29'
  action: Committee on Veterans' Affairs. Hearings held.
  origin_chamber: Senate
  url: https://www.congress.gov/bill/119th-congress/senate-bill/749
  summary: 'Justice for ALS Veterans Act of 2025


    This bill extends increased dependency and indemnity compensation to the surviving spouse
    of a veteran whom the Department of Veterans Affairs has determined died from amyotrophic
    lateral sclerosis (ALS or Lou Gehrig''s disease) regardless of how long the veteran had
    such disease prior to death. Under current law, such compensation is paid for a service-connected
    disability that was rated totally disabling for a continuous period of at least eight
    years immediately preceding death.


    Under the bill, such extension of increased compensation applies retroactively to veterans
    who died from ALS on or after October 1, 2022.'
  summary_version: Introduced in Senate
  summary_date: '2025-02-26'
