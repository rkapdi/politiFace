- bill: HR 9331
  congress: 119
  title: STOP Payments Fraud Act of 2026
  action_date: '2026-09-01'
  action: Placed on the Union Calendar, Calendar No. 692.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/9331
  summary: 'Strengthening Transaction Oversight and Preventing Payments Fraud Act of 2026
    or the STOP Payments Fraud Act of 2026


    This bill establishes additional grounds for banks to pause the processing of deposited
    checks and wire transfers. Under current law, banks are generally required to make deposited
    funds available in one to two business days, depending on the type of deposit and with
    limited exceptions.


    Under the bill, receiving banks are allowed to delay the processing of checks or wire
    transfers that they reasonably suspect are fraudulent. The bill allows for an initial
    hold that is not to exceed 10 days and an extended hold that is not to exceed 45 days.
    If an account is overdrawn due to a hold on a wire transfer and the depositor did not
    receive written notice, no overdraft fees may be applied.


    The bill allows the Federal Reserve Board and the Consumer Financial Protection Bureau
    (CFPB) to determine when to apply safeguards to accounts determined to be at greater risk
    of fraud. Such safeguards must not apply for more than 60 days for each occurrence.


    These changes take effect 60 days after the issuance of implementing rules, which must
    be issued within one year of the bill''s enactment.


    The bill also requires (1) the board and CFPB to determine whether to remove Treasury
    checks and cashier’s checks from expedited classification due to material losses from
    fraud, and (2) the Government Accountability Office to report on issues relating to the
    availability of funds and fraud protection.'
  summary_version: Reported to House
  summary_date: '2026-09-01'
  summary_truncated: false
- bill: HR 5402
