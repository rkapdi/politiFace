  summary: Small Business Liability Relief and Brownfields Revitalization Act - Small Business
    Liability Protection Act - Amends the Comprehensive Environmental Response, Compensation,
    and Liability Act of 1980 (CERCLA) to provide (with exceptions) that persons shall be
    liable for response costs at a National Priorities List (NPL) facility as non-owners or
    operators only if the total of material containing a hazardous substance that the business
    arranged for disposal, transport, or treatment of, or accepted for transport, was greater
    than specified amounts.Exempts a person from liability for response costs (with exceptions)
    at a NPL facility for municipal solid waste (MSW) as a non-owner or operator if the person
    is an owner, operator, or lessee of residential property from which all of the person's
    MSW was generated, or a certain small business or small charitable tax-exempt organization
    that generated all its MSW, with respect to the facility concerned.Makes nongovernmental
    entities that commence a contribution action liable to the defendant for all reasonable
    legal costs if the defendant is not liable based on the above-described exemptions.Revises
    conditions for de minimis settlements.Brownfields Revitalization and Environmental Restoration
    Act of 2001 - Provides grants for inventorying, characterizing, assessing, remediating,
    and conducting planning related to brownfield sites. Defines a "brownfield site," with
    exceptions, as real property, the expansion, redevelopment, or reuse of which is complicated
    by the presence or potential presence of a hazardous substance or pollutant. Includes
    certain petroleum- or controlled substance-contaminated sites and mine-scarred land.Exempts
    from liability under CERCLA certain owners of real property contiguous to property on
    which there has been a hazardous substance release or threatened release that is not owned
    by such persons.Absolves from liability for response actions bona fide prospective purchasers
    to the extent liability at a facility for a release or threat thereof is based solely
    on ownership or operation of a facility.
