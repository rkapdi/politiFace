- bill: HR 5063
  congress: 119
  title: Safe Beaches, Safe Swimmers Act
  action_date: '2026-08-27'
  action: Placed on the Union Calendar, Calendar No. 673.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/5063
  summary: 'Safe Beaches, Safe Swimmers Act


    This bill establishes requirements to ensure an adequate staff of lifeguards at swimming
    areas and swimming beaches managed by the National Park Service, the U.S. Fish and Wildlife
    Service, the Bureau of Land Management, or the Bureau of Reclamation that are typically
    monitored by federally employed lifeguards during normal seasonal operating hours.


    If the Department of the Interior determines there is a staffing shortage of lifeguards
    that will leave a swimming area or beach unmonitored by federally employed lifeguards
    during normal seasonal operating hours, Interior may enter into an agreement with local
    government agencies to provide lifeguards. Interior must ensure that a local government
    agency providing lifeguard services is reimbursed for all reasonable costs it incurred
    in carrying out the agreement.


    The bill does not apply to short-term staffing shortages caused by temporary absences,
    such as an employee taking annual or sick leave.'
  summary_version: Reported to House
  summary_date: '2026-08-27'
  summary_truncated: false
- bill: HR 2555
  congress: 119
  title: Freedom of Association in Higher Education Act of 2026
  action_date: '2026-08-27'
  action: Placed on the Union Calendar, Calendar No. 682.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/2555
  summary: 'Freedom of Association in Higher Education Act of 2025


    This bill establishes freedom of association protections for college students in single-sex
    social organizations.


    Specifically, the bill gives students (or groups of students) enrolled at institutions
    of higher education (IHEs) the right to form or join social organizations, including single-sex
    social organizations.


    Additionally, the bill prohibits IHEs that participate in federal student aid programs
    from


    taking adverse actions against single-sex social organizations or students who are members
    or prospective members of such organizations based solely on the practice of limiting
    membership to only individuals of one sex;


    taking actions that require or coerce members or prospective members of such organizations
    to waive protections provided under the bill, including as a condition of enrolling in
    the IHE; or


    imposing a recruitment restriction on a single-sex social organization that is not imposed
    upon other student organizations, unless the organization and IHE have entered into a
    written agreement allowing the restriction.'
  summary_version: Introduced in House
  summary_date: '2025-04-01'
  summary_truncated: false
- bill: HR 8476
  congress: 119
  title: No Antisemitism in Education Act of 2026
  action_date: '2026-08-20'
  action: Placed on the Union Calendar, Calendar No. 660.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/8476
  summary: 'No Antisemitism in Education Act of 2026


    This bill requires local educational agencies (LEAs) and institutions of higher education
    (IHEs), as a condition of receiving federal funds, to treat discrimination that is motivated
    by antisemitism as vigorously as the LEA or IHE treats all other forms of discrimination
    prohibited by Title VI of the Civil Rights Act of 1964. (Title VI of the Civil Rights
    Act of 1964 prohibits discrimination based on race, color, or national origin in federally
    funded programs or activities.)


    The bill requires federal agencies, LEAs, and IHEs to consider the definition of antisemitism
    contained in a December 11, 2019, executive order when reviewing or investigating whether
    a discriminatory act or omission was motivated by discriminatory antisemitic intent. The
    executive order incorporates the International Holocaust Remembrance Alliance''s (IHRA''s)
    working definition of antisemitism. According to the IHRA''s working definition, antisemitism
    is a certain perception of Jews, which may be expressed as hatred toward Jews.'
  summary_version: Reported to House
  summary_date: '2026-08-20'
  summary_truncated: false
