- bill: HR 1464
  congress: 119
  title: MODERN WIC Act of 2025
  action_date: '2025-02-21'
  action: Referred to the House Committee on Education and Workforce.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/1464
  summary: 'More Options to Develop and Enhance Remote Nutrition in WIC Act of 2025 or the
    MODERN WIC Act of 2025


    This bill permanently allows individuals to remotely certify their eligibility for, and
    receive benefits through, the Special Supplemental Nutrition Program for Women, Infants,
    and Children (WIC).


    Specifically, the bill requires that a state agency allow an individual seeking a WIC
    certification, recertification, or a nutritional risk evaluation to do so by phone or
    through video teleconference, in addition to the in-person option.


    A state agency has 90 days to collect data for a nutritional risk evaluation for a remotely
    certified individual. Further, a state agency may consider an applicant who meets the
    income eligibility standards to be temporarily eligible on an interim basis to participate
    in the program and may certify the individual for immediate participation without waiting
    for a nutritional risk evaluation.


    The bill also allows states to provide benefits on WIC electronic benefit transfer cards
    through mail or remote issuance instead of requiring participants to pick up or reload
    benefits in person at a WIC office.


    Further, the Department of Agriculture must report to Congress about the use of remote
    technologies and other digital tools in the WIC program.


    Currently, individuals are generally required to be physically present to certify their
    WIC eligibility and receive benefits, with exceptions. The Food and Nutrition Service
    has temporarily waived these requirements and allowed remote certification and benefits
    using authorities that were provided by laws that were enacted to address COVID-19.'
  summary_version: Introduced in House
  summary_date: '2025-02-21'
  summary_truncated: false
- bill: HR 1394
