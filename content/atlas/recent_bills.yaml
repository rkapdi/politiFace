- bill: HR 1810
  congress: 119
  title: Safe Schools Improvement Act
  action_date: '2025-03-03'
  action: Referred to the House Committee on Education and Workforce.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/1810
  summary: 'Safe Schools Improvement Act


    This bill requires states to direct their local educational agencies (LEAs) to establish
    policies that prevent and prohibit bullying and harassment of elementary and secondary
    school students. In particular, these policies must prohibit bullying and harassment based
    on race, color, national origin, disability, religion, or sex. Sex includes sexual orientation,
    gender identity, and sex characteristics (including intersex traits).


    Further, LEAs must provide (1) students, parents, and educational professionals with annual
    notice of the conduct prohibited in their disciplinary policies; (2) students and parents
    with grievance procedures that target such conduct; and (3) the public with annual data
    on the incidence and frequency of that conduct at the school and LEA level.


    The Department of Education must conduct and report on an independent biennial evaluation
    of programs and policies to combat bullying and harassment in elementary and secondary
    schools. The National Center for Education Statistics must collect state data to determine
    the incidence and frequency of the conduct prohibited by LEA disciplinary policies.'
  summary_version: Introduced in House
  summary_date: '2025-03-03'
  summary_truncated: false
- bill: HR 1589
  congress: 119
  title: American Dream and Promise Act of 2025
  action_date: '2025-02-27'
  action: Sponsor introductory remarks on measure. (CR H884)
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/1589
  summary: 'American Dream and Promise Act of 2025


    This bill provides certain non-U.S. nationals (aliens under federal law) with a path to
    receive permanent resident status and contains other immigration-related provisions.


    The Department of Homeland Security (DHS) or the Department of Justice (DOJ) shall provide
    conditional permanent resident status for 10 years to a qualifying individual who entered
    the United States as a minor and (1) is deportable or inadmissible, (2) has deferred enforced
    departure (DED) status or temporary protected status (TPS), or (3) is the child of certain
    classes of nonimmigrants. The bill imposes various qualifying requirements, such as the
    individual being continuously physically present in the United States since January 1,
    2021, passing a background check, and being enrolled in or having completed certain educational
    programs.


    DHS shall remove the conditions placed on permanent resident status granted under this
    bill if the individual applies and meets certain requirements, such as completing certain
    programs at an educational institution, serving in the military, or being employed.


    Furthermore, DHS or DOJ shall provide lawful permanent resident status to certain individuals
    who had TPS, were eligible for TPS, or were eligible for DED status on certain dates.
    Such individuals must meet certain requirements and apply for such status within three
    years of this bill''s enactment.


    This bill also repeals a restriction that bars a state from providing higher education
    benefits to undocumented individuals unless those benefits are available to all U.S. nationals
    without regard to residency in the state.'
  summary_version: Introduced in House
  summary_date: '2025-02-26'
  summary_truncated: false
- bill: HR 1615
  congress: 119
  title: Strengthening Exports Against China Act
  action_date: '2025-02-26'
  action: Referred to the House Committee on Financial Services.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/1615
  summary: 'Strengthening Exports Against China Act


    This bill allows the Export-Import Bank of the United States (EXIM) to exclude financing
    provided to certain U.S. exporters from its default rate cap calculations.


    EXIM, the official export credit agency of the United States, provides financing for U.S.
    exports of goods and services. EXIM monitors credit and other transaction risks, reserves
    against losses, and submits quarterly reports to Congress on its default rate. If its
    default rate reaches 2%, EXIM faces an immediate lending cap freeze.


    This bill exempts certain transactions from EXIM''s default rate calculation, thereby
    allowing EXIM to provide financing to these U.S. exporters without the risk of reaching
    the default rate cap.


    Specifically, the bill allows EXIM to exclude from the default rate cap any financing
    provided to U.S. exporters under the China and Transformational Exports Program. (This
    program allows EXIM to extend loans, guarantees, and insurance to advance the comparative
    leadership of the United States with respect to China in specified export areas, such
    as artificial intelligence, biotechnology, and wireless communications equipment.)


    Additionally, the bill allows EXIM to exclude from the default rate cap any financing
    provided to U.S. exporters that are competing with products or services provided by (1)
    a foreign entity included on the Entity List maintained by the Department of Commerce''s
    Bureau of Industry and Security (e.g., entities involved in activities contrary to U.S.
    national security or foreign policy interests), or (2) a foreign individual or entity
    sanctioned by the Department of the Treasury''s Office of Foreign Assets Control.'
  summary_version: Introduced in House
  summary_date: '2025-02-26'
  summary_truncated: false
- bill: HR 1532
  congress: 119
  title: Scientific EXPERT Act of 2025
  action_date: '2025-02-24'
  action: Referred to the House Committee on Energy and Commerce.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/1532
  summary: 'Scientific External Process for Educated Review of Therapeutics Act of 2025 or
    the Scientific EXPERT Act of 2025


    This bill requires the Food and Drug Administration (FDA) to facilitate and participate
    in externally led, science-focused drug development meetings to discuss the development
    of treatments for rare diseases and conditions.


    The FDA must enter into an arrangement with the Reagan-Udall Foundation for the FDA under
    which the foundation agrees to convene such meetings. Meetings must be held at least four
    times a year, and each meeting must focus on a different rare disease or condition.


    The foundation must establish a permanent steering committee to review and recommend topics
    for each meeting. In evaluating potential topics, the committee must consider unmet therapeutic
    needs, patient population sizes for different diseases and conditions, and whether a disease
    or condition would benefit from clarity and alignment on drug development questions, among
    other factors.


    In planning each meeting, the foundation must develop a list of medical experts, drug
    sponsors, scientific organizations, patient organizations, and other entities to be invited
    to participate. Representatives of the FDA’s review divisions must attend each meeting.


    After each meeting, the foundation must make available a summary of the meeting noting
    areas of consensus, areas where additional clarification or information is needed, and
    next steps agreed upon with the FDA.


    The bill also requires the FDA to indicate whether it incorporated any input from these
    meetings when approving a new drug or biologic.'
  summary_version: Introduced in House
  summary_date: '2025-02-24'
  summary_truncated: false
