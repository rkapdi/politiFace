- bill: HR 3281
  congress: 119
  title: To prohibit the reduction, elimination, or suspension of funding for land-grant colleges
    and universities.
  action_date: '2025-05-08'
  action: Referred to the Committee on Agriculture, and in addition to the Committee on Education
    and Workforce, for a period to be subsequently determined by the Speaker, in each case
    for consideration of such provisions as fall within the jurisdiction of the committee
    concerned.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/3281
  summary: 'This bill prohibits the Department of Agriculture or any federal official from
    taking any action to reduce, eliminate, or suspend funding for land-grant colleges and
    universities unless such action is specifically authorized by Congress.


    Land-grant colleges and universities are designated to receive benefits of the Morrill
    Acts of 1862 and 1890. These acts promoted establishment of institutions of higher learning
    focused on the agricultural and mechanical arts, without excluding other scientific and
    classical studies. Land-grant institutions now address many academic fields in addition
    to those of their foundational colleges of agriculture. There is at least one land-grant
    institution in each U.S. state, the District of Columbia, and the insular areas. Land-grant
    institutions currently receive federal funding through the annual appropriations process.'
  summary_version: Introduced in House
