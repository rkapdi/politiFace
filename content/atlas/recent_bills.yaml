- bill: HR 5305
  congress: 119
  title: Congressional MRA Act
  action_date: '2025-09-11'
  action: Referred to the House Committee on House Administration.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/5305
  summary: 'Congressional Money Returned to America Act or the Congressional MRA Act


    This bill requires funds that were provided to House offices for the Members'' Representational
    Allowance (MRA) and remain in the MRA account after all payments for the year are made
    to be deposited in the Treasury and used for deficit or debt reduction.


    The MRA is an allowance that Members of the House of Representatives receive each year
    to operate their offices. It must be used to support official and representational duties
    and may not be used for personal or campaign purposes.


    Annual appropriations acts that fund the legislative branch have generally included a
    provision that requires unused amounts remaining in the MRA to be used for deficit reduction
    or to reduce the federal debt. This bill makes this requirement permanent.'
  summary_version: Introduced in House
  summary_date: '2025-09-11'
  summary_truncated: false
