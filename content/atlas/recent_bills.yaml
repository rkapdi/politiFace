- bill: HR 7574
  congress: 119
  title: ELO Realignment and Strategic Engagement Reform Act of 2026
  action_date: '2026-07-14'
  action: Received in the Senate and Read twice and referred to the Committee on Homeland
    Security and Governmental Affairs.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/7574
  summary: 'ELO Realignment and Strategic Engagement Reform Act of 2026


    This bill requires the Department of Homeland Security (DHS) to develop a comprehensive
    plan to reorganize its Engagement, Liaison, and Outreach (ELO) Office and submit such
    plan to Congress. The bill also limits certain DHS actions until DHS submits the plan
    to Congress and certifies that it is being implemented.


    ELO is part of DHS''s Office of Intelligence and Analysis (I&A). ELO manages strategic
    relationships with I&A’s international stakeholders and federal, state, local, tribal,
    territorial, and private sector partners, including by facilitating intelligence and information
    sharing.


    Under the bill, the plan must


    identify redundant or non-essential positions, programs, or functions within ELO;


    specify how reorganization of ELO will address such redundant or non-essential positions,
    programs, or functions;


    realign essential functions and personnel of ELO within the Partner Engagement directorate
    of I&A; and


    improve the management and coordination of strategic relationships with priority law enforcement
    agencies.


    Until DHS submits this plan to Congress and certifies that it is being implemented, DHS
    may not (1) expand the staffing, budget, or programmatic scope of ELO; or (2) establish
    new offices duplicating the mission of ELO or the Partner Engagement directorate without
    congressional authorization.'
  summary_version: Introduced in House
  summary_date: '2026-02-13'
  summary_truncated: false
