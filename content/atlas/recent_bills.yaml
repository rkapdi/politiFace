  title: Protection of Women and Girls in Sports Act of 2021
  action_date: '2021-02-04'
  action: Read twice and referred to the Committee on Health, Education, Labor, and Pensions.
  origin_chamber: Senate
  url: https://www.congress.gov/bill/117th-congress/senate-bill/251
  summary: 'Protection of Women and Girls in Sports Act of 2021


    This bill makes it a violation of federal law for a recipient of federal funds who operates,
    sponsors, or facilitates athletic programs or activities to permit a person whose sex
    is male to participate in an athletic program or activity that is designated for women
    or girls.


    The bill specifies that sex shall be recognized based solely on a person''s reproductive
    biology and genetics at birth.'
  summary_version: Introduced in Senate
