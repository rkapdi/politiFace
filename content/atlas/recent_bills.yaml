- bill: HR 1877
  congress: 119
  title: Protecting Americans’ Social Security Data Act
  action_date: '2025-03-05'
  action: Referred to the House Committee on Ways and Means.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/1877
  summary: 'Protecting Americans’ Social Security Data Act


    This bill prohibits political appointees and special government employees from accessing
    Social Security data systems that contain personally identifiable information about Social
    Security beneficiaries.


    Specifically, political appointees and special government employees may not access systems
    maintained by the Social Security Administration (SSA) that issue or record Social Security
    account numbers, that are used to determine eligibility for or to pay Social Security
    benefits, or that otherwise contain personally identifiable information about individuals
    receiving or applying for benefits.


    The bill also establishes a civil right of action for an individual whose information
    was negligently accessed or disclosed in violation of these provisions. The individual
    may bring suit against the United States if the violator was a U.S. employee or officer,
    or against the violator if they were not a U.S. employee or officer. Such a claim must
    be brought within two years of the affected individual’s discovery of the violation. Upon
    a finding of liability, defendants are liable for specified monetary damages.


    If an individual is criminally charged or subject to proposed disciplinary or adverse
    action by a federal or state agency for having accessed or disclosed information in violation
    of these provisions, SSA must notify the individual whose information was accessed or
    disclosed of the violation as soon as practicable.


    Finally, the bill requires the SSA Office of the Inspector General to investigate and
    report to Congress on any unauthorized access to or disclosure of information in a beneficiary
    data system.'
  summary_version: Introduced in House
  summary_date: '2025-03-05'
  summary_truncated: false
- bill: HR 1876
  congress: 119
  title: Keeping Our Field Offices Open Act
  action_date: '2025-03-05'
  action: Referred to the House Committee on Ways and Means.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/1876
  summary: 'Keeping Our Field Offices Open Act


    This bill temporarily prohibits the closure or consolidation of, or other limitation of
    access to, Social Security Administration (SSA) offices and stations, and sets forth procedural
    requirements for future changes to office and station availability.


    Specifically, the bill prohibits through at least January 21, 2029, the closure or consolidation
    of, or other limitation of access to, SSA field offices, hearing offices, and resident
    stations. On or after that date, SSA must submit a report to Congress justifying its process
    for selecting stations and offices to be closed, consolidated, or limited. The prohibition
    is lifted 180 days after the submission of such report.


    The bill also sets forth requirements that must be met before SSA may close, consolidate,
    or otherwise limit access to an office or station after the initial moratorium expires.
    At least 120 days before such a change takes effect, SSA must provide public notice to
    individuals in affected areas, including information on how lost access to SSA services
    will be replaced. SSA must also conduct at least two public hearings on each such change.


    Further, SSA must provide a hearing to any individual who makes a timely showing that
    a determination to close, consolidate, or limit an office or station is arbitrary, capricious,
    or deficient in another specified manner.


    Finally, a closure, consolidation, or limitation may not result in the total number of
    SSA offices or stations falling below the number of such offices or stations in operation
    on January 20, 2025.'
  summary_version: Introduced in House
  summary_date: '2025-03-05'
