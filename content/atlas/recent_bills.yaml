- bill: S 1377
  congress: 119
  title: Theodore Roosevelt National Park Wild Horses Protection Act
  action_date: '2026-09-10'
  action: Referred to the House Committee on Natural Resources.
  origin_chamber: Senate
  url: https://www.congress.gov/bill/119th-congress/senate-bill/1377
  summary: 'Theodore Roosevelt National Park Wild Horses Protection Act


    This bill directs the Department of the Interior to maintain a genetically diverse herd
    of horses, with a population of no fewer than 150 horses, in the South Unit of Theodore
    Roosevelt National Park in North Dakota. Interior must develop a management plan to protect
    the horses while ensuring that the natural resources within the park are not adversely
    impacted.


    The bill also prohibits Interior from removing horses from the park unless the removal
    is (1) to maintain a genetically diverse herd of horses, (2) in the case of an emergency,
    or (3) to protect public health and safety.


    Interior must annually monitor, assess, and publish findings regarding the population,
    structure, and health of the horses in the park.'
