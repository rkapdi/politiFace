- bill: HR 850
  congress: 119
  title: SHUSH Act
  action_date: '2025-01-31'
  action: Referred to the Committee on Ways and Means, and in addition to the Committee on
    the Judiciary, for a period to be subsequently determined by the Speaker, in each case
    for consideration of such provisions as fall within the jurisdiction of the committee
    concerned.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/850
  summary: 'Silencers Help Us Save Hearing Act or the SHUSH Act


    This bill removes silencers from regulation under certain federal statutes governing the
    sale, transfer, and possession of firearms.


    Specifically, it removes silencers from the list of firearms subject to regulation (i.e.,
    registration and licensing requirements) under the National Firearms Act (NFA). Additionally,
    it excludes a muffler or silencer from the list of firearms subject to regulation (e.g.,
    background check requirements) under the Gun Control Act of 1968 (GCA).


    Finally, the bill does the following:


    preempts state or local laws that tax or regulate firearm silencers,


    specifies that a person who lawfully acquires or possesses a silencer under provisions
    of the GCA meets the registration and licensing requirements of the NFA,


    eliminates mandatory minimum prison terms for a crime of violence or drug trafficking
    offense in which a defendant uses or carries a firearm equipped with a silencer or muffler,
    and


    permits active and retired law enforcement officers to carry a concealed silencer.'
  summary_version: Introduced in House
  summary_date: '2025-01-31'
  summary_truncated: false
