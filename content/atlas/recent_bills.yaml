  title: Stop the Sexualization of Children Act
  action_date: '2026-07-02'
  action: Placed on the Union Calendar, Calendar No. 632.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/7661
  summary: 'Stop the Sexualization of Children Act


    This bill prohibits the use of federal elementary and secondary education funds for sexually
    oriented material. Sexually oriented material is material that (1) includes any depiction,
    description, or simulation of sexually explicit conduct; or (2) involves gender dysphoria
    or transgenderism.


    Specifically, the bill prohibits the use of these funds to develop, implement, facilitate,
    host, or promote any program or activity for, or to provide or promote literature or other
    materials to, children under the age of 18 that includes sexually oriented material. This
    includes any program, activity, literature, or material that exposes children to nude
    adults, individuals who are stripping, or lewd or lascivious dancing.


    The bill does not prohibit the use of funds for the teaching of standard science coursework
    (e.g., biology, genetics, human health, and human anatomy), the texts of major world religions,
    classic works of literature or art (as defined by the bill), or security measures designed
    to help students recognize and safely respond to methods and attempts to sexually traffic
    children or groom children for sexual trafficking.'
