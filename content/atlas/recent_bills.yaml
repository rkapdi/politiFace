- bill: HR 9613
  congress: 119
  title: Nuclear Advisory Committee Reform Act
  action_date: '2026-11-10'
  action: Received in the Senate and Read twice and referred to the Committee on Environment
    and Public Works.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/9613
  summary: 'The following analysis is based on draft bill text that was made available by
    the House of Representatives and may differ from the bill text as introduced.


    Nuclear Advisory Committee Reform Act


    This bill modifies requirements governing the Advisory Committee on Reactor Safeguards
    of the Nuclear Regulatory Commission (NRC), including by allowing the committee to decline
    to review certain license applications (e.g., applications for commercial nuclear power
    plants) issued by the NRC.


    Specifically, the committee may decline to review license applications regarding certain
    commercial, industrial (e.g., utilization and production facilities), medical (e.g., therapy,
    such as radiation treatment), or research and development purposes if it determines that
    such applications do not (1) contain issues that are unique, novel, or noteworthy; or
    (2) raise issues that warrant review by the committee.


    The bill also directs the committee to focus on issues that (1) directly relate to reactor
    design, (2) are safety significant, (3) are novel, and (4) have not been previously acted
    on by the committee.


    In addition, it directs the NRC to maintain or modify policies to ensure efficient and
    timely action by the committee.


    Finally, the bill requires the membership of the committee to reflect a diverse background
    of technical expertise relevant to the NRC''s mission.'
  summary_version: Introduced in House
  summary_date: '2026-07-09'
  summary_truncated: false
