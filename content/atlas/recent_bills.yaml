  url: https://www.congress.gov/bill/119th-congress/senate-bill/472
  summary: 'Ski Hill Resources for Economic Development Act


    This bill allows National Forest System (NFS) units to keep the majority of ski area permit
    rental fees that were generated within their boundaries and outlines how revenues from
    those fees may be used. Such fees are collected by the Department of Agriculture (USDA)
    from ski area operators on NFS land.


    Within the NFS unit where the fees were generated, USDA must expend (1) 60%-48% of the
    collected fees for activities such as administration of the ski area permit program, visitor
    information, or reducing the likelihood of wildfire in or adjacent to a recreation site;
    and (2) 20% of the collected fees for activities such as repair of a Forest Service-owned
    facility, habitat restoration, or search and rescue activities.


    The remainder of the collected fees must be expended by USDA at any NFS unit for any of
    the activities specified in this bill.'
