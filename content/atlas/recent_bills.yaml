  summary: 'Guard and Reserve GI Bill Parity Act of 2025


    This bill expands eligibility for Post-9/11 educational assistance for members of the
    reserve components of the Armed Forces and members of the National Guard. Specifically,
    the bill expands the types of activities that count towards Post-9/11 GI Bill eligibility
    to include active duty, inactive-duty training, annual training duty, and full-time National
