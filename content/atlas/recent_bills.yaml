  url: https://www.congress.gov/bill/118th-congress/house-joint-resolution/13
  summary: 'This joint resolution proposes a constitutional amendment authorizing Congress
    and the states to (1) regulate and impose reasonable viewpoint-neutral limitations on
    the raising and spending of money by candidates and others to influence elections; and
    (2) regulate and enact public campaign financing systems, including those designed to
    restrict the influence of private wealth by offsetting the raising and spending of money
    by candidates and others with increased public funding.


    The amendment grants Congress and the states the power to implement and enforce this amendment
    by legislation. They are allowed to distinguish between natural persons and corporations
    or other artificial entities created by law, including by prohibiting such entities from
    spending money to influence elections.'
