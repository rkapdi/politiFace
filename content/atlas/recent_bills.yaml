  title: Loan Forgiveness for Educators Act of 2026
  action_date: '2026-05-19'
  action: Referred to the House Committee on Education and Workforce.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/8896
  summary: 'Loan Forgiveness for Educators Act of 2026


    This bill expands loan forgiveness for educators by revising the Teacher Loan Forgiveness
    Program. The program provides loan forgiveness (up to $17,500) for teachers who are highly
    qualified, teach full-time in a low-income elementary or secondary school or educational
    service agency, and complete five years of consecutive service.


    Specifically, the bill renames the program as the Educator Loan Forgiveness Programs.


    Additionally, the bill expands the program by making additional loan types eligible for
    benefits under the program (e.g., Parent PLUS Loans).


    Further, the bill expands program eligibility to early childhood educators and program
    directors serving in early childhood education programs and school leaders serving in
    public high-need schools.


    The bill requires the Department of Education to


    make monthly student loan payments on behalf of the educator during qualifying service
    (i.e., employment as a full-time qualifying educator in a high-need school or an early
    childhood education program),


    provide complete loan forgiveness after five years of qualifying service (which does not
    have to be consecutive), and


    take steps to notify borrowers about changes to the program.'
