- bill: S 1153
  congress: 113
  title: Invasive Fish and Wildlife Prevention Act
  action_date: '2014-07-16'
  action: 'Committee on Environment and Public Works Subcommittee on Water and Wildlife. Hearings
    held. With printed Hearing: S.Hrg. 113-772.'
  origin_chamber: Senate
  url: https://www.congress.gov/bill/113th-congress/senate-bill/1153
  summary: 'Invasive Fish and Wildlife Prevention Act - Authorizes any person, entity, or
    the Director of the United States Fish and Wildlife Service to propose the regulation
    of nonnative wildlife taxa. Requires the Director to determine whether the proposal should
    be approved within 180 days.


    Requires the Director to promulgate regulations to: (1) specify the criteria for regulating
    a nonnative taxon as an Injurious I taxon or Injurious II taxon that is injurious to humans,
    agriculture, horticulture, forestry, wildlife, or wildlife resources; (2) establish a
    process for assessing and analyzing the risks of taxa that may have been imported into
    or found in interstate commerce; and (3) designate a wildlife taxon that was previously
    designated as injurious by statute or the Secretary of the Interior as an Injurious I
    or Injurious II taxon.


    Requires the Secretary, not later than three years after enactment of this Act, to: (1)
    define the phrase "non-native wildlife taxa novel to the United States"; (2) establish
    a process to ensure that all such taxa are thereafter reviewed by the Director to determine
    whether they should be regulated as Injurious I or Injurious II taxa prior to allowing
    their importation; and (3) seek to avoid, in promulgating such regulation, creating a
    new incentive for animal importers to import novel taxa prior to the effective date of
    such regulation.


    Requires the Director, prior to designating a taxon as an Injurious I or Injurious II
    taxon, to prepare a risk determination.


    Authorizes the Director to immediately and temporarily designate a nonnative wildlife
    taxon as Injurious I if an emergency exists because such unregulated taxon poses an imminent
    threat of harm to individuals in, or wildlife of, the United States or to the U.S. economy
    or environment.


    Requires the Director to: (1) establish an electronic, publicly available database that
    describes all quantities of imports of all live wildlife and the regulatory status of
    such wildlife; (2) monitor and report on the identities and quantities of nonnative wildlife
    taxa being imported; and (3) make more rapid determinations on proposals for regulation
    of importations or shipments of injurious mammals, birds, fish, amphibia, and reptiles
    under the Lacey Act by requiring the Secretary to forego time-consuming optional administrative
    steps that are not essential and by authorizing the Secretary to forego economic impact
    analyses.'
  summary_version: Introduced in Senate
  summary_date: '2013-06-12'
  summary_truncated: true
