  summary: 'Gold Star and Surviving Spouse Career Services Act


    This bill expands eligibility for the Disabled Veterans’ Outreach Program to the spouses
    of certain veterans and members of the Armed Forces. Such program is administered by the
    Department of Labor and generally provides career and employment services to disabled
    veterans.


    The bill expands eligibility for the program to spouses of


    persons who died while members of the Armed Forces;


    persons who died of a service-connected disability;


    members of the Armed Forces serving on active duty who, for more than 90 days, are listed
    as missing in action, captured by a hostile force, or forcibly detained or interned in
    the line of duty by a foreign government power;


    persons who have a total permanent disability resulting from a service-connected disability;
    and


    persons who died while an evaluated total disability was in existence.'
