- bill: HR 2120
  congress: 119
  title: ROCR Value Based Program Act
  action_date: '2025-03-14'
  action: Referred to the Committee on Energy and Commerce, and in addition to the Committee
    on Ways and Means, for a period to be subsequently determined by the Speaker, in each
    case for consideration of such provisions as fall within the jurisdiction of the committee
    concerned.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/2120
  summary: 'Radiation Oncology Case Rate Value Based Program Act of 2025 or the ROCR Value
    Based Program Act


    This bill establishes a specialized payment program under Medicare for providers and suppliers
    of radiation oncology services.


    Specifically, the Centers for Medicare & Medicaid Services (CMS) must establish a program
    under which radiation therapy providers (i.e., hospital outpatient departments) and suppliers
    (i.e., physician group practices and freestanding radiation therapy centers) receive payments
    for each episode of care provided to individuals with specified types of cancer. An episode
    of care means the period beginning on the day radiation therapy planning is furnished
    to the individual and ending (1) for individuals with bone or brain metastases, 30 days
    later; and (2) for individuals with other cancer types, 90 days later.


    Participation in the program is mandatory for providers and suppliers that participate
    in Medicare, unless the provider or supplier is part of a state-based Center for Medicare
    & Medicaid Innovation model or qualifies for a significant hardship exemption. The CMS
    must set payment rates for the program based on national payment rates with specified
    adjustments (e.g., geographic adjustments). Providers and suppliers who provide certain
    transportation services for individuals under their care may receive an additional payment.
    Providers and suppliers must be accredited in accordance with certain standards, subject
    to payment reductions.


    The Government Accountability Office must report on (1) implementation of the program,
    and (2) underserved areas that are in need of more or newer radiation therapy resources.'
  summary_version: Introduced in House
  summary_date: '2025-03-14'
  summary_truncated: false
- bill: HR 1518
  congress: 119
  title: New Era of Preventing End-Stage Kidney Disease Act
  action_date: '2025-02-24'
  action: Referred to the Committee on Energy and Commerce, and in addition to the Committee
    on Ways and Means, for a period to be subsequently determined by the Speaker, in each
    case for consideration of such provisions as fall within the jurisdiction of the committee
    concerned.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/1518
  summary: 'New Era of Preventing End-Stage Kidney Disease Act


    This bill establishes regional centers of excellence, postgraduate fellowships, and training
    for health professionals relating to the diagnosis and treatment of rare kidney disease.
    It also requires the Department of Health and Human Services (HHS) to conduct various
    studies on rare kidney disease.


    Specifically, it authorizes the National Institute of Diabetes and Digestive and Kidney
    Diseases to award funding to public and private nonprofit entities for establishing regional
    centers of excellence that will increase public awareness, conduct research, and develop
    resources for diagnosing and treating rare kidney diseases. A center may receive such
    funding for up to five years, unless extended by the institute.


    The bill also requires health professions schools receiving a grant from the Health Resources
    and Services Administration (HRSA) Centers of Excellence program to award fellowships
    for training on preventing, diagnosing, and treating rare kidney disease in disproportionately
    impacted populations.


    Also, the bill expands the priorities of HRSA’s Primary Care Training and Enhancement
    program to include training for health care workers to care for individuals with kidney
    disease.


    Additionally, HHS must conduct several studies and report to Congress on topics such as
    treating rare kidney disease in disproportionately affected populations, eliminating the
    need for dialysis or kidney transplants, and increasing public awareness of rare kidney
    disease.'
  summary_version: Introduced in House
  summary_date: '2025-02-24'
  summary_truncated: false
