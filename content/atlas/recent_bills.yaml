- bill: S 3010
  congress: 119
  title: 21st Century Dyslexia Act
  action_date: '2026-07-30'
  action: Committee on Health, Education, Labor, and Pensions. Ordered to be reported without
    amendment favorably.
  origin_chamber: Senate
  url: https://www.congress.gov/bill/119th-congress/senate-bill/3010
  summary: '21st Century Dyslexia Act


    This bill addresses the education of children with disabilities, with a particular focus
    on children with dyslexia.


    Currently, dyslexia is listed as one of the disabilities under the definition of specific
    learning disability in the Individuals with Disabilities Education Act (IDEA). This bill
    instead removes dyslexia from the definition of specific learning disability and establishes
    a stand-alone definition for dyslexia within the IDEA.


    Specifically, the bill defines dyslexia for purposes of the IDEA as an unexpected difficulty
    in reading for an individual who has the intelligence to be a much better reader, most
    commonly caused by a difficulty in the phonological processing (the appreciation of the
    individual sounds of spoken language), which affects the ability of an individual to speak,
    read, and spell.


    Additionally, the bill requires a local educational agency or other agency, in determining
    eligibility for or providing an accommodation or service under the IDEA, to provide equal
    access to (1) children from low-income families, (2) children from families with low socioeconomic
    status, and (3) children who are limited English proficient.'
