- bill: HRES 717
  congress: 117
  title: Recognizing the Dominican community's presence and contributions to Washington Heights
    and Inwood.
  action_date: '2021-10-13'
  action: Referred to the Subcommittee on National Parks, Forests, and Public Lands.
  origin_chamber: House
  url: https://www.congress.gov/bill/117th-congress/house-resolution/717
  summary: 'This bill supports the designation of a noncontiguous Dominican cultural heritage
    district under the control of the National Park Service to acknowledge and celebrate the
    contributions of the Dominican community to New York City, New York State, and the nation.


    Recognizes that the cultural legacy and historical contributions of the Dominican community
    enrich, enliven, and permeate the Washington Heights and Inwood neighborhoods.


    Honors the history and contributions of Dominican-American elected officials, artists,
    small business and bodega owners, writers, and trailblazers.


    Supports the efforts to recognize and preserve the history of the Dominican people in
    Washington Heights and Inwood, including through the designation of historic buildings
    and districts.'
  summary_version: Introduced in House
  summary_date: '2021-10-12'
  summary_truncated: false
