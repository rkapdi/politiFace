- bill: S 1381
  congress: 113
  title: Big Cats and Public Safety Protection Act
  action_date: '2014-07-16'
  action: 'Committee on Environment and Public Works Subcommittee on Water and Wildlife. Hearings
    held. With printed Hearing: S.Hrg. 113-772.'
  origin_chamber: Senate
  url: https://www.congress.gov/bill/113th-congress/senate-bill/1381
  summary: 'Big Cats and Public Safety Protection Act - Amends the Lacey Act Amendments of
    1981 to prohibit any person from importing, exporting, transporting, selling, receiving,
    acquiring, purchasing in interstate or foreign commerce, breeding, or possessing any prohibited
    wildlife species (current law prohibits importing, exporting, transporting, selling, receiving,
    acquiring, or purchasing such a species in interstate or foreign commerce). Includes among
    exemptions to such prohibition the breeding transportation, or possession of such species
    by authorized persons.


    Defines "breeding" as facilitating the propagation or reproduction (whether intentionally
    or negligently), or failing to prevent the propagation or reproduction, of a prohibited
    wildlife species or other animal.


    Removes from the list of persons authorized to import, export, transport, sell, receive,
    acquire, purchase, breed, or possess such species a person that is licensed or registered,
    and inspected, by the Animal and Plant Health Inspection Service (APHIS) or any other
    federal agency with respect to such species. Includes in such list:


    an institution accredited by the Association of Zoos and Aquariums (AZA) or certified
    related facilities that coordinate with an AZA Species Survival Plan for breeding of species
    listed as threatened or endangered under the Endangered Species Act of 1973;


    a wildlife sanctuary that cares for such species, is a tax exempt corporation, does not
    commercially trade in or propagate such species, does not allow direct contact between
    the public and animals, and does not allow the transportation and display of such species
    off-site;


    a person that is in possession of animals of such species that were born before the date
    of this Act''s enactment and that are registered with APHIS within 180 days after such
    regulations are promulgated; and


    a traveling circus that regularly travels in interstate commerce to conduct performances
    featuring live prohibited wildlife species and multiple trained human entertainers, that
    does not allow members of the public to be in direct contact with or unsafe proximity
    to a prohibited wildlife species of any age, and that, during the three years preceding
    this Act''s enactment, has not been determined by the Secretary of Agriculture to have
    violated the Animal Welfare Act by reason of jeopardizing the health and well-being of
    a prohibited wildlife species.'
