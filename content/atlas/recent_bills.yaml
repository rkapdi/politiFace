  summary: 'Faster Labor Contracts Act


    This bill establishes mandatory deadlines for parties negotiating an initial collective
    bargaining agreement (CBA) and provides for mediation and arbitration to finalize CBAs.


    Under the bill, CBA negotiations must begin within 10 days after an employer receives
    a written request from a newly recognized or certified bargaining representative. The
    bill provides that parties must make every reasonable effort to conclude and sign a CBA.
    Further, the bill provides that, if the parties have not reached an agreement after 90
    days, either party may request mediation by the Federal Mediation and Conciliation Service
    (FMCS). The bill directs FMCS to use its best efforts to secure an agreement.


    If mediation does not result in an agreement within 30 days (or an additional period agreed
    to by both parties), FMSC must refer the parties to an arbitration panel to render a decision
    settling the dispute. The panel must consider specified factors, including the employer''s
    financial prospects and employees'' cost of living. The resulting CBA is binding on the
    parties for two years. (Parties may agree to amend the terms during the two-year period.)


    The bill specifies that (1) an employer must maintain current wages, hours, terms, and
    conditions of employment during negotiations; and (2) an employer''s duty to collectively
    bargain continues even if a representative has been decertified.


    The Government Accountability Office must report to Congress regarding the average number
    of days between the certification or recognition of a bargaining representative and the
    date the initial CBA was executed.'
  summary_version: Passed House
  summary_date: '2026-06-09'
  summary_truncated: false
- bill: HR 8872
  congress: 119
  title: Preventing Waste, Fraud, and Abuse in TANF Act
  action_date: '2026-06-03'
  action: POSTPONED PROCEEDINGS - Pursuant to clause 1(c) of rule XIX, the Chair announced
    further proceedings on H.R. 8872 is postponed.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/8872
  summary: 'Preventing Waste, Fraud, and Abuse in TANF Act


    This bill limits how and when states may use Temporary Assistance for Needy Families (TANF)
    funds and establishes an eligibility threshold for all TANF-funded assistance and services.


    Currently, each state sets its own eligibility threshold for TANF-funded cash assistance.
    The bill establishes an upper limit on eligibility applicable to all assistance and services
    (including non-cash benefits) funded by TANF family assistance grants. Under this provision,
    only families with income under 200% of the federal poverty guidelines may receive TANF-funded
    assistance and services.


    Further, the bill generally requires states to obligate TANF funds by the end of the fiscal
    year after they are paid and to spend funds by the end of the second fiscal year after
    they are paid. However, states may reserve a specified portion of their TANF funds for
    future use. (There is currently no requirement to use TANF funds within a specified period.)


    The bill also explicitly requires states to use federal TANF funds to supplement, not
    replace, state and local funding for TANF-supported programs. (Current law requires states
    to spend a specified minimum amount on TANF-eligible activities and populations, known
    as the maintenance of effort requirement.)


    States must also take specified steps to track and report on improper payments of federal
    funds (e.g., overpayments, underpayments, payments to ineligible recipients). Within one
    year of enactment, HHS must submit to Congress a plan to reduce or eliminate improper
    payments made by states under the TANF program within 10 years.'
  summary_version: Reported to House
  summary_date: '2026-05-29'
  summary_truncated: false
- bill: HR 3497
  congress: 119
  title: Medal of Sacrifice Act
  action_date: '2026-05-28'
  action: 'Became Public Law No: 119-94.'
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/3497
  summary: 'Medal of Sacrifice Act of 2025


    This act directs the President to issue a medal of sacrifice for eligible law enforcement
    officers and first responders who are killed in the line of duty.


    The act also directs the President to establish a commission on the medal of sacrifice
    and appoint its members. The act sets forth responsibilities of the commission, including
    to advise on the design of the medal and determine how the medal will be presented.


    Under the act, eligible law enforcement officers and first responders include federal,
    state, local, tribal, or territorial law enforcement officers or first responders who
    are not subject to an official act of wrongdoing (e.g., a determination that the officer
    or first responder acted outside the scope of their duties or in a manner that was not
    in accordance with official policies or procedures).


    A law enforcement officer or first responder who is subject to an official act of wrongdoing
    is generally not eligible for the medal of sacrifice. However, in the case of such an
    officer or first responder, the act requires the commission to investigate the circumstances
    surrounding the officer or first responder''s cause of death and issue a final determination
    on their eligibility.'
  summary_version: Public Law
  summary_date: '2026-05-28'
  summary_truncated: false
- bill: HR 8736
  congress: 119
  title: Restoration of Employment Choice for Adults with Disabilities Act
  action_date: '2026-05-21'
  action: 'Ordered to be Reported (Amended) by the Yeas and Nays: 18 - 15.'
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/8736
  summary: 'Restoration of Employment Choice for Adults with Disabilities Act


    This bill relaxes requirements that allow entities with a special wage certificate to
    pay subminimum wages to individuals with disabilities.


    Specifically, the bill eliminates a requirement that an individual with a disability who
    is age 24 or younger receive pre-employment transition services and meet specified vocational
    rehabilitation criteria before beginning subminimum wage work.


    The bill also relaxes career counseling and service referral requirements that apply to
    an individual with a disability who is paid at a subminimum wage. Current law requires
    an entity to ensure that an individual employed at subminimum wage receives periodic career
    counseling, information, and referrals to other services from the designated state agency.
    Under the bill, this requirement is met if the employer makes a documented effort to contact
    the state agency for those resources on behalf of the employee, and the state agency subsequently
    fails to provide the counseling, information, and referrals.'
