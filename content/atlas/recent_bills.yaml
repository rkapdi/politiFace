    protection of water resources.


    (Sec. 3) The bill defines new terms used in this bill, including "body of water," "interstate
    waters," "traditional navigable water," and "wetlands".


    (Sec. 4) The bill nullifies a revision to or guidance on a regulatory definition of the
    term "navigable waters" or "waters of the United States" promulgated or issued pursuant
