  action: Received in the Senate and Read twice and referred to the Committee on Homeland
    Security and Governmental Affairs.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/8874
  summary: 'Homeland Security Capabilities Preservation Reporting Act of 2026


    This bill requires the Federal Emergency Management Agency (FEMA) to submit a report to
    Congress every three years (current law requires only one report) regarding urban areas’
    security capabilities previously supported with funding from the Urban Area Security Initiative
    (UASI) and at risk of being reduced or eliminated without additional federal assistance.
    FEMA’s UASI grants assist designated high-risk urban areas with developing and sustaining
    capabilities to prevent, prepare for, protect against, and respond to acts of terrorism.


    Each report must contain a proposal for FEMA to provide financial assistance for at least
    three consecutive years to urban areas previously receiving UASI funds to allow them to
    transition to other funding sources to preserve their security capabilities.'
  summary_version: Introduced in House
  summary_date: '2026-05-19'
