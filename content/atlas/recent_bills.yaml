- bill: HR 1988
  congress: 119
  title: Pay Federal Workers and Servicemembers Act
  action_date: '2025-03-10'
  action: Referred to the House Committee on Ways and Means.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/1988
  summary: 'Pay Federal Workers and Servicemembers Act


    This bill makes federal civilian and military personnel who are excepted from furlough
    during a government shutdown eligible for unemployment compensation benefits.


    During a government shutdown due to a lapse in appropriations, federal employees who are
    excepted from furlough are required to report for work and perform duties, but their pay
    is delayed until appropriations legislation is enacted. Under guidance issued by the Department
    of Labor, excepted employees who are performing services (but whose payment for that work
    is delayed) are generally ineligible for unemployment compensation benefits based on states''
    definitions of unemployment.


    This bill provides that, for the purpose of determining eligibility for unemployment compensation
    during a government shutdown, excepted employees are deemed to be (1) totally separated
    from federal service, and (2) eligible for unemployment compensation benefits with no
    waiting period for the eligibility to accrue.


    The bill applies to the following federal personnel who are excepted from furlough and
    are not being paid due to a government shutdown: (1) any member of the Armed Forces or
    the Commissioned Corps of the National Oceanic and Atmospheric Administration, and (2)
    any federal civilian employee who is an excepted employee or an employee performing emergency
    work.'
  summary_version: Introduced in House
  summary_date: '2025-03-10'
  summary_truncated: false
