  congress: 119
  title: Lindsey O. Graham Sanctioning Russia Act of 2026
  action_date: '2026-07-16'
  action: Read twice and referred to the Committee on Banking, Housing, and Urban Affairs.
  origin_chamber: Senate
  url: https://www.congress.gov/bill/119th-congress/senate-bill/5025
  summary: 'Lindsey O. Graham Sanctioning Russia Act of 2026


    This bill imposes a variety of sanctions, tariffs, and prohibitions related to Russia.


    For example, under the bill, the President must


    impose visa- and property-blocking sanctions on specified persons (individuals and entities)
    such as the Russian president, certain Russian military commanders, and any foreign person
    that knowingly provides goods or services relating to Russia''s defense industrial base;


    increase the rate of duty on all goods imported into the United States from Russia to
    a rate of up to 500% ad valorem (i.e., relative to the value);


    increase the rate of duty up to 100% ad valorem on all goods imported into the United
    States from a country that was among the five largest importers of Russian-origin crude
    oil or natural gas if such country knowingly makes new purchases of such products after
    enactment of the bill;


    impose property-blocking sanctions on financial institutions organized under Russian law
    and owned wholly or partly by Russia; and


    impose property-blocking sanctions on foreign vessels that knowingly transport certain
    products of Russian origin, including crude oil, uranium, and coal.


    The bill prohibits (1) the export, reexport, or in-country transfer to or in Russia of
    U.S.-produced energy or energy product; (2) U.S. persons from making new investments in
    Russia or purchasing Russian sovereign debt; and (3) trading the securities of Russian
    government-owned, -controlled, or -affiliated entities on U.S. national securities exchanges.


    The President may waive requirements of the bill by certifying it is in the national interest.'
