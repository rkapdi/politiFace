- bill: HR 1296
  congress: 118
  title: Restoration of Employment Choice for Adults with Disabilities Act
  action_date: '2023-03-01'
  action: Referred to the House Committee on Education and the Workforce.
  origin_chamber: House
  url: https://www.congress.gov/bill/118th-congress/house-bill/1296
  summary: 'Restoration of Employment Choice for Adults with Disabilities Act


    This bill relaxes requirements that allow entities with a special wage certificate to
    pay subminimum wages to individuals with disabilities.


    Specifically, the bill eliminates a requirement that an individual with a disability who
    is age 24 or younger receive pre-employment transition services and meet specified vocational
    rehabilitation criteria before beginning subminimum wage work.


    The bill also relaxes career counseling and service referral requirements that apply to
    an individual with a disability who is paid at a subminimum wage. Current law requires
    an entity to ensure that an individual employed at subminimum wage receives periodic career
    counseling, information, and referrals to other services from the designated state agency.
    Under the bill, this requirement is met if the employer makes a documented effort to contact
    the state agency for those resources on behalf of the employee, and the state agency fails
    to provide the counseling, information, and referrals.'
  summary_version: Introduced in House
  summary_date: '2023-03-01'
  summary_truncated: false
