- bill: HR 740
  congress: 119
  title: Veterans’ ACCESS Act of 2025
  action_date: '2025-07-23'
  action: Ordered to be Reported (Amended) by Voice Vote.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/740
  summary: 'Veterans'' Assuring Critical Care Expansions to Support Servicemembers Act of
    2025 or the Veterans'' ACCESS Act of 2025


    This bill addresses the administration of the Veterans Community Care Program (VCCP) and
    other Department of Veterans Affairs (VA) health care matters.


    Among other provisions regarding the VCCP, the bill


    establishes in statute access standards that determine when a veteran is eligible to receive
    non-VA care through the VCCP,


    requires the VA to notify veterans regarding their eligibility for care within two business
    days after the VA is aware the veteran is seeking care, and


    extends the deadline for the submittal of claims under the VCCP by health care entities
    and providers.


    The VA must address its mental health treatment programs by


    establishing a standardized screening process to determine whether a veteran satisfies
    criteria for priority or routine admission to a mental health residential rehabilitation
    treatment program or a program for residential care for mental health and substance abuse
    disorders,


    tracking the performance of medical facilities and Veterans Integrated Service Networks
    in meeting the requirements for mental health treatment screenings and timely admission
    to treatment programs under such screenings, and


    establishing an appeal process for when a veteran is denied admission to a covered treatment
    program or is accepted into a program but not offered bed placement in a timely manner.


    Additionally, the VA must establish an online self-service module for veterans to request
    and manage appointments, track referrals, and appeal and track decisions related to requests
    for care.'
  summary_version: Introduced in House
  summary_date: '2025-01-28'
  summary_truncated: false
