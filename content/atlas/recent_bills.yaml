  action_date: '2025-04-10'
  action: Read twice and referred to the Committee on Banking, Housing, and Urban Affairs.
  origin_chamber: Senate
  url: https://www.congress.gov/bill/119th-congress/senate-bill/1465
  summary: 'Credit Access and Inclusion Act of 2025


    This bill allows for the reporting of certain positive consumer-credit information (such
    as the on-time payment of rent or utilities) to consumer reporting agencies.


    Specifically, a person or the Department of Housing and Urban Development may report information
    related to a consumer''s performance in making payments either under a lease agreement
    for a dwelling or pursuant to a contract for a utility or telecommunications service.
    However, information about a consumer''s usage of any utility or telecommunications service
    may be reported only to the extent that the information relates to payment by the consumer
    for such service or other terms of the provision of that service. Furthermore, an energy
    utility firm may not report a consumer''s outstanding balance as late if the firm and
    the consumer have entered into a payment plan and the consumer is meeting the obligations
    of that plan.


    Specified provisions that establish civil liability with respect to furnishers of information
    to consumer reporting agencies shall not apply to any violation of the bill.


    The Government Accountability Office must report on the consumer impact of such reporting.'
