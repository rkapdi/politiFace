- bill: HR 9342
  congress: 119
  title: GPO Modernization Act of 2026
  action_date: '2026-09-10'
  action: Placed on the Union Calendar, Calendar No. 708.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/9342
  summary: 'GPO Modernization Act of 2026


    This bill revises certain programs and operations of the Government Publishing Office
    (GPO). The bill also revises a Library of Congress (LOC) requirement related to the publication
    of the Constitution Annotated.


    Specifically, the bill revises the Federal Depository Library Program (FDLP) through which
    GPO provides long-term public access to federal publications. Among other changes to the
    FDLP, the bill (1) updates statutory references within the FDLP to include references
    to government public information in all formats, including digital; and (2) removes a
    requirement that a depository library must maintain a specified minimum number of books.


    Additionally, the bill requires GPO''s Superintendent of Documents to (1) provide descriptive
    cataloguing records for government public information, which must include metadata; and
    (2) protect the privacy of individuals using the digital repository system.


    Among other changes to GPO operations, the bill


    redesignates the Joint Committee on Printing (which oversees GPO) as the Joint Committee
    on Publishing and updates the relevant statutory references,


    specifies that GPO may provide publishing services,


    allows GPO to accept gifts,


    increases the statutory simplified acquisition threshold for GPO purchases, and


    updates certain employee leave carryover and compensation rules.


    The bill also replaces the requirement for LOC to prepare hardbound versions of the Constitution
    Annotated and supplements with a requirement for LOC to instead prepare digital versions
    and publish them online. The new requirement applies to the supplement after the Supreme
    Court term beginning October 2026 and all subsequent editions.'
  summary_version: Introduced in House
  summary_date: '2026-06-18'
  summary_truncated: false
- bill: HR 9340
  congress: 119
  title: Ratepayer Protection Act
  action_date: '2026-09-10'
  action: Placed on the Union Calendar, Calendar No. 713.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/9340
  summary: 'Ratepayer Protection Act


    The bill requires state utility regulators and nonregulated utilities to consider implementing
    a standard to hold certain large-load customers responsible for the costs associated with
    any generation, transmission, or distribution upgrade of electric service necessary to
    serve such customers. A large-load customer means a non-residential electric consumer
    that enters, or requests to enter, an agreement concerning the sale of electric energy
    primarily to operate information technology infrastructure and related systems pertaining
    to data storage and computational applications and services (e.g., data centers) that
    have a peak electric demand of 100 megawatts or more at a single site or campus.


    Specifically, the bill requires states to consider implementing a federal standard for
    large-load customers. The standard must require rates charged by electric utilities for
    providing electric service to a large-load customer to be designed to recover from the
    large-load customer the full, incremental cost of any generation, transmission, or distribution
    upgrade necessary to serve such customer. This rate must include the costs that would
    be incurred if the large-load customer terminates an agreement with the electric utility
    pertaining to the sale of electric energy or otherwise ceases the purchase of energy from
    the electric utility.


    Under the standard, an electric utility must require the large-load customer to provide
    to the utility financial assurances or contributions to cover the cost of any generation,
    transmission, or distribution upgrade that is necessary to serve the load of a large-load
    customer before the utility makes any generation, transmission, or distribution upgrade.'
  summary_version: Reported to House
  summary_date: '2026-09-10'
  summary_truncated: false
