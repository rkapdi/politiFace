  title: CHARLIE Act
  action_date: '2026-05-21'
  action: 'Ordered to be Reported (Amended) by the Yeas and Nays: 19 - 15.'
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/8705
  summary: 'Civics and History Advancement to Restore Learning, Integrity, and Education Act
    or the CHARLIE Act


    This bill prohibits the use of federal funding made available for the American History
    and Civics Education program to fund discriminatory equity ideology or gender ideology,
    as defined in certain executive orders. Further, in awarding grants under this program,
    the Department of Education may not give priority to an eligible entity on the basis of
    race, sex, sexual orientation, gender identity, or immigration status.


    The bill defines discriminatory equity ideology in accordance with Executive Order 14190,
    which was published on January 29, 2025. This definition refers to ideology that treats
    individuals as members of preferred or disfavored groups rather than as individuals, including
    listed ideologies (e.g., an ideology that members of one race, color, sex, or national
    origin are morally or inherently superior to members of another race, color, sex, or national
    origin, or that an individual is inherently racist, sexist, or oppressive by virtue of
    the individual''s race, color, sex, or national origin).


    The bill defines gender ideology in accordance with Executive Order 14168, which was published
    on January 20, 2025. This definition refers to an ideology that replaces categories of
    biological sex with gender identity.'
  summary_version: Introduced in House
  summary_date: '2026-05-07'
