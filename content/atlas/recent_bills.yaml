- bill: S 1232
  congress: 113
  title: Great Lakes Ecological and Economic Protection Act of 2013
  action_date: '2014-07-16'
  action: 'Committee on Environment and Public Works Senate Subcommittee on Water and Wildlife.
    Hearings held. With printed Hearing: S.Hrg. 113-772.'
  origin_chamber: Senate
  url: https://www.congress.gov/bill/113th-congress/senate-bill/1232
  summary: 'Great Lakes Ecological and Economic Protection Act of 2013 - Amends the Federal
    Water Pollution Control Act (commonly known as the Clean Water Act) to include as a purpose
    of such Act to achieve the goals established in the Great Lakes Restoration Initiative
    Action Plan (Action Plan), the Great Lakes Regional Collaboration Strategy (Strategy),
    and the Great Lakes Water Quality Agreement of 1978 (Agreement) through: (1) improved
    organization and definition of mission on the part of the Environmental Protection Agency
    (EPA); (2) the funding of grants, contracts, and interagency agreements for protection,
    restoration, and pollution control in the Great Lakes area; and (3) improved accountability.


    Expands the duties of the Great Lakes National Program Office to include coordinating
    with the Great Lakes Interagency Task Force (Task Force), established by this Act.


    Requires the Administrator of EPA to establish the Great Lakes Advisory Board to provide
    advice and recommendations to the Administrator on matters pertaining to Great Lakes restoration
    and protection.


    Finds that the Great Lakes Restoration Initiative (Initiative), which commenced in 2010,
    is designed to: (1) identify programs and projects that are strategically selected to
    target the most significant environmental problems in the Great Lakes ecosystem and to
    implement the Great Lakes Regional Collaboration Strategy; (2) be based on the work of
    the Task Force; and (3) represent the government''s commitment to significantly advancing
    Great Lakes protection and restoration.


    Requires the Initiative to prioritize work done by non-federal partners using funding
    made available for the Great Lakes for priority areas for each fiscal year, such as: (1)
    the remediation of toxic substances and areas of concern, (2) the prevention and control
    of invasive species and their impacts, (3) the protection and restoration of near-shore
    health and the prevention and mitigation of nonpoint source pollution, and (4) habitat
    and wildlife protection and restoration.'
  summary_version: Introduced in Senate
  summary_date: '2013-06-26'
  summary_truncated: true
- bill: S 1202
  congress: 113
  title: SAFE Act
  action_date: '2014-07-16'
  action: 'Committee on Environment and Public Works Senate Subcommittee on Water and Wildlife.
    Hearings held. With printed Hearing: S.Hrg. 113-772.'
  origin_chamber: Senate
  url: https://www.congress.gov/bill/113th-congress/senate-bill/1202
  summary: 'Safeguarding America''s Future and Environment Act or SAFE Act - Requires the
    President to establish an interagency Natural Resources Climate Change Adaptation Panel
    to: (1) adopt the National Fish, Wildlife, and Plants Climate Adaptation Strategy (released
    March 26, 2013) to protect, restore, and conserve natural resources so that such resources
    become more resilient, adapt to, and withstand the impacts of extreme weather and climate
    change; and (2) review and revise such strategy every four years.


    Requires each agency represented on such panel to integrate the elements of such strategy
    that relate to conservation, restoration, and management of natural resources into agency
    plans, environmental reviews, and programs.


    Requires the Secretary of the Interior to establish a National Climate Change and Wildlife
    Science Center within the United States Geological Survey (USGS) to assess and develop
    scientific information, tools, strategies, and techniques to be used to address the impacts
    of extreme weather and climate change on natural resources.


    Requires the Secretary of Commerce and the Secretary of the Interior to establish a Science
    Advisory Board to advise such Panel on the state of the science regarding such impacts
    and strategies and mechanisms for natural resources adaptation.


    Requires each agency represented on such panel to submit to the President a natural resources
    adaptation plan to address such impacts and implement the plan upon approval by the President.


    Requires states, in order to be eligible to receive funding under this Act, to submit
    to the Secretary of the Interior and, as applicable, the Secretary of Commerce for review
    and approval a state natural resources adaptation plan that details efforts to address
    impacts of climate change on natural resources and coastal areas.'
