  summary: 'Protecting the Right to Keep and Bear Arms Act of 2025


    This bill prohibits (1) the President or the Department of Health and Human Services from
    declaring emergencies or disasters for the purpose of imposing gun control; and (2) a
    federal officer or employee, or person operating under color of federal law or receiving
    federal funds, from banning the possession, manufacture, sale, or transfer of weapons
