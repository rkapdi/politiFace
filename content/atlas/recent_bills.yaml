- bill: S 3040
  congress: 119
  title: Edith Nourse Rogers STEM Scholarship Opportunity Act of 2025
  action_date: '2025-10-23'
  action: Read twice and referred to the Committee on Veterans' Affairs.
  origin_chamber: Senate
  url: https://www.congress.gov/bill/119th-congress/senate-bill/3040
  summary: 'Edith Nourse Rogers STEM Scholarship Opportunity Act of 2025


    This bill expands eligibility for and modifies administration of the Edith Nourse Rogers
    STEM Scholarship. The scholarship allows individuals who are entitled to Post-9/11 GI
    Bill educational assistance and are pursuing eligible degrees in science, technology,
    engineering, mathematics, or health care to receive up to nine additional months of benefits
    (capped at $30,000).


    The bill eliminates the requirement that an individual must have less than 180 days of
    remaining educational assistance entitlement (or no entitlement remaining) to be eligible
    for the scholarship.


    Additionally, the bill reduces by 25% the number of credits an individual must have completed
    in order to be eligible for the scholarship.


    In situations where there are insufficient funds available in a fiscal year, the bill
    authorizes the Department of Veterans Affairs to give priority to individuals who have
    used the most months of their educational assistance entitlement and those who are using
    their entitlement to pursue a program of post-secondary education in specified fields
    (e.g., engineering).


    The bill specifies that individuals who receive the scholarship benefit may only use the
    benefit after they have used all of their educational assistance entitlement under the
    Post-9/11 GI Bill.'
  summary_version: Introduced in Senate
  summary_date: '2025-10-23'
  summary_truncated: false
