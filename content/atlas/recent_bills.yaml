  summary: 'Driver Reimbursement Increase for Veteran Equity Act of 2025 or the DRIVE Act
    of 2025


    This bill increases the mileage reimbursement rate available to beneficiaries for travel
    to or from Department of Veterans Affairs (VA) facilities in connection with vocational
    rehabilitation, required counseling, or for the purpose of examination, treatment, or
    care. Specifically, the bill makes the reimbursement rate for such travel equal to or
    greater than the mileage reimbursement rate for government employees using private vehicles
    when no government vehicle is available.


    The bill also requires the VA to ensure that an allowance based on mileage is paid not
    later than 90 days after the request is properly submitted to the VA.'
