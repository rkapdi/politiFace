  action: Referred to the Subcommittee on Antitrust, Commercial, and Administrative Law.
  origin_chamber: House
  url: https://www.congress.gov/bill/117th-congress/house-bill/61
  summary: 'Midnight Rules Relief Act of 2021


    This bill allows Congress to disapprove multiple regulations under one joint resolution
    of disapproval if the regulations were submitted for review during a portion of the final
    year of a President''s term.


    Under current law, the Congressional Review Act generally provides for a period of additional
    review during the succeeding Congress for regulations that were submitted during the last
    60 legislative days of the prior Congress. However, each joint resolution may disapprove
    of only one regulation.'
