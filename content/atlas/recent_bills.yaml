  url: https://www.congress.gov/bill/114th-congress/senate-bill/659
  summary: 'Bipartisan Sportsmen''s Act of 2016


    (Sec. 2) This bill amends the Toxic Substances Control Act to add articles of sport fishing
    equipment to the list of products that the Environmental Protection Agency (EPA) is prohibited
    from regulating under such Act.


    (Sec. 3) The bill amends the Pittman-Robertson Wildlife Restoration Act to facilitate
    the construction and expansion of public target ranges by: (1) authorizing a state to
    pay up to 90% of the costs of acquiring land for expanding or constructing a public target
    range; (2) authorizing a state to elect to allocate 10% of a specified amount apportioned
    to it from the federal aid to wildlife restoration fund for these costs; (3) limiting
    the federal share of those costs under such Act to 90%; and (4) requiring amounts provided
    for those costs under such Act to remain available for expenditure and obligation for
    5 fiscal years.


    The U.S. Forest Service and the Bureau of Land Management are urged to cooperate with
    state and local authorities and other entities to carry out waste removal and other activities
    on any federal land used as a public target range to encourage its continued use for target
    practice or marksmanship training.


    (Sec. 4) The bill amends the Marine Mammal Protection Act of 1972 to direct the Department
    of the Interior to issue a permit for the importation of a polar bear part (other than
    an internal organ) from a bear taken in a sport hunt in Canada to any permit applicant
    who has submitted proof that the polar bear was: (1) legally harvested by the applicant
    before the May 15, 2008, listing of the polar bear as threatened, and (2) harvested from
    an approved polar bear population. Interior must issue these permits without regard to
    limits on importing marine mammals with depleted populations.


    (Sec. 5) The bill amends the Migratory Bird Treaty Act to revise standards for determining
    what constitutes baiting for purposes of the prohibition on taking migratory game birds.
    A baited area, in the case of waterfowl, cranes, and coots includes a standing, unharvested
    crop that has been manipulated through activities such as mowing, discing, or rolling,
    unless the activities are normal agricultural practices. An area is not considered to
    be a baited area if it: (1) has been treated with a normal agricultural practice, (2)
    has standing crops that have not been manipulated, or (3) has standing crops that have
    been or are flooded.'
