  title: HONOR Act
  action_date: '2026-03-16'
  action: Held at the desk.
  origin_chamber: Senate
  url: https://www.congress.gov/bill/119th-congress/senate-bill/327
  summary: 'Hindering Oppressive Nations from Obtaining Revenue Act or HONOR Act


    This bill prohibits a taxpayer from claiming the foreign tax credit (FTC) or an itemized
    tax deduction for taxes paid, accrued, or deemed paid to Russia.


    Under current law, a taxpayer may claim the FTC for income, war profits, and excess profits
    taxes (or taxes imposed in lieu of these taxes) paid, accrued, or deemed paid to a foreign
    country (and certain U.S. possessions) or an itemized tax deduction for such taxes, both
    subject to limitations.


    However, under current law, a taxpayer may not claim the FTC (but may claim an itemized
    tax deduction) for taxes paid to a foreign country if (1) the United States does not recognize
    the country’s government, (2) the United States severs or does not conduct diplomatic
    relations with the country, or (3) the country is designated by the Department of State
    as supporting international terrorist acts. (Currently, the FTC is disallowed for taxes
    paid, accrued, or deemed paid to Iran, North Korea, Sudan, and Syria.)


    Under the bill, a taxpayer may not claim the FTC for taxes paid, accrued, or deemed paid
    to Russia beginning 30 days after the date of enactment and until normal U.S. trade relations
    with Russia are restored (pursuant to requirements established by the Suspending Normal
    Trade Relations with Russia and Belarus Act).


    The bill also disallows an itemized tax deduction for taxes paid, accrued, or deemed to
    be paid to Russia (effective 90 days after the date of enactment).'
