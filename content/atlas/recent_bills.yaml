  url: https://www.congress.gov/bill/119th-congress/senate-bill/4191
  summary: 'Extending WIC for New Moms Act


    This bill extends the eligibility periods for breastfeeding and postpartum women under
    the Special Supplemental Nutrition Program for Women, Infants, and Children (WIC).


    Specifically, a state program may elect to certify a breastfeeding woman for up to 24
    months (currently 1 year) postpartum. The bill also expands the eligibility period for
    postpartum women to up to 24 months after termination of pregnancy (currently 6 months).


    The Department of Agriculture must submit a report to Congress evaluating the effect of
    these changes to the WIC program on (1) maternal and infant health outcomes, (2) breastfeeding
    rates, and (3) qualitative evaluations of family experiences under WIC.'
