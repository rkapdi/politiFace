- bill: HR 2406
  congress: 119
  title: National Oceanic and Atmospheric Administration Sexual Harassment and Assault Prevention
    Improvements Act of 2025
  action_date: '2026-08-20'
  action: Placed on the Union Calendar, Calendar No. 662.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/2406
  summary: 'National Oceanic and Atmospheric Administration Sexual Harassment and Assault
    Prevention Improvements Act of 2025


    This bill expands requirements for addressing sexual harassment and sexual assault involving
    personnel of the National Oceanic and Atmospheric Administration (NOAA).


    The bill specifies that NOAA''s sexual harassment prevention and response policy applies
    to personnel such as observers, at-sea monitors, and voting members and staff of regional
    fishery management councils.


    The bill removes the requirement that certain acts, such as assault, intimidation, and
    sexual harassment of an observer or a data collector, be forcible in nature to be unlawful.


    The bill also requires NOAA''s Office of Marine and Aviation Operations to establish a
    policy for reporting to the Coast Guard the names of NOAA personnel involved in a sexual
    harassment or sexual assault claim. Specifically, such reports must identify employees
    or contractors who are the subject of such claim, the time and date of the incident, and
    the location of the vessel when the incident occurred.


    The bill prohibits a person convicted of certain sexual offenses from enlisting with or
    being commissioned by NOAA.


    Additionally, the bill directs NOAA to update its policies to develop a restricted reporting
    system that allows employees and other personnel to confidentially report sexual harassment
    or assault and receive services without triggering an investigation.


    Finally, the bill also expands reporting requirements on sexual harassment, sexual assault,
    and equal employment.'
