- bill: HR 1464
  congress: 119
  title: MODERN WIC Act of 2025
  action_date: '2025-02-21'
  action: Referred to the House Committee on Education and Workforce.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/1464
  summary: 'More Options to Develop and Enhance Remote Nutrition in WIC Act of 2025 or the
    MODERN WIC Act of 2025


    This bill permanently allows individuals to remotely certify their eligibility for, and
    receive benefits through, the Special Supplemental Nutrition Program for Women, Infants,
    and Children (WIC).


    Specifically, the bill requires that a state agency allow an individual seeking a WIC
    certification, recertification, or a nutritional risk evaluation to do so by phone or
    through video teleconference, in addition to the in-person option.


    A state agency has 90 days to collect data for a nutritional risk evaluation for a remotely
    certified individual. Further, a state agency may consider an applicant who meets the
    income eligibility standards to be temporarily eligible on an interim basis to participate
    in the program and may certify the individual for immediate participation without waiting
    for a nutritional risk evaluation.


    The bill also allows states to provide benefits on WIC electronic benefit transfer cards
    through mail or remote issuance instead of requiring participants to pick up or reload
    benefits in person at a WIC office.


    Further, the Department of Agriculture must report to Congress about the use of remote
    technologies and other digital tools in the WIC program.


    Currently, individuals are generally required to be physically present to certify their
    WIC eligibility and receive benefits, with exceptions. The Food and Nutrition Service
    has temporarily waived these requirements and allowed remote certification and benefits
    using authorities that were provided by laws that were enacted to address COVID-19.'
  summary_version: Introduced in House
  summary_date: '2025-02-21'
  summary_truncated: false
- bill: HR 1083
  congress: 119
  title: Incentivizing Readiness and Environmental Protection Integration Sales Act of 2025
  action_date: '2025-02-06'
  action: Referred to the House Committee on Ways and Means.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/1083
  summary: 'Incentivizing Readiness and Environmental Protection Integration Sales Act of
    2025


    This bill excludes the gain from the sale of a qualified real property interest under
    the Readiness and Environmental Protection Integration (REPI) Program from gross income
    for federal tax purposes. (Some limitations apply.)


    As background, the REPI Program supports cost-sharing agreements between the Armed Forces,
    other federal agencies, state and local governments, and certain private organizations
    to address land use near military installations, address environmental restrictions that
    limit military activities, and increase military installation resilience.


    Under the bill, the exclusion from gross income applies to gain from the sale of a real
    property interest (pursuant to an agreement under the REPI Program) to


    a state or U.S. possession (or a political subdivision of a state or U.S. possession)
    or the District of Columbia;


    the United States;


    certain corporations, trusts, community chest, funds, or foundations; or


    certain charitable organizations.


    Further, under the bill, the real property interest that is sold may be (1) the entire
    interest in the real property, (2) a remainder interest in the real property, or (3) a
    restriction on the use of the real property (e.g., easement) that is granted in perpetuity
    and created under state law.


    However, the bill limits such exclusion from gross income for a partnership or other pass-through
    entity (other than a family partnership or family pass-through entity) to gain from the
    sale of a real property interest that is held for at least three years.'
  summary_version: Introduced in House
  summary_date: '2025-02-06'
  summary_truncated: false
- bill: HR 588
  congress: 119
  title: Boundary Waters Wilderness Protection and Pollution Prevention Act
  action_date: '2025-01-21'
  action: Referred to the House Committee on Natural Resources.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/588
  summary: 'Boundary Waters Wilderness Protection and Pollution Prevention Act


    This bill protects and preserves approximately 225,504 acres of federal land and waters
    in a specified area in the Rainy River Watershed of Superior National Forest in Minnesota
    from certain mining, such as sulfide-ore copper mining. (The area is upstream from the
    Boundary Waters Canoe Area Wilderness.)


    Specifically, the bill withdraws those acres from


    entry, appropriation, and disposal under the public land laws;


    location, entry, and patent under the mining laws; and


    operation of the mineral leasing, mineral materials, and geothermal leasing laws.


    However, the Forest Service is authorized to permit the removal of sand, granite, iron
    ore, and taconite from national forest system lands within such area if the removal is
    not detrimental to the water quality, air quality, and health of forest habitat within
    the Rainy River Watershed.


    Land or interest in land within such area that is acquired by the United States must be
    immediately withdrawn in accordance with this bill.'
  summary_version: Introduced in House
  summary_date: '2025-01-21'
  summary_truncated: false
