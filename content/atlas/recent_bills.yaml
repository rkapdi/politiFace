  action: Received in the Senate and Read twice and referred to the Committee on Homeland
    Security and Governmental Affairs.
  origin_chamber: House
  url: https://www.congress.gov/bill/118th-congress/house-bill/115
  summary: 'Midnight Rules Relief Act


    This bill allows Congress to disapprove multiple regulations under one joint resolution
    of disapproval if the regulations were submitted for review during a portion of the final
    year of a President''s term.


    Under current law, the Congressional Review Act generally provides for a period of additional
    review during the succeeding Congress for regulations that were submitted during the last
    60 legislative days of the prior Congress. However, each joint resolution may disapprove
    of only one regulation.'
  summary_version: Passed House
  summary_date: '2024-12-17'
  summary_truncated: false
- bill: HR 7528
  congress: 118
  title: Comment Integrity and Management Act of 2024
  action_date: '2024-12-17'
  action: Placed on Senate Legislative Calendar under General Orders. Calendar No. 712.
  origin_chamber: House
  url: https://www.congress.gov/bill/118th-congress/house-bill/7528
  summary: 'Comment Integrity and Management Act of 2024


    This bill establishes requirements with respect to the submission of mass comments and
    computer-generated comments in the federal rulemaking process.


    Specifically, the bill requires federal agencies to verify, to the greatest extent possible
    at the time a public comment is submitted, whether the comment has been submitted by a
    human being.


    An agency also must determine whether comments are mass comments and may publish on the
    docket only a single representative copy of such comments or a single copy of one variation
    of mass comments that use standardized but not identical language. If the agency publishes
    only a single copy of a mass comment, the agency also must indicate the number of mass
    comments submitted that were identical or substantively identical to the representative
    copy or variation that the agency published.


    Additionally, each agency must establish a policy with respect to the posting and consideration
    of computer-generated comments and mass-comments during the agency''s rulemaking process.


    The Office of Management and Budget must issue guidance for implementing the requirements
    of this bill, and the Government Accountability Office must report on the identification
    and effect of computer-generated comments in the rulemaking process.'
  summary_version: Passed House
  summary_date: '2024-05-06'
  summary_truncated: false
