  title: Saving the OOI Act of 2026
  action_date: '2026-06-18'
  action: Held at the desk.
  origin_chamber: Senate
  url: https://www.congress.gov/bill/119th-congress/senate-bill/4822
  summary: 'Saving the OOI Act of 2026


    This bill prohibits the National Science Foundation (NSF) from using federal funds to
    decommission or descope Ocean Observatories Initiative (OOI) instruments until a thorough
    review of OOI is completed.


    OOI measures and observes ocean conditions using a series of in-water instruments that
    gather physical, chemical, geological, and biological data. On May 21, 2026, NSF announced
    that it would remove all in-water infrastructure from four of the five active OOI arrays.


    Under the bill, NSF must conduct a thorough review of OOI with engagement from the scientific
    and coastal communities before decommissioning or descoping specified OOI instruments.
    This includes OOI instruments anchored off of Oregon, Washington, Alaska, and North Carolina,
    as well as instruments anchored in the Irminger Sea. NSF is required to maintain full
    and consistent OOI operations, including monitoring in states where instruments have already
    been decommissioned, until the review is complete.'
