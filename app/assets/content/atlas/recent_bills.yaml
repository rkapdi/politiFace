- bill: HR 5617
  congress: 119
  title: Geothermal Gold Book Development Act
  action_date: '2026-05-20'
  action: Placed on the Union Calendar, Calendar No. 573.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/5617
  summary: 'Geothermal Gold Book Development Act


    This bill directs the Department of the Interior to identify standard procedures and guidelines
    for efficient and environmentally responsible geothermal leasing and permitting on federal
    land and include the procedures and guidelines in its Surface Operating Standards and
    Guidelines for Oil and Gas Exploration and Development publication, commonly known as
    the Gold Book.


    Interior must (1) publish an updated version of the Gold Book within 270 days of identifying
    such procedures and guidelines, and (2) review the Gold Book every five years and publish
    an updated version if necessary to support efficient and environmentally responsible geothermal
    leasing and permitting.


    Interior must also rename the Gold Book to reflect the incorporation of standard procedures
    and guidelines related to geothermal development.'
  summary_version: Reported to House
  summary_date: '2026-05-20'
  summary_truncated: false
