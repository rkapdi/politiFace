- bill: S 759
  congress: 119
  title: Modernizing Access to Our Public Oceans Act
  action_date: '2026-09-25'
  action: 'Became Public Law No: 119-116.'
  origin_chamber: Senate
  url: https://www.congress.gov/bill/119th-congress/senate-bill/759
  summary: 'Modernizing Access to Our Public Oceans Act


    This bill directs the National Oceanic and Atmospheric Administration (NOAA) to publish
    geospatial data related to public recreational use of federal waterways (e.g., boating
    and fishing).


    Under the bill, NOAA must consult with relevant stakeholders (including state and local
    governments, Indian tribes, and Native Hawaiian organizations) to develop and adopt standards
    for the coordination and dissemination of geospatial data relating to fishing restrictions
    and recreational vessels'' use of federal waterways, including the exclusive economic
    zone of the United States (EEZ). (The EEZ generally includes waters between 3 and 200
    miles seaward from the U.S. coastline.)


    Within four years after the bill is enacted, NOAA must provide geographic information
    system data on a public website that identifies and describes the locations where and
    conditions under which certain recreational activities are restricted in federal waterways.
    Specifically, the website must identify (1) locations where fishing restrictions are imposed,
    (2) areas in the EEZ with restrictions on specified recreational vessel types, and (3)
    federally protected areas (e.g., National Marine Sanctuaries). NOAA must also continue
    to provide digitized navigation information related to the EEZ and make the information
    available on the website to the extent practicable.


    The bill allows NOAA to coordinate and partner with nonfederal entities to carry out this
    bill. It also directs NOAA to work with other federal agencies to ensure compatibility
    and interoperability among federal databases with respect to collecting and disseminating
    geospatial data related to the public outdoor recreational use of the EEZ.'
  summary_version: Passed Senate
  summary_date: '2025-09-10'
  summary_truncated: false
