  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/4123
  summary: 'Federal Improvement in Technology Procurement Act or the FIT Procurement Act


    This bill addresses various issues related to federal procurement policy and the federal
    acquisition workforce.


    For example, the bill requires


    the Federal Acquisition Institute (FAI) to establish a pilot program to consider incorporating
    experiential learning into the Federal Credentials Program, the Federal Acquisition Certification-Contracting
    Officer’s Representative Program, and the Federal Acquisition Certification for Program
    and Project Managers Program;


    FAI to provide information and communications technology acquisition training for certain
    acquisition workforce members;


    the General Services Administration to assume responsibility from the Office of Management
    and Budget for developing and implementing an artificial intelligence training program
    for certain acquisition workforce members;


    the Office of Federal Procurement Policy (OFPP) to issue guidance on when a wider range
    of projects, including commercial or non-government projects, should be accepted as relevant
    past performance so as to increase competition among eligible firms; and


    the OFPP to implement regulatory and other non-legislative actions, based on input from
    the Chief Acquisition Officers Council and the public, to remove barriers to entry for
    small businesses seeking to participate in federal government procurement.


    The bill also increases the simplified acquisition threshold from $250,000 to $500,000
    and the micro purchase threshold from $10,000 to $25,000. (The federal government uses
    less complex procedures for the purchase of property and services valued below the simplified
    acquisition threshold. Purchases below the micro purchase threshold generally do not require
    soliciting competitive quotations if the contracting officer considers the price to be
    reasonable.)'
  summary_version: Introduced in House
