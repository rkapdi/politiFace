- bill: HR 10346
  congress: 119
  title: Stop China’s Exploitation of Congolese Children and Adult Forced Labor through Cobalt
    Mining Act
  action_date: '2026-09-16'
  action: 'Ordered to be Reported in the Nature of a Substitute by the Yeas and Nays: 32 -
    8.'
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/10346
  summary: 'Stop China’s Exploitation of Congolese Children and Adult Forced Labor through
    Cobalt Mining Act


    This bill requires the Forced Labor Enforcement Task Force to complete and submit to Congress
    the results of an investigation into the alleged use of forced labor in the cobalt mining
    industry of the Democratic Republic of the Congo (DRC).


    Specifically, the task force must (1) submit to Congress strategies for preventing the
    importation of cobalt mined using forced labor, and (2) provide semiannual briefings to
    Congress.


    This requirement ceases to have effect on the earlier of (1) eight years after the date
    of enactment, or (2) the date on which the President submits to Congress a determination
    that forced labor in the DRC mining industry has ended.'
  summary_version: Introduced in House
  summary_date: '2026-09-10'
  summary_truncated: false
- bill: HR 5063
  congress: 119
  title: Safe Beaches, Safe Swimmers Act
  action_date: '2026-09-15'
  action: Received in the Senate and Read twice and referred to the Committee on Energy and
    Natural Resources.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/5063
  summary: 'Safe Beaches, Safe Swimmers Act


    This bill establishes requirements to ensure an adequate staff of lifeguards at swimming
    areas and swimming beaches managed by the National Park Service, the U.S. Fish and Wildlife
    Service, the Bureau of Land Management, or the Bureau of Reclamation that are typically
    monitored by federally employed lifeguards during normal seasonal operating hours.


    If the Department of the Interior determines there is a staffing shortage of lifeguards
    that will leave a swimming area or beach unmonitored by federally employed lifeguards
    during normal seasonal operating hours, Interior may enter into an agreement with local
    government agencies to provide lifeguards. Interior must ensure that a local government
    agency providing lifeguard services is reimbursed for all reasonable costs it incurred
    in carrying out the agreement.


    The bill does not apply to short-term staffing shortages caused by temporary absences,
    such as an employee taking annual or sick leave.'
  summary_version: Reported to House
  summary_date: '2026-08-27'
  summary_truncated: false
