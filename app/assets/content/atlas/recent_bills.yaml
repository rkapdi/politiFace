- bill: HR 3410
  congress: 119
  title: Supersonic Aviation Modernization Act
  action_date: '2026-03-25'
  action: Received in the Senate and Read twice and referred to the Committee on Commerce,
    Science, and Transportation.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/3410
  summary: 'Supersonic Aviation Modernization Act


    This bill directs the Federal Aviation Administration (FAA) to allow civil aircraft to
    operate at speeds above Mach 1 (i.e., supersonic) over land in the United States under
    certain conditions.


    Specifically, the FAA must issue or revise regulations to allow for the operation of civil
    aircraft at speeds greater than Mach 1 in the national airspace system without a special
    authorization, so long as no sonic boom reaches the ground in the United States.


    The FAA must also issue a final rule to establish noise standards that prohibit civil
    aircraft operating at speeds greater than Mach 1 from exceeding takeoff and landing noise
    levels required for subsonic aircraft (i.e., aircraft that operate at speeds that do not
    exceed Mach 1). As part of the rule, the FAA must specify a process to periodically review
    and update the noise standards to reflect future advances in aircraft noise reduction
    technology and regulatory changes.


    Current regulations prohibit civil aircraft from operating above Mach 1 speeds over land
    in the United States without a special flight authorization issued by the FAA.'
  summary_version: Reported to House
  summary_date: '2026-03-16'
  summary_truncated: false
