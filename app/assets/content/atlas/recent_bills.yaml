- bill: HR 1684
  congress: 119
  title: PAST Act of 2025
  action_date: '2025-02-27'
  action: Referred to the House Committee on Energy and Commerce.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/1684
  summary: 'Prevent All Soring Tactics Act of 2025 or the PAST Act of 2025


    This bill increases protections for horses at shows, exhibitions, sales, or auctions (horse
    events) to prevent the practice of soring horses. Generally, the soring of horses includes
    certain actions taken on horses'' limbs to produce higher gaits that may cause pain, distress,
    inflammation, or lameness.


    Specifically, the bill expands existing soring prohibitions under the Horse Protection
    Act, including by banning the use of certain action devices (e.g., nonprotective boots)
    on specified horse breeds.


    The bill also requires soring inspectors at horse events to be assigned by the Animal
    and Plant Health Inspection Service (APHIS) of the Department of Agriculture rather than
    appointed by the management of horse events. APHIS must also license, train, and oversee
    inspectors to detect and diagnose soring at such events.


    Additionally, the bill increases penalties for violations of the act. It also directs
    APHIS to disqualify horses found to be sore from being shown or exhibited for specified
    periods. Further, APHIS may permanently disqualify violators from participating in horse
    events after the third or any subsequent violation.


    By way of background, APHIS issued a rule in 2024 to increase efforts to protect horses
    from soring practices. However, in 2025, a court vacated parts of the rule as exceeding
    APHIS'' statutory authority (e.g., prohibiting the use of certain action devices) while
    deeming other parts acceptable (e.g., establishing APHIS-designated inspectors). APHIS
    subsequently delayed the effective date of the rule to December 31, 2026.'
  summary_version: Introduced in House
  summary_date: '2025-02-27'
  summary_truncated: false
