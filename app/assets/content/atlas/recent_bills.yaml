- bill: HCONRES 5
  congress: 119
  title: Legislative Proxy and Absence Accommodation Resolution
  action_date: '2025-01-28'
  action: Referred to the House Committee on Rules.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-concurrent-resolution/5
  summary: 'Legislative Proxy and Absence Accommodation Resolution


    This concurrent resolution authorizes proxy voting and remote appearances by Members of
    Congress who are absent due to an illness, military service, jury duty, or other circumstances.


    The concurrent resolution establishes grounds and procedures by which an absent Member
    of the House of Representatives or the Senate may (1) designate another Member to cast
    a vote or record the presence of the absent Member; and (2) remotely appear at a committee
    proceeding.


    The concurrent resolution authorizes proxy voting and remote appearances for absences
    due to


    jury duty;


    the death of a family member;


    a family member who has a serious health condition;


    the Member''s own illness or serious health condition;


    the birth, adoption, or foster placement of a son or daughter;


    the Member serving in the armed services;


    a family member being called to active duty; or


    a condition preventing the Member from safely traveling to or performing work at the proceeding.


    Certain purposes are time-limited; for example, an absence due to a Member''s own illness
    is limited to seven days in a calendar year.


    Further, a Member must provide to the Clerk of the House or the Secretary of the Senate,
    respectively (1) a written proxy designation or notice of remote appearance, (2) the grounds
    for the absence, and (3) such documentation as they may require. The Clerk and Secretary
    must maintain and make publicly available a list of the grounds, time frames, and other
    details about Members using these provisions.'
  summary_version: Introduced in House
  summary_date: '2025-01-28'
  summary_truncated: false
