- bill: HRES 23
  congress: 119
  title: Proxy Voting for New Parents Resolution
  action_date: '2025-01-09'
  action: Referred to the House Committee on Rules.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-resolution/23
  summary: 'Proxy Voting for New Parents Resolution


    This resolution authorizes proxy voting in the House of Representatives for a Member who
    has given birth or whose spouse has given birth and pregnant Members who are unable to
    travel safely or have a serious medical condition.


    Under the resolution, a qualifying Member may designate a proxy to cast a vote in a committee,
    the Committee of the Whole, or on the House floor; however, proxies will not be counted
    for purposes of establishing a quorum. The proxy designation is valid for up to 12 weeks.


    To designate a proxy for House and Committee of the Whole votes, the Member must submit
    a signed and dated letter to the Clerk stating the Member’s qualifying circumstances and
    the name and state of the Member who has agreed to be designated as proxy. A Member who
    has designated a proxy according to these requirements may also designate a proxy for
    committee votes. To designate a proxy for committee votes, the Member must provide the
    committee chair and ranking minority member with a signed and dated letter specifying
    another member of the committee to cast a proxy vote.


    The resolution further provides that a Member may revoke the proxy authorization by (1)
    casting the Member’s own vote; (2) recording the Member’s own presence in the House or
    in the Committee of the Whole; or (3) in a committee, by submitting a signed letter to
    the chair and ranking minority member.'
  summary_version: Introduced in House
  summary_date: '2025-01-09'
  summary_truncated: false
- bill: HRES 20
  congress: 119
  title: Establishing the Select Committee on Electoral Reform.
  action_date: '2025-01-07'
  action: Referred to the House Committee on Rules.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-resolution/20
  summary: 'This resolution establishes the House Select Committee on Electoral Reform to
    examine current methods of electing Members of Congress, consider alternative methods
    of election, and report appropriate recommendations to Congress and the President.


    Specifically, the committee must (1) determine how alternative methods of election would
    affect the responsiveness, accountability, and functionality of Congress; (2) conduct
    hearings to take testimony and receive evidence from appropriate expert witnesses; and
    (3) examine federal barriers to state experimentation with alternative electoral systems.
    The committee must consider alternatives to current methods that include adopting multi-member
    congressional districts with proportional representation; adjusting the total number of
    Members of the House of Representatives; adopting alternative methods of voting (e.g.,
    ranked-choice voting); and holding open and nonpartisan primaries.


    The committee shall be made up of 14 Members of Congress appointed by the Speaker of the
    House, 7 of whom shall be appointed in consultation with the minority leader. The committee''s
    co-chairs shall be designated by the Speaker and minority leader, respectively. The resolution
    provides that the committee must hold its first meeting within 30 days after all of its
    members have been appointed.


    The committee shall issue its final report to Congress and the President within one year
    after the committee''s first meeting.'
  summary_version: Introduced in House
  summary_date: '2025-01-07'
  summary_truncated: false
