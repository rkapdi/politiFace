    First, the Centers for Disease Control and Prevention must incorporate a focus on pregnant
    and postpartum individuals, including by disseminating information to obstetric health
    care providers, into its existing public awareness campaign about the importance of vaccinations.


    Second, the bill expressly allows certain project grants for preventive health services
    to be used for activities to increase vaccination rates of pregnant and postpartum individuals
    (and their children).


    The bill reauthorizes through FY2031 the awareness campaign on vaccinations and certain
    project grants and related activities for preventive health services.'
