- bill: S 298
  congress: 118
  title: Keep Americans Safe Act
  action_date: '2023-02-07'
  action: Read twice and referred to the Committee on the Judiciary.
  origin_chamber: Senate
  url: https://www.congress.gov/bill/118th-congress/senate-bill/298
  summary: 'Keep Americans Safe Act


    This bill establishes a new criminal offense for the import, sale, manufacture, transfer,
    or possession of a large capacity ammunition feeding device (LCAFD).


    The bill does not prohibit certain conduct with respect to an LCAFD, including the following:


    importation, sale, manufacture, transfer, or possession related to certain law enforcement
    efforts, or authorized tests or experiments;


    importation, sale, transfer, or possession related to securing nuclear materials; and


    possession by a retired law enforcement officer.


    The bill permits continued possession of, but prohibits sale or transfer of, a grandfathered
    LCAFD.


    Newly manufactured LCAFDs must display serial number identification and the date of manufacture.


    Additionally, the bill allows a state or local government to use Edward Byrne Memorial
    Justice Assistance Grant Program funds to compensate individuals who surrender an LCAFD
    under a buy-back program.'
  summary_version: Introduced in Senate
  summary_date: '2023-02-07'
  summary_truncated: false
- bill: S 173
  congress: 118
  title: Ethan's Law
  action_date: '2023-01-31'
  action: Read twice and referred to the Committee on the Judiciary.
  origin_chamber: Senate
  url: https://www.congress.gov/bill/118th-congress/senate-bill/173
  summary: 'Ethan''s Law


    This bill establishes a framework to regulate the storage of firearms on residential premises
    at the federal, state, and tribal levels.


    At the federal level, the bill establishes statutory requirements for firearms on residential
    premises to be safely stored if a minor is likely to gain access without permission or
    if a resident is ineligible to possess a firearm.


    An individual who violates the requirements is subject to criminal penalties. A firearm
    stored in violation of the requirements is subject to seizure and forfeiture.


    At the state and tribal levels, the bill requires the Department of Justice to award grants
    to implement functionally identical requirements for the safe storage of firearms.'
  summary_version: Introduced in Senate
  summary_date: '2023-01-31'
  summary_truncated: false
