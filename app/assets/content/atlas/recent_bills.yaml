  summary: 'Continental Divide National Scenic Trail Completion Act


    This bill directs the Department of Agriculture (USDA) and the Department of the Interior
    to seek to complete the Continental Divide National Scenic Trail no later than 10 years
    after the enactment of this bill.


    USDA and Interior must establish a joint Forest Service and Bureau of Land Management
