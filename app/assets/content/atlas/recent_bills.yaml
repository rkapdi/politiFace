- bill: S 1212
  congress: 118
  title: Securing and Enabling Commerce Using Remote and Electronic Notarization Act of 2023
  action_date: '2023-04-19'
  action: Read twice and referred to the Committee on the Judiciary.
  origin_chamber: Senate
  url: https://www.congress.gov/bill/118th-congress/senate-bill/1212
  summary: 'Securing and Enabling Commerce Using Remote and Electronic Notarization Act of
    2023


    This bill allows a notary public commissioned under state law to remotely notarize electronic
    records and perform notarizations for remotely located individuals. The bill provides
    technical requirements for the notarizations, including the creation and retention of
    video and audio recordings and the use of communication technologies (i.e., video chat).


    Additionally, the bill requires U.S. courts and states to recognize notarizations—including
    remote notarizations of electronic records and notarizations of remotely-located individuals—that
    occur in or affect interstate commerce and are performed by a notary public commissioned
    under the laws of other states.


    The bill also allows a notary public to remotely notarize electronic records involving
    an individual located outside of the United States, subject to certain requirements.'
  summary_version: Introduced in Senate
  summary_date: '2023-04-19'
  summary_truncated: false
- bill: HR 1370
  congress: 118
  title: Communications Security Act
  action_date: '2023-03-24'
  action: 'Ordered to be Reported by the Yeas and Nays: 49 - 0.'
  origin_chamber: House
  url: https://www.congress.gov/bill/118th-congress/house-bill/1370
  summary: 'Communications Security Act


    This bill provides statutory authority and sets forth membership requirements for a council
    that provides advice and recommendations to the Federal Communications Commission (FCC)
    regarding ways to increase the security, reliability, and interoperability of communications
    networks.


    The bill specifies that the council must include representatives of companies in the communications
    industry; public interest organizations or academic institutions; and federal, state,
    tribal, and local governments (with at least one member representing each level of government).


    The FCC may designate an existing advisory committee to serve as the council, provided
    that the committee''s membership is modified (if necessary) to comply with the requirements
    specified in the bill.'
  summary_version: Introduced in House
