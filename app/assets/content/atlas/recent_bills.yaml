- bill: HR 3029
  congress: 119
  title: To amend the Research and Development, Competition, and Innovation Act to support
    nucleic acid screening, and for other purposes.
  action_date: '2026-07-21'
  action: Received in the Senate and Read twice and referred to the Committee on Commerce,
    Science, and Transportation.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/3029
  summary: 'Nucleic Acid Standards for Biosecurity Act


    This bill explicitly requires the National Institute of Standards and Technology (NIST)
    to support the development of best practices and technical standards for nucleic acid
    synthesis.


    Nucleic acids, including deoxyribonucleic acid (DNA) and ribonucleic acid (RNA), carry
    genetic information within cells. Nucleic acid synthesis is the process of designing and
    creating custom nucleic acids; it is used in the development of medications and agricultural
    products. However, this technology also poses a risk of misuse (e.g., the intentional
    or unintentional creation of dangerous biological agents).


    The bill requires NIST to carry out measurement research to support the development and
    improvement of biosecurity best practices and technical standards related to nucleic acid
    synthesis. This effort must address specified topics including nucleic acid synthesis
    screening, operational security, and conformity assessment. (A 2023 executive order titled
    Safe, Secure, and Trustworthy Development and Use of Artificial Intelligence directed
    NIST to develop and refine similar specifications and best practices for use by synthetic
    nucleic acid providers. NIST''s work on this topic is ongoing.)


    In carrying out this effort, NIST must convene stakeholders to develop and periodically
    update consensus priorities and best practices for synthetic nucleic acid screening mechanisms.
    Within a specified period, NIST must submit a summary of the stakeholder group’s findings
    to Congress.


    NIST must also take steps to advance risk management best practices and technical standards
    for engineering biology and biomanufacturing, including with respect to risks associated
    with the use of artificial intelligence.'
  summary_version: Introduced in House
  summary_date: '2025-04-28'
  summary_truncated: false
- bill: HR 2913
  congress: 119
  title: Ukraine Support Act
  action_date: '2026-07-20'
  action: Read the second time. Placed on Senate Legislative Calendar under General Orders.
    Calendar No. 462.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/2913
  summary: 'Ukraine Support Act


    This bill addresses the war between Russia and Ukraine by (1) providing assistance to
    Ukraine and certain European countries, and (2) establishing penalties for Russia and
    certain foreign persons (individuals and entities).


    Assistance provided under the bill includes


    establishing a reconstruction trust fund for Ukraine,


    requiring the U.S. International Development Finance Corporation to prioritize support
    for Ukraine,


    reviving the President’s authority to lend or lease defense articles to Ukraine or Eastern
    European countries affected by the war through FY2028,


    extending through 2027 the Department of Defense’s authority to provide security assistance
    and intelligence support to Ukrainian forces, and


    requiring the Department of State to take certain actions to build the capacity of the
    militaries and border forces of Baltic countries.


    Additionally, the President must periodically determine if the Russian government or any
    proxy is waging a war of aggression against Ukraine, refusing to sincerely negotiate a
    peace agreement with Ukraine, or acting in violation of a negotiated peace agreement with
    Ukraine. If the President makes such a determination, the President must impose certain
    penalties including


    property- and visa-blocking sanctions on certain Russian officials;


    property-blocking sanctions on Russian companies in the oil and mining sectors, Rosatom
    (Russia''s state-owned nuclear enterprise) and its subsidiaries, and certain Russian financial
    institutions; and


    increasing the rate of duty on all goods and services imported from Russia into the United
    States to at least 500% relative to the value of such goods and services.'
  summary_version: Introduced in House
