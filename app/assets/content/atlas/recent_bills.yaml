  summary: 'Eric''s Law


    This bill modifies procedures with respect to capital sentencing hearings.


    If a jury at a capital sentencing hearing does not reach a unanimous recommendation on
    the defendant''s sentence and there is a motion by the attorney for the government, the
    court must order a new special sentencing hearing and impanel a new jury. If the new jury
    at the special sentencing hearing does not reach a unanimous recommendation on the defendant''s
    sentence, then the court is prohibited from imposing a death sentence.'
