- bill: HR 3920
  congress: 119
  title: Lawless Cities Accountability Act of 2025
  action_date: '2025-06-11'
  action: Referred to the Committee on the Judiciary, and in addition to the Committee on
    Oversight and Government Reform, for a period to be subsequently determined by the Speaker,
    in each case for consideration of such provisions as fall within the jurisdiction of the
    committee concerned.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/3920
  summary: 'Lawless Cities Accountability Act of 2025


    This bill prohibits federal funding for a jurisdiction that is a lawless jurisdiction.


    The term lawless jurisdiction means a state or political subdivision of a state that does
    one of the following:


    forbids law enforcement from intervening to restore order during widespread violence or
    destruction,


    withdraws law enforcement protection from an area or structure that law enforcement officers
    are lawfully entitled to access,


    disempowers or defunds law enforcement agencies, or


    refuses to accept law enforcement assistance from the federal government amid widespread
    violence or destruction.'
  summary_version: Introduced in House
  summary_date: '2025-06-11'
  summary_truncated: false
