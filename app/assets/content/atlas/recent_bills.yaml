    the Office of Policy Development and Cybersecurity to oversee and conduct national communications
    and information policy analysis and development for the internet and communications technologies.


    Among its duties, the office shall develop, analyze, and advocate for market-based policies
    that promote innovation, competition, consumer access, digital inclusion, workforce development,
    and economic growth in the communications, media, and technology markets. The office must
    also coordinate processes to create guidance or to support the development and implementation
    of cybersecurity and privacy policies with respect to the internet and other communications
    networks.'
  summary_version: Reported to House
  summary_date: '2022-12-30'
  summary_truncated: false
