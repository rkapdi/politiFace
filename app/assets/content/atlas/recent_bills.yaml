- bill: HR 4464
  congress: 119
  title: Preventive Health Savings Act
  action_date: '2026-11-19'
  action: Received in the Senate and Read twice and referred to the Committee on the Budget.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/4464
  summary: 'Preventive Health Savings Act


    This bill requires the Congressional Budget Office (CBO), upon receiving a request from
    Congress, to determine if proposed legislation would reduce spending outside of the 10-year
    budget window through the use of preventive health care.


    Under the bill, the term preventive health care generally refers to an action that focuses
    on the health of the public, individuals, and defined populations in order to protect,
    promote, and maintain health and wellness and prevent disease, disability, and premature
    death.


    If CBO determines that the proposed legislation would result in net reductions in budget
    outlays from the use of preventive health care, any CBO projection regarding the legislation
    must include (1) a description and estimate of the reductions in outlays, and (2) a description
    of the basis for these conclusions.


    Any estimate provided by CBO pursuant to this bill must be used as a supplementary estimate
    and may not be used to determine compliance with the Congressional Budget Act of 1974
    or any other budgetary enforcement controls.'
  summary_version: Introduced in House
