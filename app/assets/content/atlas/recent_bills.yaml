  title: EASE Act
  action_date: '2025-04-02'
  action: Read twice and referred to the Committee on Finance.
  origin_chamber: Senate
  url: https://www.congress.gov/bill/119th-congress/senate-bill/1248
  summary: 'Ensuring Access to Specialty Care Everywhere Act or the EASE Act


    This bill requires the Center for Medicare and Medicaid Innovation (CMMI) to test a model
    that uses a network of providers to remotely furnish specialty health care to Medicare,
    Medicaid, and Children''s Health Insurance Program (CHIP) beneficiaries in rural areas.


    To conduct the model, the CMMI must select at least one provider network that is a nonprofit
    entity and that consists of at least 50 federally qualified health centers, rural health
    clinics, critical access hospitals, or rural emergency hospitals. At least half of the
    providers in the network must be located in rural areas. Providers must use digital methods
    (e.g., telehealth technology) to provide specialty care and must coordinate with beneficiaries''
    primary care providers.'
  summary_version: Introduced in Senate
