  summary: 'Reaching English Learners Act


    This bill directs the Department of Education to establish a grant program for preparing
    future teachers to effectively instruct English learners to achieve at high levels in
    early childhood education programs and in elementary and secondary schools. Under the
    program, grants must be given to partnerships between (1) certain institutions of higher
    education, and (2) high-need local educational agencies or high-need early childhood education
    programs.'
