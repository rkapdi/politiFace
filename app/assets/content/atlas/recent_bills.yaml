- bill: HR 3962
  congress: 117
  title: SECURE Notarization Act of 2022
  action_date: '2022-07-28'
  action: Received in the Senate and Read twice and referred to the Committee on the Judiciary.
  origin_chamber: House
  url: https://www.congress.gov/bill/117th-congress/house-bill/3962
  summary: 'Securing and Enabling Commerce Using Remote and Electronic Notarization Act of
    2022 or the SECURE Notarization Act of 2022


    This bill allows a notary public commissioned under state law to remotely notarize electronic
    records and perform notarizations for remotely located individuals. The bill provides
    technical requirements for such notarizations, including the creation and retention of
    video and audio recordings and the use of communication technologies (i.e., video chat).


    Additionally, the bill requires U.S. courts and states to recognize notarizations—including
    remote notarizations of electronic records and notarizations of remotely-located individuals—that
    occur in or affect interstate commerce and are performed by a notary public commissioned
    under the laws of other states.


    The bill also allows a notary public to remotely notarize electronic records involving
    an individual located outside of the United States, subject to certain requirements.'
  summary_version: Passed House
  summary_date: '2022-07-27'
  summary_truncated: false
