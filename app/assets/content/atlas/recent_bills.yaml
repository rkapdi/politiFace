  action: Placed on the Union Calendar, Calendar No. 783.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/6213
  summary: 'Heat Workforce Standards Act of 2025


    This bill prohibits the Occupational Safety and Health Administration (OSHA) from finalizing,
    implementing, or enforcing a safety standard requiring certain employers to create a heat
    injury and illness prevention plan to evaluate and control heat hazards in their workplaces.


    Specifically, OSHA is prohibited from finalizing the proposed rule titled Heat Injury
    and Illness Prevention in Outdoor and Indoor Work Settings, which was published on August
    30, 2024, or any substantially similar standard. The proposed standard generally applies
    to employers conducting outdoor and indoor work in all general industry, construction,
    maritime, and agriculture sectors where OSHA has jurisdiction. Employers must develop
    plans in accordance with the specified standards to address employee exposures to heat
    indexes at or above 80 degrees (initial heat trigger) or 90 degrees (high heat trigger)
    Fahrenheit.


    As background, the Occupational Safety and Health Act of 1970 generally requires employers
    to provide their employees with a place of employment that is free from recognized hazards
    that are causing or likely to cause death or serious harm to employees. OSHA conducts
    workplace inspections and cites employers that fail to satisfy these requirements. Currently,
    OSHA does not have specific heat exposure standards; however, OSHA has historically used
    its general authority to cite employers for violations involving excessive heat, including
    through a National Emphasis Program that focuses on indoor and outdoor heat exposure in
    industries that have the highest risks.'
  summary_version: Introduced in House
