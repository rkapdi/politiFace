- bill: S 1787
  congress: 119
  title: Dolores River National Conservation Area and Special Management Area Act
  action_date: '2026-07-23'
  action: Placed on Senate Legislative Calendar under General Orders. Calendar No. 480.
  origin_chamber: Senate
  url: https://www.congress.gov/bill/119th-congress/senate-bill/1787
  summary: 'Dolores River National Conservation Area and Special Management Area Act


    This bill establishes the Dolores River National Conservation Area and the Dolores River
    Special Management Area in Colorado to protect certain natural, recreational, scenic,
    cultural, historical, and other values of the areas.


    The conservation area must consist of approximately 52,872 acres of Bureau of Land Management
    land. The special management area must consist of approximately 15,452 acres of federal
    land in the San Juan National Forest.


    A management plan must be developed for each area. The bill directs the Department of
    the Interior to allow for the continued use of the areas by members of Indian tribes for
    traditional ceremonies and as a source of traditional plants and other materials.


    Additionally, Interior must manage the portions of the areas identified as Ponderosa Gorge
    in a manner that maintains its wilderness character, including by prohibiting (1) road
    construction; (2) the use of motor vehicles, motorized equipment, or mechanical transport;
    and (3) projects undertaken for the purpose of harvesting commercial timber.


    Interior must also establish the Dolores River National Conservation Area Advisory Council.


    Finally, the bill releases segments of the Dolores River inside the areas from further
    study for potential addition to the Wild and Scenic Rivers System.'
  summary_version: Introduced in Senate
  summary_date: '2025-05-15'
  summary_truncated: false
