  summary: 'Less Bureaucracy, Better Workforce Development Act


    This bill transfers specified functions relating to education and workforce development
    programs from the Department of Education (ED) to the Department of Labor''s Employment
    and Training Administration (ETA).


    Specifically, the bill transfers to the ETA all the functions and authorities exercised
    by ED before the bill''s effective date related to ED''s Office of Career, Technical,
    and Adult Education. This office administers adult education and family literacy programs
    under Title II of the Workforce Innovation and Opportunity Act and career and technical
    education programs under the Carl D. Perkins Career and Technical Education Act of 2006.
    (On July 15, 2025, ED announced an interagency agreement with Labor for Labor to manage
    competitions, provide technical assistance, and integrate ED''s programs with Labor''s
    existing programs, while ED must maintain its statutory responsibilities and program oversight.)


    Additionally, the bill transfers to the ETA all personnel and appropriations related to
    the functions that are transferred under this bill.


    The bill outlines the authority of the Office of Management and Budget (OMB) related to
    the functions that are transferred under this bill, including that OMB must ensure that
    this bill does not create a net increase in full-time equivalent employees at the ETA
    or ED. Further, OMB must certify compliance with the bill to specified congressional committees.


    The transfer of these functions does not affect any suits, proceedings, or applications
    for benefits, services, licenses, permits, certificates, or financial assistance that
