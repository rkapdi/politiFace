  summary: 'Prevent All Soring Tactics Act of 2022 or the PAST Act of 2022


    This bill addresses the practice of soring horses. The soring of horses includes various
    actions taken on horses'' limbs to produce higher gaits that may cause pain, distress,
    inflammation, or lameness.


    Specifically, the bill expands soring regulation and enforcement at horse shows, exhibitions,
    sales, and auctions, including by establishing a new system for inspecting horses for
    soring. In addition, the bill increases penalties for violations.'
