  summary: 'Holocaust Education and Antisemitism Lessons Act


    This bill directs the U.S. Holocaust Memorial Museum to study and report on Holocaust
    education efforts in states, local educational agencies (LEAs), and public elementary
    and secondary schools. Among other elements, the study must (1) determine whether states
