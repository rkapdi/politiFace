  congress: 119
  title: FAIR Act
  action_date: '2025-03-25'
  action: Referred to the House Committee on Ways and Means.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/2314
  summary: 'Fair Access In Residency Act of 2025 or the FAIR Act of 2025


    This bill requires hospitals that receive graduate medical education (GME) payments under
    Medicare to report certain information about the composition of their medical residency
    training programs.


    Specifically, hospitals must provide to the Centers for Medicare & Medicaid Services (CMS)
    (1) the number of applicants for residencies who are from osteopathic medical schools
    and from allopathic medical schools, (2) the number of applicants who are accepted from
    each of these types of medical schools, and (3) an affirmation that the hospital considers
    applicants from each of these types of medical schools and accepts specified related examination
    results, as appropriate. Hospitals that do not provide this information are subject to
    a 2% reduction in their GME payments.


    The CMS must post the information it receives on a public website.'
  summary_version: Introduced in House
  summary_date: '2025-03-25'
