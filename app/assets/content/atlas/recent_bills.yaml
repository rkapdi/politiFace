  action: 'Read twice and referred to the Committee on Finance. (Sponsor introductory remarks
    on measure: CR S7964)'
  origin_chamber: Senate
  url: https://www.congress.gov/bill/119th-congress/senate-bill/3145
  summary: 'Comprehensive Alternative Response for Emergencies Act of 2025 or the CARE Act
    of 2025


    This bill requires the Center for Medicare and Medicaid Innovation (CMMI) to test a five-year
    model that provides for Medicare payment for ground ambulance services that do not result
    in the transport of the patient.


    Under the model, Medicare payment may be furnished for ground ambulance services when
    an ambulance is dispatched in response to an emergency medical call but the ambulance
    does not end up transporting the patient. Payment rates under the model must generally
    align with the payment rates that apply when there is an actual transport.


    The Government Accountability Office must report on the general access of Medicare beneficiaries
    to emergency medical services, including the impact of the model on beneficiary access
    and outcomes.'
  summary_version: Introduced in Senate
