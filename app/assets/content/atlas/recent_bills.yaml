- bill: S 2285
  congress: 118
  title: Native American Housing Assistance and Self-Determination Reauthorization Act of
    2023
  action_date: '2023-07-19'
  action: Committee on Indian Affairs. Ordered to be reported with an amendment favorably.
  origin_chamber: Senate
  url: https://www.congress.gov/bill/118th-congress/senate-bill/2285
  summary: 'Native American Housing Assistance and Self-Determination Reauthorization Act
    of 2023


    This bill provides federal housing assistance to Indians and Native Hawaiians.


    Specifically, the bill reauthorizes through FY2034 and otherwise revises the Indian Housing
    Block Grant program and the Native Hawaiian Housing Block Grant program. Among other revisions
    to these programs, the bill expands allowable housing activities under the Indian program
    to include education-related stipends, college housing assistance, and other education-related
    assistance for low-income college students.


    Next, the bill authorizes the Department of Housing and Urban Development (HUD) to guarantee
    housing loans for Indians and Native Hawaiians through FY2034.


    HUD may make grants to eligible recipients of block grants for use in eliminating drug-related
    and violent crime.


    Additionally, the bill provides statutory authority for the Tribal HUD-VASH program, which
    provides rental assistance and supportive services to Indian veterans who are homeless
    or at risk of homelessness and living in or near an area where a tribe or tribally designated
    housing entity provides assistance for affordable housing.


    HUD must use at least 5% of rental assistance amounts under the HUD-VASH program, which
    provides housing assistance to homeless veterans, for the Tribal HUD-VASH program. The
    Tribal HUD-VASH program must be carried out by HUD in conjunction with the Department
    of Veterans Affairs.


    Under the program, grants must be made to entities eligible for housing assistance block
    grants. HUD may make renewal grants to entities that have received prior program grants.'
  summary_version: Introduced in Senate
  summary_date: '2023-07-12'
  summary_truncated: false
- bill: HR 3449
  congress: 118
  title: Eric’s Law
  action_date: '2023-05-17'
  action: Referred to the House Committee on the Judiciary.
  origin_chamber: House
  url: https://www.congress.gov/bill/118th-congress/house-bill/3449
  summary: 'Eric''s Law


    This bill modifies procedures with respect to capital sentencing hearings involving a
    defendant who is serving a life sentence for murder and, while serving the life sentence,
    is convicted of another murder.


    If a jury at a capital sentencing hearing does not reach a unanimous recommendation on
    the defendant''s sentence and there is a motion by the attorney for the government, the
    court must order a new special sentencing hearing and impanel a new jury. If the new jury
    at the special sentencing hearing does not reach a unanimous recommendation on the defendant''s
    sentence, then the court is prohibited from imposing a death sentence.'
  summary_version: Introduced in House
  summary_date: '2023-05-17'
  summary_truncated: false
