  url: https://www.congress.gov/bill/119th-congress/house-bill/2114
  summary: 'Block Organ Transplant Purchases from China Act of 2025 or the Block Act of 2025


    This bill prohibits Medicare, Medicaid, and private health insurers from covering organ
    transplants that occur in China or that involve organs that are not procured through the
    U.S. Organ Procurement and Transplantation Network.


    The bill also prohibits health care providers from performing such a transplant or related
    services, except for life-saving services that are necessary as a result of such a transplant.
    Violations are subject to criminal and civil penalties.'
  summary_version: Introduced in House
