- bill: HR 9608
  congress: 119
  title: Less Bureaucracy, Better Family Engagement Act
  action_date: '2026-11-17'
  action: Placed on the Union Calendar, Calendar No. 775.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/9608
  summary: 'Less Bureaucracy, Better Family Engagement Act


    This bill transfers specified functions relating to family engagement programs for elementary
    and secondary education from the Department of Education (ED) to the Department of Health
    and Human Services (HHS).


    Specifically, the bill transfers to HHS all the functions and authorities exercised by
    ED before the bill''s effective date related to the following four programs: Family Engagement
    in Education Programs, the Community Support for School Success program, the National
    Activities for School Safety program, and the Ready to Learn Programming program. (In
    February 2026, ED announced an interagency agreement with HHS for HHS to provide services
    supporting the administration of these programs.)


    Additionally, the bill transfers to HHS all personnel and appropriations related to the
    functions that are transferred under this bill.


    The bill outlines the authority of the Office of Management and Budget (OMB) related to
    the functions that are transferred under this bill, including that OMB must ensure that
    this bill does not create a net increase in full-time equivalent employees at HHS or ED.
    Further, OMB must certify compliance with the bill to specified congressional committees.


    The transfer of these functions does not affect any suits, proceedings, or applications
    for benefits, services, licenses, permits, certificates, or financial assistance that
    are pending on the date of this bill''s enactment.'
  summary_version: Introduced in House
  summary_date: '2026-07-09'
