  congress: 119
  title: Communications Security Act
  action_date: '2025-07-16'
  action: Received in the Senate and Read twice and referred to the Committee on Commerce,
    Science, and Transportation.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/1717
  summary: 'Communications Security Act


    This bill provides statutory authority for a council established by the Federal Communications
    Commission (FCC) to provide advice regarding the security, reliability, and interoperability
    of communications networks. (This advice is currently provided by the FCC’s Communications
    Security, Reliability, and Interoperability Council.)


    The bill specifies that the FCC may designate an existing advisory committee to fulfill
    this role, provided the committee’s membership is modified, as necessary, to comply with
    membership requirements set forth in the bill.


    Specifically, the bill requires the council to include, to the extent practicable, representatives
    of companies in the communications industry; public interest organizations or academic
    institutions; and federal, state, tribal, and local governments (with at least one member
    representing each level of government). Members are to be selected by the FCC''s chair
    and generally may not include representatives of entities owned or controlled by, or subject
    to the influence of, a foreign adversary, or otherwise deemed to pose a threat to U.S.
    national security.


    Under current law, federal advisory committees must generally terminate after two years
    unless they are renewed or a statute specifies a different termination date. However,
    the bill exempts the council from this requirement.'
