  congress: 119
  title: Taxpayer Advocate Participation Act
  action_date: '2026-07-01'
  action: 'Ordered to be Reported in the Nature of a Substitute by the Yeas and Nays: 39 -
    0.'
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/9498
  summary: 'Taxpayer Advocate Participation Act


    This bill authorizes the National Taxpayer Advocate to appear as amicus curiae and submit
    amicus briefs in a U.S. court in cases involving federal tax law.


    Further, the bill requires federal courts to permit such appearances. (An amicus curiae
    is a person or group that is not a party in a court case but has an interest in the case
    and may be permitted to submit a brief, known as an amicus brief, to the court in relation
    to the case.) Under the bill, the National Taxpayer Advocate may present the views of
    the National Taxpayer Advocate in such a case only with respect to an issue which may
    broadly affect certain rights of taxpayers.


    As background, the National Taxpayer Advocate leads the Taxpayer Advocate Service, which
    is an independent organization within the Internal Revenue Service (IRS) responsible for
    helping taxpayers resolve problems with the IRS. The National Taxpayer Advocate is also
    responsible for proposing administrative and legislative changes to mitigate such problems.
    Under current law, the National Taxpayer Advocate is not authorized to appear as amicus
    curiae or submit amicus briefs in cases involving federal tax law.'
  summary_version: Introduced in House
  summary_date: '2026-06-29'
  summary_truncated: false
- bill: HR 4801
  congress: 119
  title: Unleashing AI Innovation in Financial Services Act
  action_date: '2026-06-24'
  action: Placed on the Union Calendar, Calendar No. 619.
  origin_chamber: House
  url: https://www.congress.gov/bill/119th-congress/house-bill/4801
  summary: 'Unleashing AI Innovation in Financial Services Act


    This bill allows regulated financial entities to test artificial intelligence (AI) projects
    under waived or modified regulations upon the approval of an application by the appropriate
    federal financial regulatory agency. These agencies must establish AI innovation labs
    to enable such projects.


    Under the bill, regulated entities may engage in AI test projects associated with financial
    products, services, or activities. Regulated entities must apply to the appropriate agency
    with a description and proposed duration of the AI test project, propose an alternative
    compliance strategy, and explain how the AI test project serves the public interest and
    does not present certain risks.


    The alternative compliance strategy must include several elements, such as (1) identifying
    a regulation issued by an agency that the regulated entity requests to be waived or modified
    and (2) proposing an alternative method of compliance with the regulation''s underlying
    statute. Upon approval, the agency may only enforce such a regulation according to the
    agreement.


    The bill also provides for agency review of such applications, establishes procedures
    for entities that are subject to regulation by multiple agencies, and allows agencies
    to file for injunctive relief if an AI test project presents certain risks or dangers.'
  summary_version: Reported to House
  summary_date: '2026-06-24'
  summary_truncated: false
