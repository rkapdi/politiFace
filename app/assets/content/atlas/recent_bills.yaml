- bill: S 304
  congress: 119
  title: Birthright Citizenship Act of 2025
  action_date: '2025-01-29'
  action: Read twice and referred to the Committee on the Judiciary.
  origin_chamber: Senate
  url: https://www.congress.gov/bill/119th-congress/senate-bill/304
  summary: 'Birthright Citizenship Act of 2025


    This bill limits birthright citizenship by redefining what it means to be subject to the
    jurisdiction of the United States.


    Currently, a person born in the United States and subject to U.S. jurisdiction is entitled
    to citizenship. Under the bill, a person is subject to U.S. jurisdiction if he or she
    is born to a parent who is (1) a U.S. citizen or national, (2) a lawful permanent resident
    residing in the United States, or (3) a non-U.S. national (alien under federal law) in
    lawful status who is performing active service in the Armed Forces.


    The bill does not affect the citizenship or nationality status of any person born before
    the bill''s enactment date.'
  summary_version: Introduced in Senate
  summary_date: '2025-01-29'
  summary_truncated: false
- bill: S 185
  congress: 119
  title: Justice for Victims of Sanctuary Cities Act of 2025
  action_date: '2025-01-22'
  action: Read twice and referred to the Committee on the Judiciary.
  origin_chamber: Senate
  url: https://www.congress.gov/bill/119th-congress/senate-bill/185
  summary: 'Justice for Victims of Sanctuary Cities Act of 2025


    This bill provides a private right of action against state and local jurisdictions with
    certain policies that limit cooperation with federal immigration enforcement efforts,
    and contains additional provisions related to such jurisdictions. Currently, such cooperation
    is generally not required.


    An individual (or certain relatives of such an individual) who is the victim of any felony
    for which an alien has been arrested, convicted, or sentenced to a prison term of at least
    one year may sue a state or local jurisdiction if the jurisdiction failed to comply with
    (1) certain Department of Homeland Security (DHS) requests related to arresting and detaining
    aliens, and (2) a DHS request to detain the alien in question or provide a notification
    about the release of the alien. A jurisdiction that accepts certain federal grants may
    not assert immunity in such a civil action.


    A jurisdiction (or employee of a jurisdiction) that complies with certain DHS detainer
    requests shall be deemed to be acting as an agent of DHS. A complying jurisdiction or
    employee of the jurisdiction shall not be liable in any lawsuit relating to compliance
    with such requests. In a lawsuit against an employee of the jurisdiction, the United States
    shall be substituted in as the defendant, and remedies shall be limited to provisions
    for bringing tort claims against the federal government.'
  summary_version: Introduced in Senate
  summary_date: '2025-01-22'
  summary_truncated: false
