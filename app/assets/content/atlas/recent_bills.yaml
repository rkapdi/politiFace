- bill: HR 2685
  congress: 117
  title: Understanding Cybersecurity of Mobile Networks Act
  action_date: '2021-12-02'
  action: Received in the Senate and Read twice and referred to the Committee on Commerce,
    Science, and Transportation.
  origin_chamber: House
  url: https://www.congress.gov/bill/117th-congress/house-bill/2685
  summary: 'Understanding Cybersecurity of Mobile Networks Act


    This bill requires the National Telecommunications and Information Administration to examine
    and report on the cybersecurity of mobile service networks and the vulnerability of these
    networks and mobile devices to cyberattacks and surveillance conducted by adversaries.


    The report shall include (1) an assessment of the degree to which providers of mobile
    service have addressed certain cybersecurity vulnerabilities; (2) a discussion of the
    degree to which these providers have implemented cybersecurity best practices and risk
    assessment frameworks; and (3) an estimate of the prevalence and efficacy of encryption
    and authentication algorithms and techniques used in mobile service and communications
    equipment, mobile devices, and mobile operating systems and software.'
  summary_version: Passed House
  summary_date: '2021-12-01'
  summary_truncated: false
- bill: HR 3151
  congress: 117
  title: Eric’s Law
  action_date: '2021-11-09'
  action: Referred to the Subcommittee on Crime, Terrorism, and Homeland Security.
  origin_chamber: House
  url: https://www.congress.gov/bill/117th-congress/house-bill/3151
  summary: 'Eric''s Law


    This bill modifies procedures with respect to capital sentencing hearings.


    If a jury at a capital sentencing hearing does not reach a unanimous recommendation on
    the defendant''s sentence and there is a motion by the attorney for the government, the
    court must order a new special sentencing hearing and impanel a new jury. If the new jury
    at the special sentencing hearing does not reach a unanimous recommendation on the defendant''s
    sentence, then the court is prohibited from imposing a death sentence.'
  summary_version: Introduced in House
  summary_date: '2021-05-12'
  summary_truncated: false
