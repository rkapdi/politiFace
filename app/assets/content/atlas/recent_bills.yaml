  title: A bill to designate the General George C. Marshall House, in the Commonwealth of
    Virginia, as an affiliated area of the National Park System, and for other purposes.
  action_date: '2026-09-25'
  action: 'Became Public Law No: 119-115.'
  origin_chamber: Senate
  url: https://www.congress.gov/bill/119th-congress/senate-bill/603
  summary: 'This bill establishes the General George C. Marshall House in Leesburg, Virginia,
    as an affiliated area of the National Park System to promote public appreciation of the
    historic contributions made by George Catlett Marshall, Jr. (George Catlett Marshall,
    Jr. served as Army Chief of Staff during World War II, and later as Secretary of State,
    president of the American Red Cross, and Secretary of Defense.)


    The bill designates the George C. Marshall International Center as the management entity
    for the affiliated area. The Department of the Interior must enter into an agreement with
    the center that describes the roles and responsibilities for management of the affiliated
    area. Further, Interior may provide technical assistance and enter into cooperative agreements
    with the center for the purpose of providing financial assistance for the marketing, marking,
    interpretation, and preservation of the affiliated area.'
