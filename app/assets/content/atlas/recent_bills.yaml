  summary: 'This bill authorizes the Department of the Army to transfer, without compensation
    or other consideration, all right, title, and interest to a specified 20-acre parcel of
    land on Fort Bragg to the State of North Carolina for the purpose of constructing a state
    home under the jurisdiction of the North Carolina Department of Military and Veterans
    Affairs. (A state home is a home established by a state for veterans who are disabled
    by age, disease, or otherwise and are incapable of earning a living because of such disability.
    The term also includes a home that furnishes nursing home care for veterans.)


    Specifically, the bill authorizes the conveyance of a 20-acre parcel of land situated
    on the Fort Bragg Training Area in Harnett County, North Carolina, that is commonly referred
    to as Parcel 3B.


    The State of North Carolina must cover all costs to carry out the conveyance.


    If the Department of the Army determines the property is not being used for activities
    related to a state home, all right, title, and interest in the property may revert to
    the United States.'
