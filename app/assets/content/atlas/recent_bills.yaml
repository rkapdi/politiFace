- bill: S 1363
  congress: 119
  title: New Mexico Land Grant-Mercedes Historical or Traditional Use Cooperation and Coordination
    Act
  action_date: '2026-07-23'
  action: Placed on Senate Legislative Calendar under General Orders. Calendar No. 476.
  origin_chamber: Senate
  url: https://www.congress.gov/bill/119th-congress/senate-bill/1363
  summary: 'New Mexico Land Grant-Mercedes Historical or Traditional Use Cooperation and Coordination
    Act


    This bill directs the Bureau of Land Management (BLM) and the Forest Service to enter
    a memorandum of understanding with the New Mexico Land Grant Council to describe existing
    processes that land grants-mercedes may use to obtain authorization for historical, traditional,
    or other uses of federal lands.


    Land grants-mercedes were created when Spain and Mexico issued grants of land to communities
    or individuals. When the United States acquired the land, including New Mexico, a process
    was created for adjudicating and recognizing these property rights. During that process,
    most land grants-mercedes lands became federal lands. Today, New Mexico recognizes 27
    community land grants-mercedes as political subdivisions.


    When entering into the memorandum of understanding, the BLM and the Forest Service must
    consult with Indian tribes.


    The memorandum of understanding must provide for (1) enhanced cooperation and coordination
    between the BLM, the Forest Service, and qualified land grants-mercedes; and (2) subsidiary
    agreements with certain land grants-mercedes for specific projects.


    Additionally, the bill outlines what the memorandum of understanding must describe, such
    as the procedures for notice and comments on land management planning decisions.


    Finally, the BLM and the Forest Service must include in land use plans a section that
    evaluates the impact of other uses in the plan on historical or traditional uses by land
    grants-mercedes.'
  summary_version: Introduced in Senate
  summary_date: '2025-04-09'
  summary_truncated: false
