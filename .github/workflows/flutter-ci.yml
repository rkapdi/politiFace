# The app's regression gate: analyze plus every test, including the smoke
# test that opens every screen (app/test/smoke). No build, no deploy.
#
# Runs on every PR to main, not only PRs that touch app/, so main can require
# it: a required check that never reports would block merging. When app/ is
# untouched the job passes in seconds without installing Flutter.
#
# Same checks locally: scripts/check-app.sh

name: Flutter CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    branches: [main]

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-analyze:
    name: Test + Analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Did the app change?
        id: changes
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" \
              | grep -Eq '^(app/|scripts/check-app\.sh$|\.github/workflows/flutter-ci\.yml$)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "No app changes; nothing to check."
          fi

      - name: Setup Flutter
        if: steps.changes.outputs.app == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Cache pub packages
        if: steps.changes.outputs.app == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            app/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies
        if: steps.changes.outputs.app == 'true'
        run: flutter pub get

      - name: Generate Drift code
        if: steps.changes.outputs.app == 'true'
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        if: steps.changes.outputs.app == 'true'
        # flutter analyze exits non-zero on infos by default. Gate only on
        # errors and warnings; infos are style preferences. Flutter 3.22
        # prints the severity at the start of the line, so the pattern must
        # not require leading whitespace (it did, and let warnings through).
        run: |
          flutter analyze 2>&1 | tee /tmp/analyze.txt
          if grep -qE "^\s*(warning|error) •" /tmp/analyze.txt; then
            echo "::error::flutter analyze found warnings or errors"
            exit 1
          fi
          echo "OK: no warnings or errors (infos are advisory)."

      - name: Smoke test (every screen opens)
        if: steps.changes.outputs.app == 'true'
        run: flutter test test/smoke --reporter expanded

      - name: Run tests
        if: steps.changes.outputs.app == 'true'
        run: flutter test --reporter expanded
