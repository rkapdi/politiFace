# ============================================================
# Changelog for /changelog
# ============================================================
# This file IS the page content. Add a new entry at the top in the
# same PR as the change; it goes live when that PR merges to main.
# CI runs scripts/validate_changelog.py against this file.
#
# Each entry:
#   id:        stable slug, used as the page anchor. Never rename one.
#   date:      YYYY-MM-DD. Newest first.
#   platform:  iOS | Web | Website | Content
#   version:   iOS only, the marketing version in app/pubspec.yaml.
#   build:     iOS only, the build number in app/pubspec.yaml.
#   channel:   (optional) App Store, only once Apple shows it released.
#   title:     the main theme, as a short phrase.
#   items:     one plain sentence each, ending in a period. Say what a
#              person can now do. No internal names, plans, or partners.
#   link:      (optional) the public PR or release page.
#
# Public page: no em-dashes, no people, schools, or plans.

- id: web-2026-10-31-console
  date: 2026-10-31
  platform: Web
  title: One console for instructors and students
  items:
    - The old faculty page now opens the class console, which has everything it did.
    - Class messages now alert student phones, and instructors can message a class and see past messages from the top of any class page.
    - The class page remembers its open tab when you go into a student or a session and come back.
    - The Students tab is now a single table with a name search and one export.
    - Live sessions show how many students have answered, ask before ending for everyone, and end with final standings, per-question results, and a printable report.
    - The session question picker can filter by domain or to your own questions.
    - A reteach suggestion now opens a new session on the weak domain.
    - Students enter one code for a class or a live session, without choosing which kind it is.
    - A new class opens directly on its own page, and an instructor reopening an old invite link goes straight to their classes.

- id: web-2026-10-31-changelog
  date: 2026-10-31
  platform: Website
  title: This changelog
  items:
    - Added this page, covering every build and web release back to the first one.

- id: ios-34
  date: 2026-10-07
  platform: iOS
  version: 1.3.2
  build: 34
  channel: App Store
  title: Sounds and motion
  items:
    - A new sound set covers right and wrong answers, card flips, finished rounds, passing a mock exam, joining a class, and streaks.
    - Your chosen answer pops when it is right and shakes when it is wrong across onboarding, practice, trivia, rounds, Endless, and live sessions.
    - Scores count up, and confetti marks your onboarding result and a passed mock exam. All of it respects Reduce Motion, and sounds respect the silent switch.
    - Streak sounds play at 3, 7, 14, 30, 50, 100, and 365 days, and at 5, 10, and 20 answers in a row.
    - Onboarding is now a 5-question check, then your score, then an account step that takes any email.
    - The guided tour spotlight follows its target, and the exam-date picker title no longer gets cut off.
    - The app now tells our admin console when it is open, and reports sign-in failures, refused joins, and errors, so we can spot problems.

- id: web-2026-10-07-admin
  date: 2026-10-07
  platform: Web
  title: Admin console
  items:
    - Added an internal admin console for the Politiface team, with search, activity, and records for people, classes, and sessions.
    - Every instructor-access change made in the admin console now lands in an audit log.
    - The web console reports sign-in failures, refused joins, and errors to a problem log, and shows when someone was last online.

- id: web-2026-10-04-class-names
  date: 2026-10-04
  platform: Web
  title: Neutral class names
  items:
    - Class names and session titles can no longer contain course codes or section numbers.
    - The console suggests neutral names such as Section A.
    - Sign-up now asks for any email, and the join page reminds students to reuse the email from the app so they keep one account.

- id: ios-33
  date: 2026-09-28
  platform: iOS
  version: 1.3.2
  build: 33
  title: Join a class from anywhere
  items:
    - Students not yet in a class can join with a class code from Home or Account.

- id: web-2026-09-28-onboarding
  date: 2026-09-28
  platform: Web
  title: Invite links and browser students
  items:
    - Instructors can be invited with a single-use link that expires after 14 days and walks them through setting up a first class.
    - Anyone signed in without a role can request instructor access instead of hitting an error.
    - The home page now depends on who you are. Staff and instructors get the console, and students get their classes and a way to join one.
    - Students in a browser sign in with the same email code as the app and join live sessions as themselves.
    - Guest access to a live session is now off by default and can be turned on per session.
    - The class page shows its join code, instructors can watch their own live sessions, and reports say Joined, no answers instead of 0/0.
    - Display names can now include spaces and name punctuation.

- id: web-2026-09-27-questions
  date: 2026-09-27
  platform: Web
  title: Your own questions
  items:
    - Instructors can write, edit, and remove their own class-scoped questions from the Live tab.
    - Editing a question keeps past session results on the wording students actually saw.
    - The class summary one-pager now opens as a printable page.
    - Instructors can manage their account, including changing email, signing out everywhere, and deleting the account with a class transfer.
    - A live session draft now survives switching tabs.

