- id: ios-32
  date: 2026-08-30
  platform: iOS
  version: 1.3.1
  build: 32
  title: Washington fast lane
  items:
    - Pulse has a White House lane that shows presidential actions the same day, with badges and a filter.
    - Tapping an alert now opens the exact action it was about, even from a cold start.
    - Fixed Washington alerts, which had silently stopped sending.
    - The readiness projection now follows your recent answers and no longer starts too high after a cold diagnostic.
    - The readiness bar scales down instead of clipping on narrow screens.

- id: web-2026-08-30-coaching
  date: 2026-08-30
  platform: Web
  title: Class pulse and coaching queue
  items:
    - Classes open with a pulse banner, action cards, and a score distribution against the pass line.
    - The Students tab is now a coaching queue, with the lowest projected score first.
    - Each student page shows a weekly trend against the pass line and can assign weak-area practice in one click.
    - Instructor views now use the same readiness calculation as the app.
    - New shared design foundations cover icons, loading states, empty states, and error fallbacks.

- id: web-2026-08-22-console
  date: 2026-08-22
  platform: Web
  title: New web console
  items:
    - Politiface moved to politiface.app, with a new web console at politiface.app/app.
    - Instructors can sign in with an email code, create classes, and see domain and engagement analytics per class.
    - Added an at-risk list, roster progress, and CSV exports, with exports logged.
    - Added a per-student page with suggested next steps.
    - Each class has its own reporting setting, enforced on the server, and instructors can add teaching assistants.
    - The live session console has QR join and realtime phases, and guests can join from a browser.
    - The console went through a WCAG 2.1 AA pass, with automated accessibility checks in CI.

