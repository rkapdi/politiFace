# ============================================================
# Link-in-bio config for /links
# ============================================================
# This file IS the page content. Edit it, commit, and GitHub
# Pages republishes automatically. No code changes needed.
#
# Each entry:
#   id:        stable slug; becomes utm_content and the analytics
#              event key. Never reuse or rename an id once live.
#   label:     the button text.
#   sublabel:  (optional) small second line under the label.
#   href:      full URL for external links (https://...), or a
#              site path starting with / for internal pages, or
#              mailto:someone@politiface.io.
#   group:     primary | main | connect | institutional
#   featured:  (optional) true puts it in the spotlight slot at
#              the top of the MAIN group. Keep exactly one, tied
#              to the current reel.
#   visible:   false hides the link without deleting it.
#
# Order within this file is the order on the page.

# ---- PRIMARY (the one big button) --------------------------
- id: download-ios
  label: Download Politiface
  sublabel: Free on the App Store
  href: https://apps.apple.com/us/app/politiface/id6774765582
  group: primary
  visible: true

